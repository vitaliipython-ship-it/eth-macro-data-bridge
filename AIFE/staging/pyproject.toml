[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aife"
version = "0.1.0"
description = "AIFE ecosystem application"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "AIFE Team" }]
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = [
    "ai*",
    "blockchain*",
    "communication*",
    "core*",
    "initializer*",
    "monitoring*",
    "patterns*",
    "resources*",
    "security*",
    "server*",
    "ui*",
]
exclude = ["tests*", "docs*"]

[tool.black]
line-length = 120
exclude = "(venv|.git|__pycache__|docs|deploy|.pytest_cache|logs)"

[tool.isort]
profile = "black"
line_length = 120
skip = ["venv", ".git", "__pycache__", "docs", "deploy", "logs", ".pytest_cache"]
skip_gitignore = true
sections = "FUTURE,STDLIB,THIRDPARTY,FIRSTPARTY,LOCALFOLDER"
default_section = "THIRDPARTY"
known_third_party = ["requests", "flask", "PySide6", "qasync", "numpy"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_unused_ignores = true
warn_return_any = true
strict_optional = true
check_untyped_defs = true
exclude = "^(venv|\\.git|__pycache__|docs|deploy|\\.pytest_cache|logs|\\.mypy_cache)([/\\\\])"
mypy_path = "core;ai;blockchain;communication;ui;initializer;server"

[tool.pylint]
max-line-length = 120
max-module-lines = 1500
extension-pkg-allow-list = ["PySide6", "shiboken6"]
ignore = ["venv", ".git", "__pycache__", "docs", "logs", "deploy", ".pytest_cache", "htmlcov"]
ignore-paths = [
    "^venv/.*",
    "^\\.git/.*",
    "^__pycache__/.*",
    "^docs/.*",
    "^deploy/.*",
    "^logs/.*",
    "^htmlcov/.*",
]
ignored-modules = ["PySide6", "PySide6.QtCore", "PySide6.QtWidgets", "PySide6.QtGui", "qasync", "pytest", "dotenv"]

[tool.pylint.messages-control]
disable = []

[tool.pylint.basic]
# Разрешить camelCase имена методов — обязательно для переопределения виртуальных
# методов Qt (enterEvent, leaveEvent, mousePressEvent, mouseReleaseEvent и др.);
# стандарт Qt использует camelCase, Python — snake_case.
method-rgx = "([a-z_][a-z0-9_]{2,}|[a-z][a-zA-Z0-9]{2,})$"

[tool.pylint.design]
# Для performance benchmark классов достаточно 1 метода
min-public-methods = 1
# MainWindow наследует QMainWindow и переопределяет несколько Qt-методов (camelCase),
# что естественно увеличивает счётчик публичных методов сверх стандартного лимита 20.
max-public-methods = 25

[tool.pyright]
extraPaths = ["core", "ai", "blockchain", "communication", "ui", "initializer", "server"]
skip = ["venv", ".git", "__pycache__", "docs", "deploy", "logs", ".pytest_cache", "scripts"]
useLibraryCodeForTypes = true
typeCheckingMode = "standard"

[tool.coverage.run]
source = ["core", "ai", "blockchain", "communication", "ui", "initializer", "monitoring", "patterns", "resources", "security", "server"]
omit = [
    "venv/*",
    ".git/*",
    "__pycache__/*",
    "docs/*",
    "deploy/*",
    ".pytest_cache/*",
    "logs/*",
    "scripts/*",
    ".mypy_cache/*",
    "htmlcov/*",
    # PySide6/shiboken временные файлы
    "pyscript/*",
    "shibokensupport/*",
    # Тестовые файлы
    "tests/*",
    # Setup файлы
    "setup.py",
    "setup.cfg"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*Protocol\\):",
    "@(abc\\.)?abstractmethod"
]
ignore_errors = true
show_missing = true

[tool.coverage.html]
directory = "htmlcov"

[tool.flake8]
max-line-length = 120

[tool.aife.logging.retention]
security_days = 90
audit_days = 365
blockchain_audit_days = 2555
