name: Update market bridge
on:
  workflow_dispatch:
  schedule:
    - cron: "35 * * * *"
permissions:
  contents: write
concurrency:
  group: market-bridge-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Collect public market data
        run: python collector.py
      - name: Validate manifest and datasets
        run: python validate.py
      - name: Show concise summary and sizes
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("data/manifest.json").read_text())
          print("BRIDGE_STATUS="+m["bridge_status"])
          print("BINANCE_STATUS="+m["providers"]["binance"]["status"])
          print("KRAKEN_STATUS="+m["providers"]["kraken"]["status"])
          print("GENERATED_AT="+m["generated_at_utc"])
          for p in sorted(Path("data").rglob("*.json")): print(f"JSON_SIZE_BYTES={p.stat().st_size} PATH={p.as_posix()}")
          PY
      - name: Commit refreshed bridge data
        shell: bash
        run: |
          if git diff --quiet -- data; then echo "No generated data change."; exit 0; fi
          git config user.name "eth-macro-data-bridge[bot]"
          git config user.email "eth-macro-data-bridge[bot]@users.noreply.github.com"
          git add data
          git commit -m "data: refresh public market snapshot"
          git push
