name: Probe Kraken OHLCVT range access

on:
  push:
    branches:
      - agent/issue-66-kraken-range-probe
    paths:
      - ".github/workflows/probe-kraken-ohlcvt-range.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe official Kraken OHLCVT archive
        shell: bash
        run: |
          python - <<'PY'
          import http.cookiejar
          import io
          import re
          import urllib.parse
          import urllib.request
          import zipfile
          from html.parser import HTMLParser

          FILE_ID = "1ptNqWYidLkhb2VAKuLCxmp2OXEfGO-AP"
          LANDING = f"https://drive.google.com/uc?export=download&id={FILE_ID}"
          HEADERS = {"User-Agent": "eth-macro-data-bridge/1.0"}
          jar = http.cookiejar.CookieJar()
          opener = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))

          class DownloadForm(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.action = None
                  self.inputs = {}
                  self.in_form = False
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == "form" and "download" in (attrs.get("action") or ""):
                      self.in_form = True
                      self.action = attrs.get("action")
                  elif self.in_form and tag == "input" and attrs.get("name"):
                      self.inputs[attrs["name"]] = attrs.get("value", "")
              def handle_endtag(self, tag):
                  if tag == "form" and self.in_form:
                      self.in_form = False

          req = urllib.request.Request(LANDING, headers=HEADERS)
          with opener.open(req, timeout=60) as response:
              raw = response.read(64 * 1024)
              print("LANDING_STATUS=", response.status)
              print("LANDING_FINAL_URL=", response.geturl())
              print("LANDING_CONTENT_TYPE=", response.headers.get("Content-Type"))
          parser = DownloadForm()
          parser.feed(raw.decode("utf-8", errors="replace"))
          if not parser.action or not parser.inputs:
              print("LANDING_PREFIX=", raw[:1000].decode("utf-8", errors="replace"))
              raise SystemExit("CONFIRMATION_FORM=FAIL")
          print("CONFIRMATION_FORM=PASS")
          print("CONFIRMATION_FIELDS=", ",".join(sorted(parser.inputs)))
          download_url = parser.action + "?" + urllib.parse.urlencode(parser.inputs)

          req = urllib.request.Request(download_url, headers={**HEADERS, "Range": "bytes=0-0"})
          with opener.open(req, timeout=60) as response:
              body = response.read(1)
              final_url = response.geturl()
              status = response.status
              content_range = response.headers.get("Content-Range") or ""
              print("PROBE_FINAL_URL=", final_url)
              print("PROBE_STATUS=", status)
              print("PROBE_CONTENT_RANGE=", content_range)
              print("PROBE_ACCEPT_RANGES=", response.headers.get("Accept-Ranges"))
              print("PROBE_CONTENT_LENGTH=", response.headers.get("Content-Length"))
              print("PROBE_CONTENT_TYPE=", response.headers.get("Content-Type"))
              print("PROBE_CONTENT_DISPOSITION=", response.headers.get("Content-Disposition"))
              print("PROBE_FIRST_BYTE_HEX=", body.hex())
          match = re.fullmatch(r"bytes 0-0/(\d+)", content_range)
          if status != 206 or not match:
              raise SystemExit("RANGE_PROBE=FAIL")
          size = int(match.group(1))

          class RangeIO(io.RawIOBase):
              def __init__(self, url, size):
                  self.url = url
                  self.size = size
                  self.pos = 0
              def seekable(self):
                  return True
              def readable(self):
                  return True
              def tell(self):
                  return self.pos
              def seek(self, offset, whence=io.SEEK_SET):
                  if whence == io.SEEK_SET:
                      target = offset
                  elif whence == io.SEEK_CUR:
                      target = self.pos + offset
                  elif whence == io.SEEK_END:
                      target = self.size + offset
                  else:
                      raise ValueError(whence)
                  if target < 0:
                      raise ValueError("negative seek")
                  self.pos = min(target, self.size)
                  return self.pos
              def read(self, amount=-1):
                  if self.pos >= self.size:
                      return b""
                  if amount is None or amount < 0:
                      amount = self.size - self.pos
                  end = min(self.size - 1, self.pos + amount - 1)
                  request = urllib.request.Request(
                      self.url,
                      headers={**HEADERS, "Range": f"bytes={self.pos}-{end}"},
                  )
                  with opener.open(request, timeout=120) as response:
                      if response.status != 206:
                          raise RuntimeError(f"range read returned HTTP {response.status}")
                      data = response.read()
                  expected = end - self.pos + 1
                  if len(data) != expected:
                      raise RuntimeError(f"range length mismatch: {len(data)} != {expected}")
                  self.pos = end + 1
                  return data

          with zipfile.ZipFile(RangeIO(final_url, size)) as archive:
              names = archive.namelist()
              wanted = {}
              for target in ("ETHUSD_5.csv", "ETHUSD_1440.csv"):
                  matches = [name for name in names if name.endswith(target)]
                  if len(matches) != 1:
                      raise RuntimeError(f"expected one {target}, got {matches}")
                  info = archive.getinfo(matches[0])
                  wanted[target] = (matches[0], info.file_size, info.compress_size, info.CRC)
              print("ZIP_MEMBER_COUNT=", len(names))
              for target, values in wanted.items():
                  print("ZIP_MEMBER=", target, *values)

          print("RANGE_PROBE=PASS")
          print("REMOTE_ZIP_CENTRAL_DIRECTORY=PASS")
          print("TARGET_MEMBERS_FOUND=PASS")
          PY
