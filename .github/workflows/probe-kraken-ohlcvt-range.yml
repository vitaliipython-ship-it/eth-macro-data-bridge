name: Probe Kraken OHLCVT range access

on:
  push:
    branches:
      - agent/issue-66-kraken-range-probe
    paths:
      - ".github/workflows/probe-kraken-ohlcvt-range.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Classify official Kraken OHLCVT download response
        shell: bash
        run: |
          python - <<'PY'
          import http.cookiejar
          import urllib.parse
          import urllib.request
          from html.parser import HTMLParser

          FILE_ID = "1ptNqWYidLkhb2VAKuLCxmp2OXEfGO-AP"
          LANDING = f"https://drive.google.com/uc?export=download&id={FILE_ID}"
          HEADERS = {"User-Agent": "Mozilla/5.0 eth-macro-data-bridge/1.0"}
          jar = http.cookiejar.CookieJar()
          opener = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))

          class Forms(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.forms = []
                  self.current = None
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == "form":
                      self.current = {"action": attrs.get("action"), "method": attrs.get("method", "get"), "inputs": {}}
                      self.forms.append(self.current)
                  elif tag == "input" and self.current is not None and attrs.get("name"):
                      self.current["inputs"][attrs["name"]] = attrs.get("value", "")
              def handle_endtag(self, tag):
                  if tag == "form":
                      self.current = None

          def get(url, range_header=None):
              headers = dict(HEADERS)
              if range_header:
                  headers["Range"] = range_header
              req = urllib.request.Request(url, headers=headers)
              with opener.open(req, timeout=60) as response:
                  body = response.read(64 * 1024)
                  return response, body

          landing_response, landing = get(LANDING)
          first = Forms(); first.feed(landing.decode("utf-8", errors="replace"))
          print("LANDING_STATUS=", landing_response.status)
          print("LANDING_FORMS=", len(first.forms))
          for index, form in enumerate(first.forms):
              print("LANDING_FORM=", index, form["method"], form["action"], sorted(form["inputs"]))
          candidate = next((form for form in first.forms if form["action"] and "download" in form["action"]), None)
          if candidate is None:
              print("LANDING_HTML=", landing.decode("utf-8", errors="replace")[:4000].replace("\n", " "))
              raise SystemExit("CONFIRMATION_FORM=FAIL")

          download_url = candidate["action"] + "?" + urllib.parse.urlencode(candidate["inputs"])
          response, body = get(download_url, "bytes=0-0")
          print("DOWNLOAD_STATUS=", response.status)
          print("DOWNLOAD_FINAL_URL=", response.geturl())
          print("DOWNLOAD_CONTENT_TYPE=", response.headers.get("Content-Type"))
          print("DOWNLOAD_CONTENT_LENGTH=", response.headers.get("Content-Length"))
          print("DOWNLOAD_CONTENT_RANGE=", response.headers.get("Content-Range"))
          print("DOWNLOAD_DISPOSITION=", response.headers.get("Content-Disposition"))
          if "text/html" not in (response.headers.get("Content-Type") or ""):
              print("BYTE_RESPONSE=PASS")
              raise SystemExit(0)

          second = Forms(); second.feed(body.decode("utf-8", errors="replace"))
          print("SECOND_FORMS=", len(second.forms))
          for index, form in enumerate(second.forms):
              print("SECOND_FORM=", index, form["method"], form["action"], sorted(form["inputs"]))
          text = body.decode("utf-8", errors="replace")
          print("SECOND_HTML=", text[:5000].replace("\n", " "))
          print("HTML_RESPONSE_CLASSIFIED=PASS")
          PY
