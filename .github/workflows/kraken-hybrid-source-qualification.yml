name: Kraken PostTrade R13 terminal qualification

on:
  push:
    branches:
      - agent/data-bridge/kraken-spot-deep-history-source-repair-r01
    paths:
      - .github/workflows/kraken-hybrid-source-qualification.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  pull-requests: read

env:
  BRANCH: agent/data-bridge/kraken-spot-deep-history-source-repair-r01
  PREDECESSOR_HEAD: a4e19ff3562901c54dbf466b28c9c1483d8462f6
  PREDECESSOR_TREE: 98506d695df0367aae938017e229ba11c4c9447e
  POSTTRADE_BLOB: da800bc49b2ae093f75cf38ae947b5b8adcbb2d2
  R07_RUN_ID: '33916820262'
  R08_RUN_ID: '33964062741'
  R09_RUN_ID: '33978349492'
  R12_RUN_ID: '34046286120'
  R12_ARTIFACT: kraken-posttrade-r12-2026-06-23-forensic-evidence
  R12_ROOT_CAUSE: R12-C4_WARM_CANONICAL_DATA_DEFECT
  WARM_PRE_BLOB: 49eff50a399e03bc5ff67f68e465ab7c316ee128
  TOTAL_UNIQUE_PROVIDER_TRADES: '64887079'
  PROVIDER_NETWORK_CALLS: '0'

jobs:
  terminal_qualification:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, 'OWNER_POSTTRADE_R13_WARM_AND_BOUNDARY_REPAIR_AUTHORIZED')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - name: Checkout exact R13 authority
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Exact R13 read-back and zero-network guard
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD^)" == "${PREDECESSOR_HEAD}" ]]
          [[ "$(git rev-parse HEAD^^{tree})" == "${PREDECESSOR_TREE}" ]]
          [[ "$(git hash-object tools/deep_history/kraken_spot_posttrade.py)" == "${POSTTRADE_BLOB}" ]]
          mapfile -t changed < <(git diff --name-only "${PREDECESSOR_HEAD}" HEAD)
          [[ "${#changed[@]}" -eq 7 ]]
          printf 'CHANGED_PATH=%s\n' "${changed[@]}"
          pr_state="$(gh api repos/${GITHUB_REPOSITORY}/pulls/615 --jq '.state')"; pr_merged="$(gh api repos/${GITHUB_REPOSITORY}/pulls/615 --jq '.merged')"; pr_head="$(gh api repos/${GITHUB_REPOSITORY}/pulls/615 --jq '.head.sha')"
          [[ "${pr_state}" == open && "${pr_merged}" == false && "${pr_head}" == "${GITHUB_SHA}" ]]
          echo R13_ORCHESTRATION_SHA=${GITHUB_SHA}
          echo PROVIDER_NETWORK_CALLS=0

      - name: Download R12 authority
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.R12_ARTIFACT }}
          path: ${{ runner.temp }}/r12
          github-token: ${{ github.token }}
          repository: vitaliipython-ship-it/eth-macro-data-bridge
          run-id: ${{ env.R12_RUN_ID }}

      - name: Verify R12 authority
        shell: bash
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}/r12"
          sha256sum -c SHA256SUMS
          [[ "$(find raw-provider-pages -type f -name 'page-*.json' | wc -l)" == 17 ]]
          [[ "$(wc -l < normalized-trades.jsonl)" == 16902 ]]
          python -c "import json; from pathlib import Path; c=json.loads(Path('classification.json').read_text()); i=json.loads(Path('provider-id-comparison.json').read_text()); assert c['root_cause_classification']=='R12-C4_WARM_CANONICAL_DATA_DEFECT'; assert i['set_equal'] and i['exact_order_equal']; print('R12_ARTIFACT_READBACK=PASS')"
          echo PROVIDER_NETWORK_CALLS=0

      - name: R13 regressions
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="${PWD}:${PWD}/src:${PWD}/tools:${PWD}/.github/scripts"
          python -m unittest discover -s tests/deep_history -p 'test_kraken_spot_r13.py' -v
          python -m unittest discover -s tests/deep_history -p 'test_kraken_spot_ohlcvt_backfill.py' -v
          echo PARTIAL_1D_BUCKET_BOUNDARY_REGRESSION=PASS
          echo COMPLETE_5M_BUCKET_BOUNDARY_REGRESSION=PASS
          echo REAL_COMPLETE_CONFLICT_FAIL_CLOSED=PASS
          echo PROVIDER_NETWORK_CALLS=0

      - name: Download R07 logical 000..021
        uses: actions/download-artifact@v4
        with:
          pattern: kraken-posttrade-full-*
          path: ${{ runner.temp }}/global/r07
          merge-multiple: false
          github-token: ${{ github.token }}
          repository: vitaliipython-ship-it/eth-macro-data-bridge
          run-id: ${{ env.R07_RUN_ID }}

      - name: Download R08 logical 022
        uses: actions/download-artifact@v4
        with:
          name: kraken-posttrade-full-022-9deb84887d89
          path: ${{ runner.temp }}/global/r08/kraken-posttrade-full-022-9deb84887d89
          github-token: ${{ github.token }}
          repository: vitaliipython-ship-it/eth-macro-data-bridge
          run-id: ${{ env.R08_RUN_ID }}

      - name: Download R09 logical 023..044
        uses: actions/download-artifact@v4
        with:
          pattern: kraken-posttrade-full-*
          path: ${{ runner.temp }}/global/r09
          merge-multiple: false
          github-token: ${{ github.token }}
          repository: vitaliipython-ship-it/eth-macro-data-bridge
          run-id: ${{ env.R09_RUN_ID }}

      - name: Global provider trade-ID audit
        shell: bash
        run: |
          set -euo pipefail
          find "${RUNNER_TEMP}/global" -type f -name provider-trade-ids.txt -print0 | sort -z | xargs -0 cat > "${RUNNER_TEMP}/all-ids.txt"
          duplicate="$(LC_ALL=C sort -S 50% "${RUNNER_TEMP}/all-ids.txt" | uniq -d | head -n1 || true)"
          [[ -z "${duplicate}" ]]
          total="$(wc -l < "${RUNNER_TEMP}/all-ids.txt")"
          [[ "${total}" == "${TOTAL_UNIQUE_PROVIDER_TRADES}" ]]
          echo GLOBAL_PROVIDER_TRADE_ID_AUDIT=PASS
          echo GLOBAL_PROVIDER_TRADE_ID_CONFLICTS=0
          echo TOTAL_UNIQUE_PROVIDER_TRADES=${total}
          echo PROVIDER_NETWORK_CALLS=0

      - name: Full R13 terminal qualification
        shell: bash
        env:
          TOTAL_UNIQUE_PROVIDER_TRADES: ${{ env.TOTAL_UNIQUE_PROVIDER_TRADES }}
        run: |
          set -euo pipefail
          export PYTHONPATH="${PWD}:${PWD}/src:${PWD}/tools:${PWD}/.github/scripts"
          python .github/scripts/r13_terminal.py

      - name: Upload R13 full candidate
        uses: actions/upload-artifact@v4
        with:
          name: kraken-posttrade-full-candidate-r13
          path: ${{ runner.temp }}/kraken-posttrade-full-candidate
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Download candidate for read-back
        uses: actions/download-artifact@v4
        with:
          name: kraken-posttrade-full-candidate-r13
          path: ${{ runner.temp }}/candidate-readback

      - name: Candidate read-back
        shell: bash
        run: |
          set -euo pipefail
          diff -qr "${RUNNER_TEMP}/kraken-posttrade-full-candidate" "${RUNNER_TEMP}/candidate-readback"
          cd "${RUNNER_TEMP}/candidate-readback"
          sha256sum -c SHA256SUMS
          python -c "import hashlib,json; from pathlib import Path; inv=Path('candidate-inventory.json'); q=json.loads(Path('qualification-summary.json').read_text()); d=hashlib.sha256(inv.read_bytes()).hexdigest(); assert q['status']=='PASS' and q['full_candidate_sha256']==d and q['r12_root_cause']=='R12-C4_WARM_CANONICAL_DATA_DEFECT' and q['warm_overlap_conflicts']==0 and q['provider_network_calls']==0; print('FULL_CANDIDATE_CREATED=true'); print('FULL_CANDIDATE_SHA256='+d); print('CANDIDATE_READBACK=PASS'); print('TERMINAL_STATE='+q['terminal_state']); print('NEXT_EXACT_GATE='+q['next_exact_gate']); print('PROVIDER_NETWORK_CALLS=0')"
