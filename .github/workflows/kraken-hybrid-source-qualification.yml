name: Kraken PostTrade R10 terminal qualification

on:
  push:
    branches:
      - agent/data-bridge/kraken-spot-deep-history-source-repair-r01
    paths:
      - .github/workflows/kraken-hybrid-source-qualification.yml

permissions:
  contents: read
  actions: read

env:
  SOURCE_AUTHORITY_SHA: "91546fdd81471851c2cb6b948821c04cfe636f1c"
  SOURCE_AUTHORITY_TREE: "6deb789f26424845fae52593abb68f09c73801e0"
  R07_RUN_ID: "33916820262"
  R08_RUN_ID: "33964062741"
  R09_RUN_ID: "33978349492"
  R09_ORCHESTRATION_SHA: "262b2b99c8d359c6da785430c1990ed6df0d048b"
  EXPECTED_R10_CONTINUITY_BLOB: "2ea37641fca4a3fad14edcd412f25351d67de604"
  EXPECTED_R10_CONTINUITY_TEST_BLOB: "e9ef35b065156e8c4a64c9b64fc16a9480c30fdf"
  EXPECTED_R10_TERMINAL_BLOB: "05f5fbaa1ac6eb9517d4438314e42c3f7fd970d5"
  PROVIDER_NETWORK_CALLS: "0"

jobs:
  repository_and_repair_identity:
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, 'OWNER_POSTTRADE_R10_TERMINAL_QUALIFICATION_READY') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact production source authority
        uses: actions/checkout@v6
        with:
          repository: vitaliipython-ship-it/eth-macro-data-bridge
          ref: ${{ env.SOURCE_AUTHORITY_SHA }}
          path: production
          fetch-depth: 1

      - name: Checkout exact R10 orchestration authority
        uses: actions/checkout@v6
        with:
          repository: vitaliipython-ship-it/eth-macro-data-bridge
          ref: ${{ github.sha }}
          path: orchestration
          fetch-depth: 1

      - name: Set up canonical Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Verify source and tracked R10 identities
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git -C production rev-parse HEAD)" == "${SOURCE_AUTHORITY_SHA}" ]]
          [[ "$(git -C production rev-parse HEAD^{tree})" == "${SOURCE_AUTHORITY_TREE}" ]]
          [[ "$(git -C orchestration rev-parse HEAD)" == "${GITHUB_SHA}" ]]

          [[ "$(git -C orchestration hash-object .github/scripts/r10_continuity.py)" == "${EXPECTED_R10_CONTINUITY_BLOB}" ]]
          [[ "$(git -C orchestration hash-object .github/scripts/r10_continuity_test.py)" == "${EXPECTED_R10_CONTINUITY_TEST_BLOB}" ]]
          [[ "$(git -C orchestration hash-object .github/scripts/r10_terminal.py)" == "${EXPECTED_R10_TERMINAL_BLOB}" ]]

          echo "TRACKED_WORKFLOW_GIT_BLOB=$(git -C orchestration hash-object .github/workflows/kraken-hybrid-source-qualification.yml)"
          echo "TRACKED_WORKFLOW_SHA256=$(sha256sum orchestration/.github/workflows/kraken-hybrid-source-qualification.yml | awk '{print $1}')"
          echo "R10_CONTINUITY_GIT_BLOB=$(git -C orchestration hash-object .github/scripts/r10_continuity.py)"
          echo "R10_CONTINUITY_SHA256=$(sha256sum orchestration/.github/scripts/r10_continuity.py | awk '{print $1}')"
          echo "R10_CONTINUITY_TEST_GIT_BLOB=$(git -C orchestration hash-object .github/scripts/r10_continuity_test.py)"
          echo "R10_CONTINUITY_TEST_SHA256=$(sha256sum orchestration/.github/scripts/r10_continuity_test.py | awk '{print $1}')"
          echo "R10_TERMINAL_GIT_BLOB=$(git -C orchestration hash-object .github/scripts/r10_terminal.py)"
          echo "R10_TERMINAL_SHA256=$(sha256sum orchestration/.github/scripts/r10_terminal.py | awk '{print $1}')"

          export PYTHONPATH="${GITHUB_WORKSPACE}/production:${GITHUB_WORKSPACE}/production/src:${GITHUB_WORKSPACE}/production/tools/deep_history:${GITHUB_WORKSPACE}/production/tools:${GITHUB_WORKSPACE}/orchestration/.github/scripts"
          cd production
          python - <<'PY'
          from tools.deep_history import kraken_spot_ohlcvt_backfill as backfill
          from tools.deep_history import kraken_spot_posttrade as posttrade
          if backfill.SOURCE_MODE != "KRAKEN_OFFICIAL_POSTTRADE_BULK":
              raise RuntimeError("source mode drift")
          if backfill.SOURCE_MODE != posttrade.SOURCE_MODE:
              raise RuntimeError("publisher/helper source identity mismatch")
          if posttrade.ENDPOINT != "https://api.kraken.com/0/public/PostTrade":
              raise RuntimeError("PostTrade endpoint drift")
          if posttrade.MAX_PARALLEL != 1:
              raise RuntimeError("MAX_PARALLEL drift")
          print("SOURCE_AUTHORITY_READBACK=PASS")
          print("PROVIDER_NETWORK_CALLS=0")
          print("R10_REAL_RISK=TERMINAL_QUALIFICATION_ON_CORRUPTED_OR_UNREADBACK_VERIFIER")
          print("R10_SIMPLER_MECHANISM=TRACKED_SMALL_SCRIPTS_PLUS_SHORT_ORCHESTRATION")
          print("R10_ACTION_REDUCTION=REUSE_EXISTING_45_OF_45_AND_64887079_PROVIDER_TRADES")
          PY
          python "${GITHUB_WORKSPACE}/orchestration/.github/scripts/r10_continuity_test.py"

  terminal_qualification:
    needs: repository_and_repair_identity
    if: ${{ needs.repository_and_repair_identity.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout exact production source authority
        uses: actions/checkout@v6
        with:
          repository: vitaliipython-ship-it/eth-macro-data-bridge
          ref: ${{ env.SOURCE_AUTHORITY_SHA }}
          path: production
          fetch-depth: 1

      - name: Checkout exact R10 orchestration authority
        uses: actions/checkout@v6
        with:
          repository: vitaliipython-ship-it/eth-macro-data-bridge
          ref: ${{ github.sha }}
          path: orchestration
          fetch-depth: 1

      - name: Set up canonical Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Download R07 logical 000..021
        uses: actions/download-artifact@v4
        with:
          pattern: kraken-posttrade-full-*
          path: ${{ runner.temp }}/global/r07
          merge-multiple: false
          github-token: ${{ github.token }}
          repository: vitaliipython-ship-it/eth-macro-data-bridge
          run-id: ${{ env.R07_RUN_ID }}

      - name: Download R08 logical 022
        uses: actions/download-artifact@v4
        with:
          name: kraken-posttrade-full-022-9deb84887d89
          path: ${{ runner.temp }}/global/r08/kraken-posttrade-full-022-9deb84887d89
          github-token: ${{ github.token }}
          repository: vitaliipython-ship-it/eth-macro-data-bridge
          run-id: ${{ env.R08_RUN_ID }}

      - name: Download R09 logical 023..044
        uses: actions/download-artifact@v4
        with:
          pattern: kraken-posttrade-full-*
          path: ${{ runner.temp }}/global/r09
          merge-multiple: false
          github-token: ${{ github.token }}
          repository: vitaliipython-ship-it/eth-macro-data-bridge
          run-id: ${{ env.R09_RUN_ID }}

      - name: Global provider trade-ID audit
        id: provider_ids
        shell: bash
        run: |
          set -euo pipefail
          find "${RUNNER_TEMP}/global" -type f -name provider-trade-ids.txt -print0 | sort -z | xargs -0 cat > "${RUNNER_TEMP}/all-ids.txt"
          duplicate="$(LC_ALL=C sort -S 50% "${RUNNER_TEMP}/all-ids.txt" | uniq -d | head -n1 || true)"
          [[ -z "${duplicate}" ]] || { echo "GLOBAL_PROVIDER_TRADE_ID_CONFLICT=${duplicate}"; exit 71; }
          total="$(wc -l < "${RUNNER_TEMP}/all-ids.txt")"
          [[ "${total}" == "64887079" ]] || { echo "TOTAL_UNIQUE_PROVIDER_TRADES_DRIFT=${total}"; exit 72; }
          echo "total=${total}" >> "${GITHUB_OUTPUT}"
          echo "GLOBAL_PROVIDER_TRADE_ID_AUDIT=PASS"
          echo "GLOBAL_PROVIDER_TRADE_ID_CONFLICTS=0"
          echo "TOTAL_UNIQUE_PROVIDER_TRADES=${total}"
          echo "PROVIDER_NETWORK_CALLS=0"

      - name: Run R10 terminal qualification from tracked verifier
        shell: bash
        env:
          TOTAL_UNIQUE_PROVIDER_TRADES: ${{ steps.provider_ids.outputs.total }}
        run: |
          set -euo pipefail
          [[ "${PROVIDER_NETWORK_CALLS}" == "0" ]]
          export PYTHONPATH="${GITHUB_WORKSPACE}/production:${GITHUB_WORKSPACE}/production/src:${GITHUB_WORKSPACE}/production/tools/deep_history:${GITHUB_WORKSPACE}/production/tools:${GITHUB_WORKSPACE}/orchestration/.github/scripts"
          cd production
          python "${GITHUB_WORKSPACE}/orchestration/.github/scripts/r10_terminal.py"

      - name: Upload R10 full candidate
        uses: actions/upload-artifact@v4
        with:
          name: kraken-posttrade-full-candidate
          path: ${{ runner.temp }}/kraken-posttrade-full-candidate
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Download uploaded candidate for read-back
        uses: actions/download-artifact@v4
        with:
          name: kraken-posttrade-full-candidate
          path: ${{ runner.temp }}/candidate-readback

      - name: Verify candidate read-back and SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          original="${RUNNER_TEMP}/kraken-posttrade-full-candidate"
          readback="${RUNNER_TEMP}/candidate-readback"
          diff -qr "${original}" "${readback}"
          cd "${readback}"
          sha256sum -c SHA256SUMS
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          inv = Path("candidate-inventory.json")
          q = json.loads(Path("qualification-summary.json").read_text())
          digest = hashlib.sha256(inv.read_bytes()).hexdigest()
          if digest != q.get("full_candidate_sha256"):
              raise RuntimeError(f"candidate SHA mismatch: {digest} != {q.get('full_candidate_sha256')}")
          if q.get("status") != "PASS":
              raise RuntimeError("candidate qualification status not PASS")
          print("CANDIDATE_READBACK=PASS")
          print(f"FULL_CANDIDATE_SHA256={digest}")
          print(f"TERMINAL_STATE={q['terminal_state']}")
          print(f"NEXT_EXACT_GATE={q['next_exact_gate']}")
          PY
