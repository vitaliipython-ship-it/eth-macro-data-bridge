name: Kraken PostTrade production qualification

on:
  push:
    branches:
      - agent/data-bridge/kraken-spot-deep-history-source-repair-r01
    paths:
      - .github/workflows/kraken-hybrid-source-qualification.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PYTHONPATH: .:src:tools/deep_history:tools
  KRAKEN_POSTTRADE_DELAY_SECONDS: "1.0"
  KRAKEN_POSTTRADE_QUALIFIED_QUARTER_PAGE_BOUND: "2164"
  SOURCE_AUTHORITY_SHA: "91546fdd81471851c2cb6b948821c04cfe636f1c"
  SOURCE_AUTHORITY_TREE: "6deb789f26424845fae52593abb68f09c73801e0"
  R07_RUN_ID: "33916820262"
  R08_RUN_ID: "33964062741"
  R08_ORCHESTRATION_SHA: "4bf8df4eb9ac1818ceeb2adafd17c5d3d26c4aaf"
  R08_SEGMENT_22_ARTIFACT: "kraken-posttrade-full-022-9deb84887d89"
  R08_APRIL_ARTIFACT: "kraken-posttrade-recovery-child-23-0"
  R08_APRIL_ARTIFACT_ID: "9971292963"
  MONTH_RECOVERY_SCHEMA: "kraken-posttrade-calendar-month-recovery/2.0.0"
  SUBMONTH_RECOVERY_SCHEMA: "kraken-posttrade-fixed-7d-submonth-recovery/1.0.0"

jobs:
  repository_and_source_identity:
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, 'OWNER_POSTTRADE_SUBMONTH_RECOVERY_AUTHORIZED_R09') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with: {ref: 91546fdd81471851c2cb6b948821c04cfe636f1c, fetch-depth: 1}
      - uses: actions/setup-python@v6
        with: {python-version: "3.11"}
      - name: Read back source authority, tests and R09 owner questions
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "${SOURCE_AUTHORITY_SHA}" ]]
          [[ "$(git rev-parse HEAD^{tree})" == "${SOURCE_AUTHORITY_TREE}" ]]
          python -c "import base64,zlib; exec(compile(zlib.decompress(base64.b64decode('')),'r09-embedded-1','exec'))"
          python -m compileall -q tools/deep_history/kraken_spot_posttrade.py tools/deep_history/kraken_spot_ohlcvt_backfill.py
          python -m unittest discover -s tests/deep_history -p 'test_kraken_spot_posttrade.py' -v
          python -m unittest discover -s tests/deep_history -p 'test_kraken_spot_ohlcvt_backfill.py' -v

  predecessor_frontier_readback:
    needs: repository_and_source_identity
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with: {ref: 91546fdd81471851c2cb6b948821c04cfe636f1c, fetch-depth: 1}
      - uses: actions/setup-python@v6
        with: {python-version: "3.11"}
      - name: Download R07 logical 000..021
        uses: actions/download-artifact@v4
        with:
          pattern: kraken-posttrade-full-*
          path: ${{ runner.temp }}/frontier/r07
          merge-multiple: false
          github-token: ${{ github.token }}
          repository: vitaliipython-ship-it/eth-macro-data-bridge
          run-id: 33916820262
      - name: Download R08 logical 022
        uses: actions/download-artifact@v4
        with:
          name: kraken-posttrade-full-022-9deb84887d89
          path: ${{ runner.temp }}/frontier/r08/kraken-posttrade-full-022-9deb84887d89
          github-token: ${{ github.token }}
          repository: vitaliipython-ship-it/eth-macro-data-bridge
          run-id: 33964062741
      - name: Download preserved April 23-0
        uses: actions/download-artifact@v4
        with:
          name: kraken-posttrade-recovery-child-23-0
          path: ${{ runner.temp }}/frontier/april
          github-token: ${{ github.token }}
          repository: vitaliipython-ship-it/eth-macro-data-bridge
          run-id: 33964062741
      - name: Verify frontier and April bytes
        shell: bash
        run: |
          set -euo pipefail
          python -c "import base64,zlib; exec(compile(zlib.decompress(base64.b64decode('')),'r09-embedded-2','exec'))"
      - uses: actions/upload-artifact@v4
        with: {name: kraken-posttrade-r09-predecessor-readback, path: "${{ runner.temp }}/r09-predecessor.json", retention-days: 7, if-no-files-found: error}

  recovery_inventory:
    needs: predecessor_frontier_readback
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.i.outputs.matrix }}
      start_utc: ${{ steps.i.outputs.start_utc }}
      end_utc: ${{ steps.i.outputs.end_utc }}
      cutoff_ms: ${{ steps.i.outputs.cutoff_ms }}
      warm_first_ms: ${{ steps.i.outputs.warm_first_ms }}
      segment_count: ${{ steps.i.outputs.segment_count }}
    steps:
      - uses: actions/checkout@v6
        with: {ref: 91546fdd81471851c2cb6b948821c04cfe636f1c, fetch-depth: 1}
      - uses: actions/setup-python@v6
        with: {python-version: "3.11"}
      - id: i
        shell: bash
        run: |
          python -c "import base64,zlib; exec(compile(zlib.decompress(base64.b64decode('')),'r09-embedded-3','exec'))"

  remaining_logical_segment:
    needs: recovery_inventory
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix: ${{ fromJSON(needs.recovery_inventory.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      SEGMENT_INDEX: "${{ matrix.index }}"
      SEGMENT_ID: "${{ matrix.segment_id }}"
      SEGMENT_START_UTC: "${{ matrix.start_utc }}"
      SEGMENT_END_UTC: "${{ matrix.end_utc }}"
    steps:
      - uses: actions/checkout@v6
        with: {ref: 91546fdd81471851c2cb6b948821c04cfe636f1c, fetch-depth: 1}
      - uses: actions/setup-python@v6
        with: {python-version: "3.11"}
      - name: Download preserved April only for segment 23
        if: ${{ matrix.index == 23 }}
        uses: actions/download-artifact@v4
        with:
          name: kraken-posttrade-recovery-child-23-0
          path: ${{ runner.temp }}/preserved-april
          github-token: ${{ github.token }}
          repository: vitaliipython-ship-it/eth-macro-data-bridge
          run-id: 33964062741
      - name: Prepare deterministic R09 runner
        shell: bash
        run: |
          python -c "import base64,zlib,os,pathlib,hashlib; d=zlib.decompress(base64.b64decode('')); assert hashlib.sha256(d).hexdigest()=='fadad20b49d2b915bc24bb81edb0747ed9a18d774f23a93aa76cd4dc6d5f42d2'; pathlib.Path(os.environ['RUNNER_TEMP'],'r09.py').write_bytes(d); print('R09_RUNNER_SCRIPT_SHA256=fadad20b49d2b915bc24bb81edb0747ed9a18d774f23a93aa76cd4dc6d5f42d2')"
          cat > "${RUNNER_TEMP}/r09-wrap.sh" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          mode="$1"; shift || true; set +e; timeout --signal=TERM 3081s python "${RUNNER_TEMP}/r09.py" "$mode" "$@"; rc=$?; set -e
          if [[ "$mode" == quarter && ( "$rc" == 124 || "$rc" == 81 || "$rc" == 82 ) ]]; then echo "fallback=true" >> "$GITHUB_OUTPUT"; echo "DIRECT_QUARTER_BOUNDARY_ONLY_FAILURE=APPROVED_MONTH_FALLBACK"; exit 0; fi
          if [[ "$mode" == month && ( "$rc" == 124 || "$rc" == 92 || "$rc" == 93 ) ]]; then echo "fallback=true" >> "$GITHUB_OUTPUT"; echo "CALENDAR_MONTH_BOUNDARY_ONLY_FAILURE=APPROVED_FIXED_7D_FALLBACK"; exit 0; fi
          if [[ "$mode" == 7d && ( "$rc" == 124 || "$rc" == 102 || "$rc" == 103 ) ]]; then echo "STOP_CODE=POSTTRADE_7D_SUBMONTH_EXECUTION_BOUNDARY_EXCEEDED"; echo "NEXT_EXACT_GATE=OWNER_DECISION_ON_DAILY_EXECUTION_MODEL"; exit "$rc"; fi
          exit "$rc"
          SH
          chmod +x "${RUNNER_TEMP}/r09-wrap.sh"
      - name: Try direct logical quarter
        id: quarter
        shell: bash
        run: bash "${RUNNER_TEMP}/r09-wrap.sh" quarter
      - name: Execute calendar month 0
        id: month0
        if: ${{ steps.quarter.outputs.fallback == 'true' }}
        shell: bash
        run: bash "${RUNNER_TEMP}/r09-wrap.sh" month 0
      - name: Execute month 0 fixed-7d child 0
        id: m0c0
        if: ${{ steps.quarter.outputs.fallback == 'true' && steps.month0.outputs.fallback == 'true' }}
        shell: bash
        run: bash "${RUNNER_TEMP}/r09-wrap.sh" 7d 0 0
      - name: Persist month 0 child 0 checkpoint
        if: ${{ steps.m0c0.outputs.active == 'true' }}
        uses: actions/upload-artifact@v4
        with: {name: "kraken-posttrade-r09-7d-${{ matrix.index }}-0-0", path: "${{ runner.temp }}/sub-0-0", retention-days: 7, if-no-files-found: error}
      - name: Execute month 0 fixed-7d child 1
        id: m0c1
        if: ${{ steps.quarter.outputs.fallback == 'true' && steps.month0.outputs.fallback == 'true' }}
        shell: bash
        run: bash "${RUNNER_TEMP}/r09-wrap.sh" 7d 0 1
      - name: Persist month 0 child 1 checkpoint
        if: ${{ steps.m0c1.outputs.active == 'true' }}
        uses: actions/upload-artifact@v4
        with: {name: "kraken-posttrade-r09-7d-${{ matrix.index }}-0-1", path: "${{ runner.temp }}/sub-0-1", retention-days: 7, if-no-files-found: error}
      - name: Execute month 0 fixed-7d child 2
        id: m0c2
        if: ${{ steps.quarter.outputs.fallback == 'true' && steps.month0.outputs.fallback == 'true' }}
        shell: bash
        run: bash "${RUNNER_TEMP}/r09-wrap.sh" 7d 0 2
      - name: Persist month 0 child 2 checkpoint
        if: ${{ steps.m0c2.outputs.active == 'true' }}
        uses: actions/upload-artifact@v4
        with: {name: "kraken-posttrade-r09-7d-${{ matrix.index }}-0-2", path: "${{ runner.temp }}/sub-0-2", retention-days: 7, if-no-files-found: error}
      - name: Execute month 0 fixed-7d child 3
        id: m0c3
        if: ${{ steps.quarter.outputs.fallback == 'true' && steps.month0.outputs.fallback == 'true' }}
        shell: bash
        run: bash "${RUNNER_TEMP}/r09-wrap.sh" 7d 0 3
      - name: Persist month 0 child 3 checkpoint
        if: ${{ steps.m0c3.outputs.active == 'true' }}
        uses: actions/upload-artifact@v4
        with: {name: "kraken-posttrade-r09-7d-${{ matrix.index }}-0-3", path: "${{ runner.temp }}/sub-0-3", retention-days: 7, if-no-files-found: error}
      - name: Execute month 0 fixed-7d child 4
        id: m0c4
        if: ${{ steps.quarter.outputs.fallback == 'true' && steps.month0.outputs.fallback == 'true' }}
        shell: bash
        run: bash "${RUNNER_TEMP}/r09-wrap.sh" 7d 0 4
      - name: Persist month 0 child 4 checkpoint
        if: ${{ steps.m0c4.outputs.active == 'true' }}
        uses: actions/upload-artifact@v4
        with: {name: "kraken-posttrade-r09-7d-${{ matrix.index }}-0-4", path: "${{ runner.temp }}/sub-0-4", retention-days: 7, if-no-files-found: error}
      - name: Assemble recovered month 0
        if: ${{ steps.quarter.outputs.fallback == 'true' && steps.month0.outputs.fallback == 'true' }}
        shell: bash
        run: python "${RUNNER_TEMP}/r09.py" assemble-month 0
      - name: Persist internal month 0 checkpoint
        if: ${{ steps.quarter.outputs.fallback == 'true' && matrix.index != 23 }}
        uses: actions/upload-artifact@v4
        with: {name: "kraken-posttrade-r09-month-${{ matrix.index }}-0", path: "${{ runner.temp }}/month-0", retention-days: 7, if-no-files-found: error}
      - name: Execute calendar month 1
        id: month1
        if: ${{ steps.quarter.outputs.fallback == 'true' }}
        shell: bash
        run: bash "${RUNNER_TEMP}/r09-wrap.sh" month 1
      - name: Execute month 1 fixed-7d child 0
        id: m1c0
        if: ${{ steps.quarter.outputs.fallback == 'true' && steps.month1.outputs.fallback == 'true' }}
        shell: bash
        run: bash "${RUNNER_TEMP}/r09-wrap.sh" 7d 1 0
      - name: Persist month 1 child 0 checkpoint
        if: ${{ steps.m1c0.outputs.active == 'true' }}
        uses: actions/upload-artifact@v4
        with: {name: "kraken-posttrade-r09-7d-${{ matrix.index }}-1-0", path: "${{ runner.temp }}/sub-1-0", retention-days: 7, if-no-files-found: error}
      - name: Execute month 1 fixed-7d child 1
        id: m1c1
        if: ${{ steps.quarter.outputs.fallback == 'true' && steps.month1.outputs.fallback == 'true' }}
        shell: bash
        run: bash "${RUNNER_TEMP}/r09-wrap.sh" 7d 1 1
      - name: Persist month 1 child 1 checkpoint
        if: ${{ steps.m1c1.outputs.active == 'true' }}
        uses: actions/upload-artifact@v4
        with: {name: "kraken-posttrade-r09-7d-${{ matrix.index }}-1-1", path: "${{ runner.temp }}/sub-1-1", retention-days: 7, if-no-files-found: error}
      - name: Execute month 1 fixed-7d child 2
        id: m1c2
        if: ${{ steps.quarter.outputs.fallback == 'true' && steps.month1.outputs.fallback == 'true' }}
        shell: bash
        run: bash "${RUNNER_TEMP}/r09-wrap.sh" 7d 1 2
      - name: Persist month 1 child 2 checkpoint
        if: ${{ steps.m1c2.outputs.active == 'true' }}
        uses: actions/upload-artifact@v4
        with: {name: "kraken-posttrade-r09-7d-${{ matrix.index }}-1-2", path: "${{ runner.temp }}/sub-1-2", retention-days: 7, if-no-files-found: error}
      - name: Execute month 1 fixed-7d child 3
        id: m1c3
        if: ${{ steps.quarter.outputs.fallback == 'true' && steps.month1.outputs.fallback == 'true' }}
        shell: bash
        run: bash "${RUNNER_TEMP}/r09-wrap.sh" 7d 1 3
      - name: Persist month 1 child 3 checkpoint
        if: ${{ steps.m1c3.outputs.active == 'true' }}
        uses: actions/upload-artifact@v4
        with: {name: "kraken-posttrade-r09-7d-${{ matrix.index }}-1-3", path: "${{ runner.temp }}/sub-1-3", retention-days: 7, if-no-files-found: error}
      - name: Execute month 1 fixed-7d child 4
        id: m1c4
        if: ${{ steps.quarter.outputs.fallback == 'true' && steps.month1.outputs.fallback == 'true' }}
        shell: bash
        run: bash "${RUNNER_TEMP}/r09-wrap.sh" 7d 1 4
      - name: Persist month 1 child 4 checkpoint
        if: ${{ steps.m1c4.outputs.active == 'true' }}
        uses: actions/upload-artifact@v4
        with: {name: "kraken-posttrade-r09-7d-${{ matrix.index }}-1-4", path: "${{ runner.temp }}/sub-1-4", retention-days: 7, if-no-files-found: error}
      - name: Assemble recovered month 1
        if: ${{ steps.quarter.outputs.fallback == 'true' && steps.month1.outputs.fallback == 'true' }}
        shell: bash
        run: python "${RUNNER_TEMP}/r09.py" assemble-month 1
      - name: Persist internal month 1 checkpoint
        if: ${{ steps.quarter.outputs.fallback == 'true' }}
        uses: actions/upload-artifact@v4
        with: {name: "kraken-posttrade-r09-month-${{ matrix.index }}-1", path: "${{ runner.temp }}/month-1", retention-days: 7, if-no-files-found: error}
      - name: Execute calendar month 2
        id: month2
        if: ${{ steps.quarter.outputs.fallback == 'true' }}
        shell: bash
        run: bash "${RUNNER_TEMP}/r09-wrap.sh" month 2
      - name: Execute month 2 fixed-7d child 0
        id: m2c0
        if: ${{ steps.quarter.outputs.fallback == 'true' && steps.month2.outputs.fallback == 'true' }}
        shell: bash
        run: bash "${RUNNER_TEMP}/r09-wrap.sh" 7d 2 0
      - name: Persist month 2 child 0 checkpoint
        if: ${{ steps.m2c0.outputs.active == 'true' }}
        uses: actions/upload-artifact@v4
        with: {name: "kraken-posttrade-r09-7d-${{ matrix.index }}-2-0", path: "${{ runner.temp }}/sub-2-0", retention-days: 7, if-no-files-found: error}
      - name: Execute month 2 fixed-7d child 1
        id: m2c1
        if: ${{ steps.quarter.outputs.fallback == 'true' && steps.month2.outputs.fallback == 'true' }}
        shell: bash
        run: bash "${RUNNER_TEMP}/r09-wrap.sh" 7d 2 1
      - name: Persist month 2 child 1 checkpoint
        if: ${{ steps.m2c1.outputs.active == 'true' }}
        uses: actions/upload-artifact@v4
        with: {name: "kraken-posttrade-r09-7d-${{ matrix.index }}-2-1", path: "${{ runner.temp }}/sub-2-1", retention-days: 7, if-no-files-found: error}
      - name: Execute month 2 fixed-7d child 2
        id: m2c2
        if: ${{ steps.quarter.outputs.fallback == 'true' && steps.month2.outputs.fallback == 'true' }}
        shell: bash
        run: bash "${RUNNER_TEMP}/r09-wrap.sh" 7d 2 2
      - name: Persist month 2 child 2 checkpoint
        if: ${{ steps.m2c2.outputs.active == 'true' }}
        uses: actions/upload-artifact@v4
        with: {name: "kraken-posttrade-r09-7d-${{ matrix.index }}-2-2", path: "${{ runner.temp }}/sub-2-2", retention-days: 7, if-no-files-found: error}
      - name: Execute month 2 fixed-7d child 3
        id: m2c3
        if: ${{ steps.quarter.outputs.fallback == 'true' && steps.month2.outputs.fallback == 'true' }}
        shell: bash
        run: bash "${RUNNER_TEMP}/r09-wrap.sh" 7d 2 3
      - name: Persist month 2 child 3 checkpoint
        if: ${{ steps.m2c3.outputs.active == 'true' }}
        uses: actions/upload-artifact@v4
        with: {name: "kraken-posttrade-r09-7d-${{ matrix.index }}-2-3", path: "${{ runner.temp }}/sub-2-3", retention-days: 7, if-no-files-found: error}
      - name: Execute month 2 fixed-7d child 4
        id: m2c4
        if: ${{ steps.quarter.outputs.fallback == 'true' && steps.month2.outputs.fallback == 'true' }}
        shell: bash
        run: bash "${RUNNER_TEMP}/r09-wrap.sh" 7d 2 4
      - name: Persist month 2 child 4 checkpoint
        if: ${{ steps.m2c4.outputs.active == 'true' }}
        uses: actions/upload-artifact@v4
        with: {name: "kraken-posttrade-r09-7d-${{ matrix.index }}-2-4", path: "${{ runner.temp }}/sub-2-4", retention-days: 7, if-no-files-found: error}
      - name: Assemble recovered month 2
        if: ${{ steps.quarter.outputs.fallback == 'true' && steps.month2.outputs.fallback == 'true' }}
        shell: bash
        run: python "${RUNNER_TEMP}/r09.py" assemble-month 2
      - name: Persist internal month 2 checkpoint
        if: ${{ steps.quarter.outputs.fallback == 'true' }}
        uses: actions/upload-artifact@v4
        with: {name: "kraken-posttrade-r09-month-${{ matrix.index }}-2", path: "${{ runner.temp }}/month-2", retention-days: 7, if-no-files-found: error}
      - name: Assemble recovered logical quarter
        if: ${{ steps.quarter.outputs.fallback == 'true' }}
        shell: bash
        run: python "${RUNNER_TEMP}/r09.py" assemble-quarter
      - name: Persist completed logical-quarter artifact
        uses: actions/upload-artifact@v4
        with: {name: "${{ matrix.artifact_name }}", path: "${{ runner.temp }}/logical-parent", retention-days: 7, if-no-files-found: error}
  full_readback_and_candidate:
    needs: [recovery_inventory, remaining_logical_segment]
    if: ${{ needs.remaining_logical_segment.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v6
        with: {ref: 91546fdd81471851c2cb6b948821c04cfe636f1c, fetch-depth: 1}
      - uses: actions/setup-python@v6
        with: {python-version: "3.11"}
      - name: Download R07 000..021
        uses: actions/download-artifact@v4
        with: {pattern: kraken-posttrade-full-*, path: "${{ runner.temp }}/global/r07", merge-multiple: false, github-token: "${{ github.token }}", repository: vitaliipython-ship-it/eth-macro-data-bridge, run-id: 33916820262}
      - name: Download R08 022
        uses: actions/download-artifact@v4
        with: {name: kraken-posttrade-full-022-9deb84887d89, path: "${{ runner.temp }}/global/r08/kraken-posttrade-full-022-9deb84887d89", github-token: "${{ github.token }}", repository: vitaliipython-ship-it/eth-macro-data-bridge, run-id: 33964062741}
      - name: Download R09 023..044
        uses: actions/download-artifact@v4
        with: {pattern: kraken-posttrade-full-*, path: "${{ runner.temp }}/global/r09", merge-multiple: false}
      - name: Global provider trade-ID audit
        id: ids
        shell: bash
        run: |
          set -euo pipefail
          find "${RUNNER_TEMP}/global" -type f -name provider-trade-ids.txt -print0 | sort -z | xargs -0 cat > "${RUNNER_TEMP}/all-ids.txt"
          d="$(LC_ALL=C sort -S 50% "${RUNNER_TEMP}/all-ids.txt" | uniq -d | head -n1 || true)"; [[ -z "$d" ]] || { echo "GLOBAL_PROVIDER_TRADE_ID_CONFLICT=$d"; exit 71; }
          n="$(wc -l < "${RUNNER_TEMP}/all-ids.txt")"; echo "total=$n" >> "$GITHUB_OUTPUT"; echo "GLOBAL_PROVIDER_TRADE_ID_AUDIT=PASS"; echo "GLOBAL_PROVIDER_TRADE_ID_CONFLICTS=0"; echo "TOTAL_UNIQUE_PROVIDER_TRADES=$n"
      - name: Full chain, Build A/B, WARM, forensic and candidate
        shell: bash
        env:
          FULL_START_UTC: ${{ needs.recovery_inventory.outputs.start_utc }}
          FULL_END_UTC: ${{ needs.recovery_inventory.outputs.end_utc }}
          FULL_CUTOFF_MS: ${{ needs.recovery_inventory.outputs.cutoff_ms }}
          FULL_WARM_FIRST_MS: ${{ needs.recovery_inventory.outputs.warm_first_ms }}
          TOTAL_UNIQUE_PROVIDER_TRADES: ${{ steps.ids.outputs.total }}
        run: |
          set -euo pipefail
          python -c "import base64,zlib; exec(compile(zlib.decompress(base64.b64decode('')),'r09-embedded-5','exec'))"
      - uses: actions/upload-artifact@v4
        with: {name: kraken-posttrade-full-candidate-qualification, path: "${{ runner.temp }}/kraken-posttrade-full-candidate", retention-days: 7, if-no-files-found: error}
