jobs:
  repository_and_repair_identity:
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, 'OWNER_POSTTRADE_FULL_CHAIN_CONTINUITY_REPAIR_AUTHORIZED_R10') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact production source authority
        uses: actions/checkout@v6
        with:
          ref: 91546fdd81471851c2cb6b948821c04cfe636f1c
          fetch-depth: 1
      - name: Set up canonical Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Verify immutable source authority and R10 scope
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "${SOURCE_AUTHORITY_SHA}" ]]
          [[ "$(git rev-parse HEAD^{tree})" == "${SOURCE_AUTHORITY_TREE}" ]]
          python - <<'PY'
          from tools.deep_history import kraken_spot_ohlcvt_backfill as backfill
          from tools.deep_history import kraken_spot_posttrade as posttrade
          if backfill.SOURCE_MODE != "KRAKEN_OFFICIAL_POSTTRADE_BULK":
              raise RuntimeError("source mode drift")
          if backfill.SOURCE_MODE != posttrade.SOURCE_MODE:
              raise RuntimeError("publisher/helper source identity mismatch")
          if posttrade.ENDPOINT != "https://api.kraken.com/0/public/PostTrade":
              raise RuntimeError("PostTrade endpoint drift")
          if posttrade.MAX_PARALLEL != 1:
              raise RuntimeError("MAX_PARALLEL drift")
          print("SOURCE_AUTHORITY_READBACK=PASS")
          print("R10_REAL_RISK=CANONICAL_HISTORY_WITHOUT_PROVEN_FULL_CHAIN_CONTINUITY")
          print("R10_SIMPLER_MECHANISM=FORENSIC_EXISTING_45_OF_45_PLUS_MINIMAL_VERIFIER_REPAIR")
          print("R10_ACTION_REDUCTION=REUSE_EXISTING_64887079_PROVIDER_TRADES_WITH_ZERO_REACQUISITION")
          print("PROVIDER_NETWORK_CALLS=0")
