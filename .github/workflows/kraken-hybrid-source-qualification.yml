          print("FULL_POSTTRADE_MARKET_INCEPTION_TO_WARM=PASS")
          print("RELEASE_PUBLICATION=NOT_RUN")
          print("CONTROL_PLANE_INSTALL=NOT_RUN")
          print("history-kraken-spot-v2=NOT_ACTIVE")
