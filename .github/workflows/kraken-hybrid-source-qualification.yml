name: Kraken PostTrade production qualification

on:
  push:
    branches:
      - agent/data-bridge/kraken-spot-deep-history-source-repair-r01
    paths:
      - .github/workflows/kraken-hybrid-source-qualification.yml
      - tools/deep_history/kraken_spot_posttrade.py
      - tools/deep_history/kraken_spot_ohlcvt_backfill.py
      - tests/deep_history/test_kraken_spot_posttrade.py
      - tests/deep_history/test_kraken_spot_ohlcvt_backfill.py
      - history/release-manifest.json
      - history/kraken/ETHUSD/5m/**
      - history/kraken/ETHUSD/1d/**
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: src:tools/deep_history:tools
  KRAKEN_POSTTRADE_DELAY_SECONDS: "1.0"

jobs:
  repository_and_source_identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch SHA
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up canonical Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Read back installed production source identity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from tools.deep_history import kraken_spot_ohlcvt_backfill as backfill
          from tools.deep_history import kraken_spot_posttrade as posttrade
          if backfill.SOURCE_MODE != "KRAKEN_OFFICIAL_POSTTRADE_BULK":
              raise RuntimeError(f"unexpected production source mode: {backfill.SOURCE_MODE!r}")
          if backfill.SOURCE_MODE != posttrade.SOURCE_MODE:
              raise RuntimeError("publisher/helper source identity mismatch")
          if posttrade.ENDPOINT != "https://api.kraken.com/0/public/PostTrade":
              raise RuntimeError(f"unexpected PostTrade endpoint: {posttrade.ENDPOINT!r}")
          if posttrade.MAX_PARALLEL != 1:
              raise RuntimeError("MAX_PARALLEL must remain 1")
          if posttrade.ARTIFACT_RETENTION_DAYS != 7:
              raise RuntimeError("production completed-segment retention must remain 7 days")
          print(f"PRODUCTION_POSTTRADE_SOURCE_MODE={backfill.SOURCE_MODE}")
          print(f"PRODUCTION_POSTTRADE_ENDPOINT={posttrade.ENDPOINT}")
          print("UTC_QUARTER_SEGMENTATION_INSTALLED=YES")
          print("RESUME_GRANULARITY=COMPLETED_SEGMENT")
          print("PAGE_LEVEL_CHECKPOINTING=NO")
          print("MAX_PARALLEL=1")
          print("PRODUCTION_POSTTRADE_SOURCE_MODE=PASS")
          PY

      - name: Compile production adapter and publisher
        run: python -m compileall -q tools/deep_history/kraken_spot_posttrade.py tools/deep_history/kraken_spot_ohlcvt_backfill.py tests/deep_history/test_kraken_spot_posttrade.py tests/deep_history/test_kraken_spot_ohlcvt_backfill.py

      - name: Run targeted PostTrade production adapter tests
        run: python -m unittest discover -s tests/deep_history -p 'test_kraken_spot_posttrade.py' -v

      - name: Run targeted Kraken backfill tests
        run: python -m unittest discover -s tests/deep_history -p 'test_kraken_spot_ohlcvt_backfill.py' -v

  production_segment_a:
    needs: repository_and_source_identity
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout exact branch SHA
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up canonical Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Execute production multi-day segment A interruption restart and Build A/B
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${RUNNER_TEMP}/kraken-posttrade-r06-a"
          python tools/deep_history/kraken_spot_ohlcvt_backfill.py qualify-segment-a "$ROOT"
          python - <<'PY'
          import json, os, shutil
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "kraken-posttrade-r06-a"
          summary = json.loads((root / "qualification-a-summary.json").read_text())
          source = Path(summary["checkpoint_directory"])
          target = Path(os.environ["RUNNER_TEMP"]) / "kraken-posttrade-r06-left-complete"
          if target.exists():
              shutil.rmtree(target)
          shutil.copytree(source, target)
          forbidden = [target / "raw-pages.bin", target / "normalized.jsonl", target / "source.json"]
          if any(path.exists() for path in forbidden):
              raise RuntimeError("completed-segment artifact contains transient raw source")
          evidence = json.loads((target / "evidence.json").read_text())
          if evidence.get("completion_status") != "COMPLETE":
              raise RuntimeError("completed-segment artifact is not COMPLETE")
          print(f"PRODUCTION_LEFT_SEGMENT_ID={evidence['segment_id']}")
          print(f"PRODUCTION_LEFT_FIRST_PROVIDER_TRADE_ID={evidence['first_provider_trade_id']}")
          print(f"PRODUCTION_LEFT_LAST_PROVIDER_TRADE_ID={evidence['last_provider_trade_id']}")
          print("PRODUCTION_COMPLETED_SEGMENT_ARTIFACT_CONTENT=S2_MINIMUM_SEGMENT_OUTPUT_AND_EVIDENCE")
          PY

      - name: Persist completed production segment A checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: kraken-posttrade-r06-left-complete
          path: ${{ runner.temp }}/kraken-posttrade-r06-left-complete
          retention-days: 7
          if-no-files-found: error

  production_segment_b:
    needs: production_segment_a
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout exact branch SHA
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up canonical Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Restore completed production segment A checkpoint
        uses: actions/download-artifact@v4
        with:
          name: kraken-posttrade-r06-left-complete
          path: ${{ runner.temp }}/kraken-posttrade-r06-left-complete

      - name: Execute production segment B seam assembly and WARM overlap qualification
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${RUNNER_TEMP}/kraken-posttrade-r06-b"
          LEFT="${RUNNER_TEMP}/kraken-posttrade-r06-left-complete"
          python tools/deep_history/kraken_spot_ohlcvt_backfill.py qualify-segment-b "$ROOT" "$LEFT"
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "kraken-posttrade-r06-b"
          summary = json.loads((root / "qualification-b-summary.json").read_text())
          if summary["segmented_output_digest"] != summary["direct_output_digest"]:
              raise RuntimeError("production segmented/direct digest mismatch")
          if summary["seam_provider_id_conflicts"] != 0 or summary["seam_missing_executions"] != 0 or summary["seam_extra_executions"] != 0:
              raise RuntimeError("production segment seam evidence is not clean")
          if summary["warm_overlap"]["conflicts"] != 0:
              raise RuntimeError("PostTrade/WARM overlap conflict")
          print(f"PRODUCTION_RIGHT_FIRST_PROVIDER_TRADE_ID={summary['right']['first_provider_trade_id']}")
          print(f"PRODUCTION_RIGHT_LAST_PROVIDER_TRADE_ID={summary['right']['last_provider_trade_id']}")
          print("PRODUCTION_BOUNDED_PHYSICAL_QUALIFICATION=PASS")
          print("PRODUCTION_ATOMIC_RESTART=PASS")
          print("PRODUCTION_PERSISTENCE_LIFETIME=PASS")
          print("PRODUCTION_BUILD_A_B=PASS")
          print("PRODUCTION_SEGMENT_SEAM=PASS")
          print("PRODUCTION_ASSEMBLY_DETERMINISM=PASS")
          print("PRODUCTION_PROVIDER_TRADE_ID_CONTINUITY=PASS")
          print("WARM_OVERLAP_CONFLICTS=0")
          print("FULL_POSTTRADE_CRAWL=NO")
          print("RELEASE_PUBLICATION=NOT_RUN")
          print("CONTROL_PLANE_INSTALL=NOT_RUN")
          print("OWNER_MERGE=NO")
          PY
