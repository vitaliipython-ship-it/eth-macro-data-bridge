name: Kraken PostTrade production qualification

on:
  push:
    branches:
      - agent/data-bridge/kraken-spot-deep-history-source-repair-r01
    paths:
      - .github/workflows/kraken-hybrid-source-qualification.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PYTHONPATH: .:src:tools/deep_history:tools
  KRAKEN_POSTTRADE_DELAY_SECONDS: "1.0"
  KRAKEN_POSTTRADE_QUALIFIED_QUARTER_PAGE_BOUND: "2164"
  SOURCE_AUTHORITY_SHA: "91546fdd81471851c2cb6b948821c04cfe636f1c"
  SOURCE_AUTHORITY_TREE: "6deb789f26424845fae52593abb68f09c73801e0"
  PREDECESSOR_RUN_ID: "33916820262"
  PREDECESSOR_COMPLETE_COUNT: "22"
  RECOVERY_SCHEMA: "kraken-posttrade-calendar-month-fallback/1.0.0"

jobs:
  repository_and_source_identity:
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, 'OWNER_POSTTRADE_BOUNDARY_RECOVERY_AUTHORIZED_R08') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout qualified production source authority
        uses: actions/checkout@v6
        with:
          ref: 91546fdd81471851c2cb6b948821c04cfe636f1c
          fetch-depth: 1

      - name: Set up canonical Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Read back source/runtime authority and R08 owner questions
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "${SOURCE_AUTHORITY_SHA}" ]]
          [[ "$(git rev-parse HEAD^{tree})" == "${SOURCE_AUTHORITY_TREE}" ]]
          python - <<'PY'
          from tools.deep_history import kraken_spot_ohlcvt_backfill as backfill
          from tools.deep_history import kraken_spot_posttrade as posttrade
          if backfill.SOURCE_MODE != "KRAKEN_OFFICIAL_POSTTRADE_BULK":
              raise RuntimeError("unexpected production source mode")
          if backfill.SOURCE_MODE != posttrade.SOURCE_MODE:
              raise RuntimeError("publisher/helper source identity mismatch")
          if posttrade.ENDPOINT != "https://api.kraken.com/0/public/PostTrade":
              raise RuntimeError("unexpected PostTrade endpoint")
          if posttrade.MAX_PARALLEL != 1:
              raise RuntimeError("MAX_PARALLEL must remain 1")
          if str(posttrade.QUALIFIED_CONSERVATIVE_QUARTER_SECONDS) != "3080.819716":
              raise RuntimeError("qualified execution boundary drift")
          print("SOURCE_AUTHORITY_READBACK=PASS")
          print("R08_REAL_RISK=WHOLE_QUARTER_EXECUTION_BOUNDARY_PHYSICALLY_EXCEEDED")
          print("R08_SIMPLER_MECHANISM=FIXED_UTC_CALENDAR_MONTH_FALLBACK")
          print("R08_ACTION_REDUCTION=ONE_PREAUTHORIZED_FALLBACK_POLICY_FOR_DENSE_QUARTERS")
          print("TIMEOUT_INCREASE=NO")
          print("PAGE_LIMIT_INCREASE=NO")
          print("RECURSIVE_SPLITTER=NO")
          print("MAX_PARALLEL_PROVIDER_ACQUISITION=1")
          PY
          python -m compileall -q tools/deep_history/kraken_spot_posttrade.py tools/deep_history/kraken_spot_ohlcvt_backfill.py
          python -m unittest discover -s tests/deep_history -p 'test_kraken_spot_posttrade.py' -v
          python -m unittest discover -s tests/deep_history -p 'test_kraken_spot_ohlcvt_backfill.py' -v
          echo "RECOVERY_ORCHESTRATION_SHA=${GITHUB_SHA}"
          echo "PRODUCTION_SOURCE_AUTHORITY_SHA=${SOURCE_AUTHORITY_SHA}"

  predecessor_frontier_readback:
    needs: repository_and_source_identity
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout qualified production source authority
        uses: actions/checkout@v6
        with:
          ref: 91546fdd81471851c2cb6b948821c04cfe636f1c
          fetch-depth: 1

      - name: Set up canonical Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Download predecessor completed logical-quarter artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: kraken-posttrade-full-*
          path: ${{ runner.temp }}/r08-predecessor
          merge-multiple: false
          github-token: ${{ github.token }}
          repository: vitaliipython-ship-it/eth-macro-data-bridge
          run-id: 33916820262

      - name: Verify exact predecessor frontier 000 through 021
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from tools.deep_history import kraken_spot_posttrade as posttrade

          root = Path(os.environ["RUNNER_TEMP"]) / "r08-predecessor"
          directories = sorted(path for path in root.iterdir() if path.is_dir() and path.name.startswith("kraken-posttrade-full-"))
          if len(directories) != 22:
              raise RuntimeError(f"predecessor artifact count mismatch: {len(directories)} != 22")
          expected_indices = list(range(22))
          actual_indices = sorted(int(path.name.split("-")[3]) for path in directories)
          if actual_indices != expected_indices:
              raise RuntimeError(f"predecessor frontier mismatch: {actual_indices}")
          required = {"evidence.json", "provider-trade-ids.txt", "segment-output.json", "segment-readback.json"}
          previous_end = None
          readback_rows = []
          for directory in sorted(directories, key=lambda p: int(p.name.split("-")[3])):
              names = {p.name for p in directory.iterdir() if p.is_file()}
              if names != required:
                  raise RuntimeError(f"predecessor artifact file-set mismatch: {directory.name} {sorted(names)}")
              evidence = json.loads((directory / "evidence.json").read_text())
              readback = json.loads((directory / "segment-readback.json").read_text())
              if evidence["segment_id"] != posttrade.segment_id(evidence["requested_start_utc"], evidence["requested_end_utc"]):
                  raise RuntimeError("predecessor deterministic segment identity mismatch")
              if readback["segment_id"] != evidence["segment_id"]:
                  raise RuntimeError("predecessor readback identity mismatch")
              if readback["evidence_sha256"] != posttrade.sha256_file(directory / "evidence.json"):
                  raise RuntimeError("predecessor evidence SHA mismatch")
              if readback["segment_output_sha256"] != posttrade.sha256_file(directory / "segment-output.json"):
                  raise RuntimeError("predecessor output SHA mismatch")
              if readback["provider_trade_ids_sha256"] != posttrade.sha256_file(directory / "provider-trade-ids.txt"):
                  raise RuntimeError("predecessor provider-ID SHA mismatch")
              if evidence.get("completion_status") != "COMPLETE" or evidence.get("cursor_monotonic") is not True:
                  raise RuntimeError("predecessor completion/cursor evidence failed")
              if int(evidence.get("trade_id_conflict_count", -1)) != 0:
                  raise RuntimeError("predecessor trade-ID conflict")
              if evidence.get("gap_policy") != "PROVIDER_NO_TRADE_OMISSION" or evidence.get("synthetic_fill") is not False:
                  raise RuntimeError("predecessor gap semantics mismatch")
              if previous_end is not None and previous_end != evidence["requested_start_utc"]:
                  raise RuntimeError("predecessor logical-quarter chain gap")
              previous_end = evidence["requested_end_utc"]
              readback_rows.append({"segment_id": evidence["segment_id"], "start": evidence["requested_start_utc"], "end": evidence["requested_end_utc"]})
          if previous_end != "2021-01-01T00:00:00.000000Z":
              raise RuntimeError(f"unexpected predecessor frontier end: {previous_end}")
          evidence_path = Path(os.environ["RUNNER_TEMP"]) / "r08-predecessor-frontier.json"
          evidence_path.write_bytes(posttrade.compact({
              "schema_version": "kraken-posttrade-r08-predecessor-frontier/1.0.0",
              "predecessor_run_id": 33916820262,
              "source_authority_sha": os.environ["SOURCE_AUTHORITY_SHA"],
              "complete_persisted_count": 22,
              "first_unfinished_index": 22,
              "provider_network_call_count": 0,
              "segments": readback_rows,
              "status": "PASS",
          }))
          print("PREDECESSOR_FRONTIER_READBACK=PASS")
          print("PREDECESSOR_COMPLETE_PERSISTED=22/45")
          print("PREDECESSOR_PROVIDER_NETWORK_CALL_COUNT=0")
          PY

      - name: Upload predecessor frontier readback evidence only
        uses: actions/upload-artifact@v4
        with:
          name: kraken-posttrade-r08-predecessor-frontier
          path: ${{ runner.temp }}/r08-predecessor-frontier.json
          retention-days: 7
          if-no-files-found: error

  recovery_inventory:
    needs: predecessor_frontier_readback
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.inventory.outputs.matrix }}
      start_utc: ${{ steps.inventory.outputs.start_utc }}
      end_utc: ${{ steps.inventory.outputs.end_utc }}
      cutoff_ms: ${{ steps.inventory.outputs.cutoff_ms }}
      warm_first_ms: ${{ steps.inventory.outputs.warm_first_ms }}
      segment_count: ${{ steps.inventory.outputs.segment_count }}
    steps:
      - name: Checkout qualified production source authority
        uses: actions/checkout@v6
        with:
          ref: 91546fdd81471851c2cb6b948821c04cfe636f1c
          fetch-depth: 1

      - name: Set up canonical Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Materialize logical-quarter recovery inventory 022 through 044
        id: inventory
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from tools.deep_history import kraken_spot_ohlcvt_backfill as backfill
          from tools.deep_history import kraken_spot_posttrade as posttrade

          release_manifest = json.loads(Path("history/release-manifest.json").read_text())
          cutoff_ms = int(release_manifest["backfill_as_of_ms"])
          warm_first_ms = backfill._warm_first_timestamp()
          end_ms = min(cutoff_ms, warm_first_ms + backfill.WARM_OVERLAP_MS)
          start_utc = posttrade.MARKET_INCEPTION_UTC
          end_utc = backfill._iso_ms(end_ms)
          inventory = posttrade.build_segment_inventory(start_utc, end_utc)
          if len(inventory) != 45:
              raise RuntimeError(f"logical inventory drift: {len(inventory)} != 45")
          if inventory[22]["segment_id"] != "9deb84887d89898ab28e95f2dcae97e1726500baa18c75cf9f002c5fcae78ff1":
              raise RuntimeError("segment 22 identity drift")
          if inventory[22]["requested_start_utc"] != "2021-01-01T00:00:00.000000Z" or inventory[22]["requested_end_utc"] != "2021-04-01T00:00:00.000000Z":
              raise RuntimeError("segment 22 range drift")
          selected = []
          for index, item in enumerate(inventory[22:], 22):
              selected.append({
                  "index": index,
                  "segment_id": item["segment_id"],
                  "start_utc": item["requested_start_utc"],
                  "end_utc": item["requested_end_utc"],
                  "artifact_name": f"kraken-posttrade-full-{index:03d}-{item['segment_id'][:12]}",
              })
          matrix = {"include": selected}
          output = Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8") as stream:
              stream.write("matrix=" + json.dumps(matrix, separators=(",", ":")) + "\n")
              stream.write(f"start_utc={start_utc}\n")
              stream.write(f"end_utc={end_utc}\n")
              stream.write(f"cutoff_ms={cutoff_ms}\n")
              stream.write(f"warm_first_ms={warm_first_ms}\n")
              stream.write(f"segment_count={len(inventory)}\n")
          print("LOGICAL_SEGMENT_COUNT=45")
          print("RECOVERY_LOGICAL_SEGMENT_RANGE=22..44")
          print("NORMAL_EXECUTION=UTC_CALENDAR_QUARTER")
          print("BOUNDARY_FALLBACK=DETERMINISTIC_UTC_CALENDAR_MONTH")
          PY

  remaining_logical_segment:
    needs: recovery_inventory
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix: ${{ fromJSON(needs.recovery_inventory.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout qualified production source authority
        uses: actions/checkout@v6
        with:
          ref: 91546fdd81471851c2cb6b948821c04cfe636f1c
          fetch-depth: 1

      - name: Set up canonical Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Try normal logical-quarter execution or select approved fallback
        id: quarter
        shell: bash
        env:
          SEGMENT_INDEX: ${{ matrix.index }}
          SEGMENT_ID: ${{ matrix.segment_id }}
          SEGMENT_START_UTC: ${{ matrix.start_utc }}
          SEGMENT_END_UTC: ${{ matrix.end_utc }}
        run: |
          set -euo pipefail
          TARGET="${RUNNER_TEMP}/logical-parent"
          DIRECT_ROOT="${RUNNER_TEMP}/r08-direct-root"
          rm -rf "$TARGET" "$DIRECT_ROOT"
          if [[ "${SEGMENT_INDEX}" == "22" ]]; then
            echo "fallback=true" >> "$GITHUB_OUTPUT"
            echo "fallback_reason=OWNER_AUTHORIZED_EXACT_SEGMENT_22_RECOVERY" >> "$GITHUB_OUTPUT"
            echo "SEGMENT_22_DIRECT_QUARTER_RETRY=SKIPPED_BY_OWNER_RECOVERY_POLICY"
            exit 0
          fi
          set +e
          timeout --signal=TERM 3081s python - <<'PY'
          import json
          import os
          import shutil
          import sys
          import time
          from pathlib import Path
          from tools.deep_history import kraken_spot_posttrade as posttrade

          descriptor = posttrade.segment_descriptor(os.environ["SEGMENT_START_UTC"], os.environ["SEGMENT_END_UTC"])
          if descriptor["segment_id"] != os.environ["SEGMENT_ID"]:
              raise RuntimeError("matrix logical segment identity mismatch")
          root = Path(os.environ["RUNNER_TEMP"]) / "r08-direct-root"
          started = time.monotonic()
          result = posttrade.execute_segment(root, descriptor)
          elapsed = time.monotonic() - started
          evidence = result["evidence"]
          bound = float(posttrade.QUALIFIED_CONSERVATIVE_QUARTER_SECONDS)
          page_bound = int(os.environ["KRAKEN_POSTTRADE_QUALIFIED_QUARTER_PAGE_BOUND"])
          if elapsed > bound:
              print(f"QUALIFIED_QUARTER_EXECUTION_TIME_BOUND_EXCEEDED elapsed={elapsed:.6f} bound={bound:.6f}")
              sys.exit(81)
          if int(evidence["page_count"]) > page_bound:
              print(f"QUALIFIED_QUARTER_PAGE_BOUND_EXCEEDED pages={evidence['page_count']} bound={page_bound}")
              sys.exit(82)
          if evidence.get("completion_status") != "COMPLETE" or evidence.get("cursor_monotonic") is not True:
              raise RuntimeError("direct quarter completion/cursor evidence failed")
          if int(evidence.get("trade_id_conflict_count", -1)) != 0:
              raise RuntimeError("direct quarter provider trade-ID conflict")
          if evidence.get("gap_policy") != "PROVIDER_NO_TRADE_OMISSION" or evidence.get("synthetic_fill") is not False:
              raise RuntimeError("direct quarter gap semantics changed")
          target = Path(os.environ["RUNNER_TEMP"]) / "logical-parent"
          shutil.copytree(Path(result["directory"]), target)
          staged_evidence = json.loads((target / "evidence.json").read_text())
          staged_evidence.update({
              "execution_mode": "DIRECT_QUARTER",
              "recovery_mode": "NONE",
              "source_authority_sha": os.environ["SOURCE_AUTHORITY_SHA"],
              "recovery_orchestration_sha": os.environ["GITHUB_SHA"],
          })
          (target / "evidence.json").write_bytes(posttrade.compact(staged_evidence))
          readback = {
              "schema_version": "kraken-posttrade-full-segment-readback/2.0.0",
              "execution_mode": "DIRECT_QUARTER",
              "segment_id": descriptor["segment_id"],
              "requested_start_utc": descriptor["requested_start_utc"],
              "requested_end_utc": descriptor["requested_end_utc"],
              "elapsed_seconds": f"{elapsed:.6f}",
              "qualified_time_bound_seconds": str(posttrade.QUALIFIED_CONSERVATIVE_QUARTER_SECONDS),
              "qualified_page_bound": page_bound,
              "source_authority_sha": os.environ["SOURCE_AUTHORITY_SHA"],
              "recovery_orchestration_sha": os.environ["GITHUB_SHA"],
              "evidence_sha256": posttrade.sha256_file(target / "evidence.json"),
              "segment_output_sha256": posttrade.sha256_file(target / "segment-output.json"),
              "provider_trade_ids_sha256": posttrade.sha256_file(target / "provider-trade-ids.txt"),
              "status": "PASS",
          }
          (target / "segment-readback.json").write_bytes(posttrade.compact(readback))
          print(f"DIRECT_QUARTER_PAGE_COUNT={evidence['page_count']}")
          print(f"DIRECT_QUARTER_ELAPSED_SECONDS={elapsed:.6f}")
          print("DIRECT_QUARTER_EXECUTION=PASS")
          PY
          rc=$?
          set -e
          if [[ "$rc" == "0" ]]; then
            echo "fallback=false" >> "$GITHUB_OUTPUT"
            echo "fallback_reason=NONE" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          rm -rf "$TARGET" "$DIRECT_ROOT"
          if [[ "$rc" == "124" || "$rc" == "81" || "$rc" == "82" ]]; then
            echo "fallback=true" >> "$GITHUB_OUTPUT"
            if [[ "$rc" == "82" ]]; then
              echo "fallback_reason=QUALIFIED_QUARTER_PAGE_BOUND_EXCEEDED" >> "$GITHUB_OUTPUT"
            else
              echo "fallback_reason=QUALIFIED_QUARTER_EXECUTION_TIME_BOUND_EXCEEDED" >> "$GITHUB_OUTPUT"
            fi
            echo "DIRECT_QUARTER_BOUNDARY_ONLY_FAILURE=APPROVED_MONTH_FALLBACK"
            exit 0
          fi
          echo "DIRECT_QUARTER_NON_BOUNDARY_FAILURE_RC=$rc"
          exit "$rc"

      - name: Prepare deterministic calendar-month child runner
        if: ${{ steps.quarter.outputs.fallback == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/r08-child-runner.py" <<'PY'
          import hashlib
          import json
          import os
          import shutil
          import sys
          import time
          from datetime import datetime, timezone
          from pathlib import Path
          from tools.deep_history import kraken_spot_posttrade as posttrade

          ordinal = int(sys.argv[1])
          parent_start = posttrade.parse_utc(os.environ["SEGMENT_START_UTC"])
          parent_end = posttrade.parse_utc(os.environ["SEGMENT_END_UTC"])
          if parent_start.day != 1 or parent_start.hour or parent_start.minute or parent_start.second or parent_start.microsecond:
              raise RuntimeError("fallback parent must start on UTC calendar-month boundary")
          boundaries = [parent_start]
          current = parent_start
          for _ in range(3):
              year = current.year + (1 if current.month == 12 else 0)
              month = 1 if current.month == 12 else current.month + 1
              current = datetime(year, month, 1, tzinfo=timezone.utc)
              boundaries.append(current)
          if boundaries[-1] != parent_end:
              raise RuntimeError("logical quarter is not exactly three UTC calendar months")
          start = posttrade.iso_utc(boundaries[ordinal])
          end = posttrade.iso_utc(boundaries[ordinal + 1])
          descriptor = posttrade.segment_descriptor(start, end)
          identity_material = {
              "source_authority_sha": os.environ["SOURCE_AUTHORITY_SHA"],
              "source_mode": posttrade.SOURCE_MODE,
              "provider_symbol": posttrade.SYMBOL,
              "parent_logical_segment_id": os.environ["SEGMENT_ID"],
              "child_start_utc": start,
              "child_end_utc": end,
              "source_schema": posttrade.SOURCE_SCHEMA,
              "recovery_schema": os.environ["RECOVERY_SCHEMA"],
          }
          recovery_child_id = hashlib.sha256(posttrade.compact(identity_material)).hexdigest()
          root = Path(os.environ["RUNNER_TEMP"]) / f"r08-child-root-{ordinal}"
          target = Path(os.environ["RUNNER_TEMP"]) / f"r08-child-{ordinal}"
          if root.exists(): shutil.rmtree(root)
          if target.exists(): shutil.rmtree(target)
          started = time.monotonic()
          result = posttrade.execute_segment(root, descriptor)
          elapsed = time.monotonic() - started
          evidence = result["evidence"]
          bound = float(posttrade.QUALIFIED_CONSERVATIVE_QUARTER_SECONDS)
          page_bound = int(os.environ["KRAKEN_POSTTRADE_QUALIFIED_QUARTER_PAGE_BOUND"])
          if elapsed > bound:
              print(f"POSTTRADE_CALENDAR_MONTH_EXECUTION_TIME_BOUNDARY_EXCEEDED elapsed={elapsed:.6f} bound={bound:.6f}")
              sys.exit(92)
          if int(evidence["page_count"]) > page_bound:
              print(f"POSTTRADE_CALENDAR_MONTH_PAGE_BOUNDARY_EXCEEDED pages={evidence['page_count']} bound={page_bound}")
              sys.exit(93)
          if evidence.get("completion_status") != "COMPLETE" or evidence.get("cursor_monotonic") is not True:
              raise RuntimeError("calendar-month completion/cursor evidence failed")
          if int(evidence.get("trade_id_conflict_count", -1)) != 0:
              raise RuntimeError("calendar-month provider trade-ID conflict")
          if evidence.get("gap_policy") != "PROVIDER_NO_TRADE_OMISSION" or evidence.get("synthetic_fill") is not False:
              raise RuntimeError("calendar-month gap semantics changed")
          shutil.copytree(Path(result["directory"]), target)
          child_meta = {
              "schema_version": os.environ["RECOVERY_SCHEMA"],
              "recovery_child_id": recovery_child_id,
              "production_child_segment_id": descriptor["segment_id"],
              "parent_logical_segment_id": os.environ["SEGMENT_ID"],
              "parent_logical_segment_index": int(os.environ["SEGMENT_INDEX"]),
              "source_authority_sha": os.environ["SOURCE_AUTHORITY_SHA"],
              "recovery_orchestration_sha": os.environ["GITHUB_SHA"],
              "requested_start_utc": start,
              "requested_end_utc": end,
              "page_count": int(evidence["page_count"]),
              "elapsed_seconds": f"{elapsed:.6f}",
              "qualified_page_bound": page_bound,
              "qualified_time_bound_seconds": str(posttrade.QUALIFIED_CONSERVATIVE_QUARTER_SECONDS),
              "frozen_source_digest": evidence["frozen_source_digest"],
              "cursor_monotonic": True,
              "trade_id_conflict_count": 0,
              "gap_policy": posttrade.GAP_POLICY,
              "synthetic_fill": False,
              "status": "PASS",
          }
          (target / "recovery-child.json").write_bytes(posttrade.compact(child_meta))
          (target / "child-readback.json").write_bytes(posttrade.compact({
              "schema_version": "kraken-posttrade-r08-child-readback/1.0.0",
              "recovery_child_id": recovery_child_id,
              "evidence_sha256": posttrade.sha256_file(target / "evidence.json"),
              "segment_output_sha256": posttrade.sha256_file(target / "segment-output.json"),
              "provider_trade_ids_sha256": posttrade.sha256_file(target / "provider-trade-ids.txt"),
              "recovery_child_sha256": posttrade.sha256_file(target / "recovery-child.json"),
              "status": "PASS",
          }))
          print(f"RECOVERY_CHILD_ID={recovery_child_id}")
          print(f"RECOVERY_CHILD_RANGE=[{start},{end})")
          print(f"RECOVERY_CHILD_PAGE_COUNT={evidence['page_count']}")
          print(f"RECOVERY_CHILD_ELAPSED_SECONDS={elapsed:.6f}")
          print("RECOVERY_CHILD_COMPLETION=PASS")
          PY

      - name: Acquire fallback calendar month 0
        id: month0
        if: ${{ steps.quarter.outputs.fallback == 'true' }}
        shell: bash
        env:
          SEGMENT_INDEX: ${{ matrix.index }}
          SEGMENT_ID: ${{ matrix.segment_id }}
          SEGMENT_START_UTC: ${{ matrix.start_utc }}
          SEGMENT_END_UTC: ${{ matrix.end_utc }}
        run: |
          set -euo pipefail
          set +e
          timeout --signal=TERM 3081s python "${RUNNER_TEMP}/r08-child-runner.py" 0
          rc=$?
          set -e
          if [[ "$rc" == "124" || "$rc" == "92" || "$rc" == "93" ]]; then
            echo "STOP_CODE=POSTTRADE_CALENDAR_MONTH_EXECUTION_BOUNDARY_EXCEEDED"
            echo "NEXT_EXACT_GATE=OWNER_DECISION_ON_SUBMONTH_EXECUTION_MODEL"
            exit "$rc"
          fi
          exit "$rc"

      - name: Persist fallback calendar month 0 checkpoint
        if: ${{ steps.quarter.outputs.fallback == 'true' && steps.month0.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: kraken-posttrade-recovery-child-${{ matrix.index }}-0
          path: ${{ runner.temp }}/r08-child-0
          retention-days: 7
          if-no-files-found: error

      - name: Acquire fallback calendar month 1
        id: month1
        if: ${{ steps.quarter.outputs.fallback == 'true' }}
        shell: bash
        env:
          SEGMENT_INDEX: ${{ matrix.index }}
          SEGMENT_ID: ${{ matrix.segment_id }}
          SEGMENT_START_UTC: ${{ matrix.start_utc }}
          SEGMENT_END_UTC: ${{ matrix.end_utc }}
        run: |
          set -euo pipefail
          set +e
          timeout --signal=TERM 3081s python "${RUNNER_TEMP}/r08-child-runner.py" 1
          rc=$?
          set -e
          if [[ "$rc" == "124" || "$rc" == "92" || "$rc" == "93" ]]; then
            echo "STOP_CODE=POSTTRADE_CALENDAR_MONTH_EXECUTION_BOUNDARY_EXCEEDED"
            echo "NEXT_EXACT_GATE=OWNER_DECISION_ON_SUBMONTH_EXECUTION_MODEL"
            exit "$rc"
          fi
          exit "$rc"

      - name: Persist fallback calendar month 1 checkpoint
        if: ${{ steps.quarter.outputs.fallback == 'true' && steps.month1.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: kraken-posttrade-recovery-child-${{ matrix.index }}-1
          path: ${{ runner.temp }}/r08-child-1
          retention-days: 7
          if-no-files-found: error

      - name: Acquire fallback calendar month 2
        id: month2
        if: ${{ steps.quarter.outputs.fallback == 'true' }}
        shell: bash
        env:
          SEGMENT_INDEX: ${{ matrix.index }}
          SEGMENT_ID: ${{ matrix.segment_id }}
          SEGMENT_START_UTC: ${{ matrix.start_utc }}
          SEGMENT_END_UTC: ${{ matrix.end_utc }}
        run: |
          set -euo pipefail
          set +e
          timeout --signal=TERM 3081s python "${RUNNER_TEMP}/r08-child-runner.py" 2
          rc=$?
          set -e
          if [[ "$rc" == "124" || "$rc" == "92" || "$rc" == "93" ]]; then
            echo "STOP_CODE=POSTTRADE_CALENDAR_MONTH_EXECUTION_BOUNDARY_EXCEEDED"
            echo "NEXT_EXACT_GATE=OWNER_DECISION_ON_SUBMONTH_EXECUTION_MODEL"
            exit "$rc"
          fi
          exit "$rc"

      - name: Persist fallback calendar month 2 checkpoint
        if: ${{ steps.quarter.outputs.fallback == 'true' && steps.month2.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: kraken-posttrade-recovery-child-${{ matrix.index }}-2
          path: ${{ runner.temp }}/r08-child-2
          retention-days: 7
          if-no-files-found: error

      - name: Assemble recovered logical quarter from three calendar months
        if: ${{ steps.quarter.outputs.fallback == 'true' }}
        shell: bash
        env:
          SEGMENT_INDEX: ${{ matrix.index }}
          SEGMENT_ID: ${{ matrix.segment_id }}
          SEGMENT_START_UTC: ${{ matrix.start_utc }}
          SEGMENT_END_UTC: ${{ matrix.end_utc }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          from decimal import Decimal
          from pathlib import Path
          from tools.deep_history import kraken_spot_posttrade as posttrade

          children = [Path(os.environ["RUNNER_TEMP"]) / f"r08-child-{i}" for i in range(3)]
          metas = [json.loads((child / "recovery-child.json").read_text()) for child in children]
          evidences = [json.loads((child / "evidence.json").read_text()) for child in children]
          if metas[0]["requested_start_utc"] != os.environ["SEGMENT_START_UTC"]:
              raise RuntimeError("fallback parent start coverage mismatch")
          if metas[-1]["requested_end_utc"] != os.environ["SEGMENT_END_UTC"]:
              raise RuntimeError("fallback parent end coverage mismatch")
          for left, right in zip(metas, metas[1:]):
              if left["requested_end_utc"] != right["requested_start_utc"]:
                  raise RuntimeError("fallback child coverage gap/overlap")
          page_bound = int(os.environ["KRAKEN_POSTTRADE_QUALIFIED_QUARTER_PAGE_BOUND"])
          time_bound = posttrade.QUALIFIED_CONSERVATIVE_QUARTER_SECONDS
          for meta, evidence in zip(metas, evidences):
              if meta["source_authority_sha"] != os.environ["SOURCE_AUTHORITY_SHA"]:
                  raise RuntimeError("fallback child source authority drift")
              if int(meta["page_count"]) > page_bound or Decimal(meta["elapsed_seconds"]) > time_bound:
                  raise RuntimeError("fallback child qualified boundary violation")
              if evidence.get("completion_status") != "COMPLETE" or evidence.get("cursor_monotonic") is not True:
                  raise RuntimeError("fallback child completion/cursor failed")
              if int(evidence.get("trade_id_conflict_count", -1)) != 0:
                  raise RuntimeError("fallback child provider trade-ID conflict")
          all_ids = []
          seen = set()
          for child in children:
              for trade_id in (child / "provider-trade-ids.txt").read_text(encoding="ascii").splitlines():
                  if trade_id in seen:
                      raise RuntimeError(f"POSTTRADE_PRODUCTION_TRADE_ID_CONFLICT across fallback children {trade_id}")
                  seen.add(trade_id)
                  all_ids.append(trade_id)
          assembled_a = posttrade.assemble_segment_outputs(children)
          assembled_b = posttrade.assemble_segment_outputs(children)
          if assembled_a != assembled_b:
              raise RuntimeError("recovered parent assembly Build A/B mismatch")
          ids_a = "\n".join(all_ids) + ("\n" if all_ids else "")
          ids_b = "\n".join(all_ids) + ("\n" if all_ids else "")
          if ids_a != ids_b:
              raise RuntimeError("recovered parent provider-ID assembly nondeterminism")
          parent_descriptor = posttrade.segment_descriptor(os.environ["SEGMENT_START_UTC"], os.environ["SEGMENT_END_UTC"])
          if parent_descriptor["segment_id"] != os.environ["SEGMENT_ID"]:
              raise RuntimeError("recovered parent logical identity mismatch")
          target = Path(os.environ["RUNNER_TEMP"]) / "logical-parent"
          if target.exists(): shutil.rmtree(target)
          target.mkdir(parents=True)
          (target / "segment-output.json").write_bytes(posttrade.compact(assembled_a))
          (target / "provider-trade-ids.txt").write_text(ids_a, encoding="ascii")
          frozen_digests = [e["frozen_source_digest"] for e in evidences]
          raw_page_digests = [e["raw_pages_digest"] for e in evidences]
          transcript_digests = [e["page_transcript_digest"] for e in evidences]
          parent_frozen = hashlib.sha256(posttrade.compact(frozen_digests)).hexdigest()
          first = next((e for e in evidences if e.get("first_provider_trade_ts")), None)
          last = next((e for e in reversed(evidences) if e.get("last_provider_trade_ts")), None)
          parent_evidence = {
              "schema_version": posttrade.SOURCE_SCHEMA,
              "source_mode": posttrade.SOURCE_MODE,
              "symbol": posttrade.SYMBOL,
              "segment_id": parent_descriptor["segment_id"],
              "requested_start_utc": parent_descriptor["requested_start_utc"],
              "requested_end_utc": parent_descriptor["requested_end_utc"],
              "first_provider_trade_ts": None if first is None else first["first_provider_trade_ts"],
              "first_provider_trade_id": None if first is None else first["first_provider_trade_id"],
              "last_provider_trade_ts": None if last is None else last["last_provider_trade_ts"],
              "last_provider_trade_id": None if last is None else last["last_provider_trade_id"],
              "page_count": sum(int(e["page_count"]) for e in evidences),
              "raw_row_count": sum(int(e["raw_row_count"]) for e in evidences),
              "unique_trade_count": sum(int(e["unique_trade_count"]) for e in evidences),
              "duplicate_trade_id_count": sum(int(e["duplicate_trade_id_count"]) for e in evidences),
              "trade_id_conflict_count": 0,
              "initial_cursor": evidences[0]["initial_cursor"],
              "final_cursor": evidences[-1]["final_cursor"],
              "cursor_monotonic": True,
              "frozen_source_digest": parent_frozen,
              "raw_pages_digest": hashlib.sha256(posttrade.compact(raw_page_digests)).hexdigest(),
              "page_transcript_digest": hashlib.sha256(posttrade.compact(transcript_digests)).hexdigest(),
              "gap_policy": posttrade.GAP_POLICY,
              "synthetic_fill": False,
              "completion_status": "COMPLETE",
              "build_a_source_digest": parent_frozen,
              "build_b_source_digest": parent_frozen,
              "derived_5m_digest": posttrade._digest_records(assembled_a["5m"]),
              "derived_1d_digest": posttrade._digest_records(assembled_a["1d"]),
              "segment_output_digest": posttrade.sha256_file(target / "segment-output.json"),
              "persistence_model": "S2_MINIMUM_SEGMENT_OUTPUT_AND_EVIDENCE",
              "resume_granularity": "COMPLETED_LOGICAL_SEGMENT",
              "page_level_checkpointing": False,
              "max_parallel": 1,
              "execution_mode": "UTC_CALENDAR_MONTH_FALLBACK",
              "recovery_mode": "UTC_CALENDAR_MONTH_FALLBACK",
              "recovery_schema": os.environ["RECOVERY_SCHEMA"],
              "source_authority_sha": os.environ["SOURCE_AUTHORITY_SHA"],
              "recovery_orchestration_sha": os.environ["GITHUB_SHA"],
              "parent_segment_id": parent_descriptor["segment_id"],
              "child_segment_ids": [e["segment_id"] for e in evidences],
              "child_recovery_ids": [m["recovery_child_id"] for m in metas],
              "children": [{
                  "recovery_child_id": m["recovery_child_id"],
                  "production_child_segment_id": m["production_child_segment_id"],
                  "requested_start_utc": m["requested_start_utc"],
                  "requested_end_utc": m["requested_end_utc"],
                  "page_count": m["page_count"],
                  "elapsed_seconds": m["elapsed_seconds"],
                  "frozen_source_digest": m["frozen_source_digest"],
              } for m in metas],
              "coverage_proof": {"no_gap": True, "no_overlap": True, "status": "PASS"},
              "cross_child_provider_trade_id_conflicts": 0,
              "recovered_parent_build_a_b": "PASS",
              "recovered_parent_assembly_determinism": "PASS",
          }
          (target / "evidence.json").write_bytes(posttrade.compact(parent_evidence))
          total_elapsed = sum(Decimal(m["elapsed_seconds"]) for m in metas)
          readback = {
              "schema_version": "kraken-posttrade-full-segment-readback/2.0.0",
              "execution_mode": "UTC_CALENDAR_MONTH_FALLBACK",
              "segment_id": parent_descriptor["segment_id"],
              "requested_start_utc": parent_descriptor["requested_start_utc"],
              "requested_end_utc": parent_descriptor["requested_end_utc"],
              "elapsed_seconds": str(total_elapsed),
              "qualified_time_bound_seconds": str(posttrade.QUALIFIED_CONSERVATIVE_QUARTER_SECONDS),
              "qualified_page_bound": page_bound,
              "child_execution_count": 3,
              "source_authority_sha": os.environ["SOURCE_AUTHORITY_SHA"],
              "recovery_orchestration_sha": os.environ["GITHUB_SHA"],
              "evidence_sha256": posttrade.sha256_file(target / "evidence.json"),
              "segment_output_sha256": posttrade.sha256_file(target / "segment-output.json"),
              "provider_trade_ids_sha256": posttrade.sha256_file(target / "provider-trade-ids.txt"),
              "status": "PASS",
          }
          (target / "segment-readback.json").write_bytes(posttrade.compact(readback))
          print("RECOVERED_PARENT_SEGMENT_BUILD_A_B=PASS")
          print("RECOVERED_PARENT_SEGMENT_ASSEMBLY_DETERMINISM=PASS")
          print("CROSS_CHILD_PROVIDER_TRADE_ID_CONFLICTS=0")
          print("PARENT_COVERAGE_NO_GAP=PASS")
          print("PARENT_COVERAGE_NO_OVERLAP=PASS")
          print(f"RECOVERED_PARENT_SEGMENT_ID={parent_descriptor['segment_id']}")
          PY

      - name: Persist completed logical-quarter artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ runner.temp }}/logical-parent
          retention-days: 7
          if-no-files-found: error

  full_readback_and_candidate:
    needs:
      - recovery_inventory
      - remaining_logical_segment
    if: ${{ needs.remaining_logical_segment.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout qualified production source authority
        uses: actions/checkout@v6
        with:
          ref: 91546fdd81471851c2cb6b948821c04cfe636f1c
          fetch-depth: 1

      - name: Set up canonical Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Download predecessor logical artifacts 000 through 021
        uses: actions/download-artifact@v4
        with:
          pattern: kraken-posttrade-full-*
          path: ${{ runner.temp }}/kraken-posttrade-global/predecessor
          merge-multiple: false
          github-token: ${{ github.token }}
          repository: vitaliipython-ship-it/eth-macro-data-bridge
          run-id: 33916820262

      - name: Download successor logical artifacts 022 through 044
        uses: actions/download-artifact@v4
        with:
          pattern: kraken-posttrade-full-*
          path: ${{ runner.temp }}/kraken-posttrade-global/successor
          merge-multiple: false

      - name: Global provider trade-ID uniqueness audit
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${RUNNER_TEMP}/kraken-posttrade-global"
          IDS="${RUNNER_TEMP}/kraken-posttrade-global-provider-ids.txt"
          find "$ROOT" -type f -name provider-trade-ids.txt -print0 | sort -z | xargs -0 cat > "$IDS"
          DUPLICATE_ID="$(LC_ALL=C sort -S 50% "$IDS" | uniq -d | head -n 1 || true)"
          if [[ -n "$DUPLICATE_ID" ]]; then
            echo "POSTTRADE_PRODUCTION_TRADE_ID_CONFLICT_ACROSS_LOGICAL_SEGMENTS=$DUPLICATE_ID"
            exit 71
          fi
          echo "GLOBAL_PROVIDER_TRADE_ID_AUDIT=PASS"
          echo "GLOBAL_PROVIDER_TRADE_ID_CONFLICTS=0"

      - name: Full-chain readback, Build A/B, WARM, forensic and candidate qualification
        shell: bash
        env:
          FULL_START_UTC: ${{ needs.recovery_inventory.outputs.start_utc }}
          FULL_END_UTC: ${{ needs.recovery_inventory.outputs.end_utc }}
          FULL_CUTOFF_MS: ${{ needs.recovery_inventory.outputs.cutoff_ms }}
          FULL_WARM_FIRST_MS: ${{ needs.recovery_inventory.outputs.warm_first_ms }}
          FULL_SEGMENT_COUNT: ${{ needs.recovery_inventory.outputs.segment_count }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          from datetime import datetime, timezone
          from decimal import Decimal
          from pathlib import Path
          from tools.deep_history import kraken_spot_ohlcvt_backfill as backfill
          from tools.deep_history import kraken_spot_posttrade as posttrade

          root = Path(os.environ["RUNNER_TEMP"]) / "kraken-posttrade-global"
          predecessor_root = root / "predecessor"
          successor_root = root / "successor"
          directories = sorted({p.parent for p in root.rglob("evidence.json")}, key=lambda d: json.loads((d / "evidence.json").read_text())["requested_start_utc"])
          if len(directories) != 45:
              raise RuntimeError(f"logical segment readback count mismatch: {len(directories)} != 45")
          required = {"evidence.json", "provider-trade-ids.txt", "segment-output.json", "segment-readback.json"}
          evidences = []
          outputs = []
          previous_end = None
          fallback_parents = []
          page_bound = int(os.environ["KRAKEN_POSTTRADE_QUALIFIED_QUARTER_PAGE_BOUND"])
          for index, directory in enumerate(directories):
              names = {p.name for p in directory.iterdir() if p.is_file()}
              if names != required:
                  raise RuntimeError(f"logical artifact file-set mismatch: {directory} {sorted(names)}")
              evidence = json.loads((directory / "evidence.json").read_text())
              readback = json.loads((directory / "segment-readback.json").read_text())
              start = evidence["requested_start_utc"]
              end = evidence["requested_end_utc"]
              if evidence["segment_id"] != posttrade.segment_id(start, end):
                  raise RuntimeError("logical segment deterministic identity mismatch")
              if readback["segment_id"] != evidence["segment_id"]:
                  raise RuntimeError("logical readback identity mismatch")
              if readback["evidence_sha256"] != posttrade.sha256_file(directory / "evidence.json"):
                  raise RuntimeError("logical evidence SHA mismatch")
              if readback["segment_output_sha256"] != posttrade.sha256_file(directory / "segment-output.json"):
                  raise RuntimeError("logical output SHA mismatch")
              if readback["provider_trade_ids_sha256"] != posttrade.sha256_file(directory / "provider-trade-ids.txt"):
                  raise RuntimeError("logical provider-ID SHA mismatch")
              if evidence.get("completion_status") != "COMPLETE" or evidence.get("cursor_monotonic") is not True:
                  raise RuntimeError("logical completion/cursor failed")
              if int(evidence.get("trade_id_conflict_count", -1)) != 0:
                  raise RuntimeError("logical provider trade-ID conflict")
              if evidence.get("gap_policy") != "PROVIDER_NO_TRADE_OMISSION" or evidence.get("synthetic_fill") is not False:
                  raise RuntimeError("logical gap/no-fill semantics mismatch")
              if index < 22:
                  if predecessor_root not in directory.parents:
                      raise RuntimeError("predecessor lineage placement mismatch")
                  if int(evidence["page_count"]) > page_bound:
                      raise RuntimeError("predecessor quarter page bound exceeded")
                  if Decimal(readback["elapsed_seconds"]) > posttrade.QUALIFIED_CONSERVATIVE_QUARTER_SECONDS:
                      raise RuntimeError("predecessor quarter time bound exceeded")
              else:
                  if successor_root not in directory.parents:
                      raise RuntimeError("successor lineage placement mismatch")
                  if evidence.get("source_authority_sha") != os.environ["SOURCE_AUTHORITY_SHA"]:
                      raise RuntimeError("successor source authority drift")
                  mode = evidence.get("execution_mode", "DIRECT_QUARTER")
                  if mode == "DIRECT_QUARTER":
                      if int(evidence["page_count"]) > page_bound:
                          raise RuntimeError("successor direct quarter page bound exceeded")
                      if Decimal(readback["elapsed_seconds"]) > posttrade.QUALIFIED_CONSERVATIVE_QUARTER_SECONDS:
                          raise RuntimeError("successor direct quarter time bound exceeded")
                  elif mode == "UTC_CALENDAR_MONTH_FALLBACK":
                      children = evidence.get("children")
                      if not isinstance(children, list) or len(children) != 3:
                          raise RuntimeError("recovered parent child inventory mismatch")
                      if evidence.get("cross_child_provider_trade_id_conflicts") != 0:
                          raise RuntimeError("recovered parent cross-child trade-ID conflict")
                      if evidence.get("recovered_parent_build_a_b") != "PASS" or evidence.get("recovered_parent_assembly_determinism") != "PASS":
                          raise RuntimeError("recovered parent determinism evidence failed")
                      if evidence.get("coverage_proof") != {"no_gap": True, "no_overlap": True, "status": "PASS"}:
                          raise RuntimeError("recovered parent coverage proof failed")
                      if children[0]["requested_start_utc"] != start or children[-1]["requested_end_utc"] != end:
                          raise RuntimeError("recovered parent outer coverage mismatch")
                      for left, right in zip(children, children[1:]):
                          if left["requested_end_utc"] != right["requested_start_utc"]:
                              raise RuntimeError("recovered parent child seam gap/overlap")
                      for child in children:
                          if int(child["page_count"]) > page_bound or Decimal(child["elapsed_seconds"]) > posttrade.QUALIFIED_CONSERVATIVE_QUARTER_SECONDS:
                              raise RuntimeError("recovered parent child hard boundary exceeded")
                      fallback_parents.append(index)
                  else:
                      raise RuntimeError(f"unknown successor execution mode: {mode}")
              if previous_end is None:
                  if start != "2015-08-07T00:00:00.000000Z":
                      raise RuntimeError(f"unexpected market inception segment start: {start}")
              elif previous_end != start:
                  raise RuntimeError(f"logical segment chain gap: {previous_end} -> {start}")
              previous_end = end
              evidences.append(evidence)
              outputs.append(json.loads((directory / "segment-output.json").read_text()))
          if previous_end != os.environ["FULL_END_UTC"]:
              raise RuntimeError("full-chain end mismatch")
          first = evidences[0]
          if first["first_provider_trade_ts"] != "2015-08-07T14:03:25.775444995Z" or first["first_provider_trade_id"] != "OG6TQH-NEBSF-FBMDZJ":
              raise RuntimeError("market inception provider identity drift")

          assembled_maps = {"5m": {}, "1d": {}}
          for output in outputs:
              if set(output) != {"5m", "1d"}:
                  raise RuntimeError("invalid logical segment output schema")
              for interval in ("5m", "1d"):
                  for row in output[interval]:
                      ts = int(row[0])
                      prior = assembled_maps[interval].get(ts)
                      assembled_maps[interval][ts] = row if prior is None else posttrade._merge_record(prior, row)
          assembled_a = {interval: [assembled_maps[interval][k] for k in sorted(assembled_maps[interval])] for interval in ("5m", "1d")}
          assembled_maps_b = {"5m": {}, "1d": {}}
          for output in outputs:
              for interval in ("5m", "1d"):
                  for row in output[interval]:
                      ts = int(row[0])
                      prior = assembled_maps_b[interval].get(ts)
                      assembled_maps_b[interval][ts] = row if prior is None else posttrade._merge_record(prior, row)
          assembled_b = {interval: [assembled_maps_b[interval][k] for k in sorted(assembled_maps_b[interval])] for interval in ("5m", "1d")}
          if assembled_a != assembled_b:
              raise RuntimeError("full logical segment assembly nondeterminism")
          if not assembled_a["5m"] or not assembled_a["1d"]:
              raise RuntimeError("full assembled output is empty")
          full_5m_sha = hashlib.sha256(posttrade.compact(assembled_a["5m"])).hexdigest()
          full_1d_sha = hashlib.sha256(posttrade.compact(assembled_a["1d"])).hexdigest()
          warm = backfill.verify_warm_overlap_records(assembled_a, Path("."))
          if warm["conflicts"] != 0:
              raise RuntimeError("PostTrade/WARM overlap conflict")

          def window(interval, start, end):
              start_ms = int(datetime.fromisoformat(start.replace("Z", "+00:00")).timestamp() * 1000)
              end_ms = int(datetime.fromisoformat(end.replace("Z", "+00:00")).timestamp() * 1000)
              rows = [row for row in assembled_a[interval] if start_ms <= int(row[0]) < end_ms]
              if not rows:
                  raise RuntimeError(f"forensic window empty: {interval} {start} {end}")
              return rows

          forensic = {}
          rows = window("1d", "2015-10-01T00:00:00Z", "2015-11-01T00:00:00Z")
          low = min(rows, key=lambda row: Decimal(str(row[3])))
          if not (Decimal("0.30") <= Decimal(str(low[3])) <= Decimal("0.60")):
              raise RuntimeError("2015 forensic low outside acceptance band")
          forensic["2015_0_41_region"] = {"low_row": low}
          rows = window("1d", "2016-06-01T00:00:00Z", "2016-07-01T00:00:00Z")
          high = max(rows, key=lambda row: Decimal(str(row[2])))
          if not (Decimal("20") <= Decimal(str(high[2])) <= Decimal("23")):
              raise RuntimeError("2016 forensic high outside acceptance band")
          forensic["2016_21_48_high_region"] = {"high_row": high}
          rows = window("1d", "2016-11-15T00:00:00Z", "2016-12-15T00:00:00Z")
          low = min(rows, key=lambda row: Decimal(str(row[3])))
          if not (Decimal("5") <= Decimal(str(low[3])) <= Decimal("7")):
              raise RuntimeError("2016 forensic low outside acceptance band")
          forensic["2016_5_92_low_region"] = {"low_row": low}
          rows = window("1d", "2017-06-01T00:00:00Z", "2017-08-01T00:00:00Z")
          high = max(rows, key=lambda row: Decimal(str(row[2])))
          low = min(rows, key=lambda row: Decimal(str(row[3])))
          if not (Decimal("350") <= Decimal(str(high[2])) <= Decimal("450")) or not (Decimal("100") <= Decimal(str(low[3])) <= Decimal("180")) or int(high[0]) >= int(low[0]):
              raise RuntimeError("2017 forensic acceptance failed")
          forensic["2017_404_98_to_134_78_ordering"] = {"high_row": high, "low_row": low}

          candidate_root = Path(os.environ["RUNNER_TEMP"]) / "kraken-posttrade-full-candidate"
          if candidate_root.exists(): shutil.rmtree(candidate_root)
          build_a = candidate_root / "build-a"
          build_b = candidate_root / "build-b"
          archive = candidate_root / "kraken-posttrade-derived-ohlcvt.zip"
          derived = posttrade.write_derived_archive(assembled_a, archive)
          lineage = backfill._source_lineage([{"evidence": evidence} for evidence in evidences])
          source = {
              "schema_version": posttrade.SOURCE_SCHEMA,
              "source_mode": posttrade.SOURCE_MODE,
              "authority": "KRAKEN_OFFICIAL_POSTTRADE",
              "endpoint": posttrade.ENDPOINT,
              "documentation": posttrade.DOCUMENTATION,
