          }
          (candidate_root / "qualification-summary.json").write_bytes(backfill.compact(qualification))
          shutil.rmtree(build_b)
          checksums = []
          for path in sorted(candidate_root.rglob("*")):
              if path.is_file():
                  checksums.append(f"{backfill.sha256_file(path)}  {path.relative_to(candidate_root).as_posix()}")
          (candidate_root / "SHA256SUMS").write_text("\n".join(checksums) + "\n", encoding="utf-8")

          print(f"FULL_POSTTRADE_SEGMENT_COUNT={len(evidences)}")
          print(f"FULL_POSTTRADE_PAGE_COUNT={source['page_count']}")
          print(f"FULL_POSTTRADE_RAW_ROW_COUNT={source['raw_row_count']}")
          print(f"FULL_POSTTRADE_UNIQUE_TRADE_COUNT={source['unique_trade_count']}")
          print(f"FULL_POSTTRADE_FROZEN_SOURCE_DIGEST={source['archive_sha256']}")
          print(f"FULL_POSTTRADE_SOURCE_LINEAGE_DIGEST={source['source_lineage_digest']}")
          print(f"FULL_POSTTRADE_DERIVED_ARCHIVE_SHA256={source['derived_archive_sha256']}")
          print(f"FULL_POSTTRADE_CANDIDATE_INVENTORY_SHA256={inventory_sha}")
