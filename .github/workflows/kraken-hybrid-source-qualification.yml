name: Kraken hybrid source physical qualification

on:
  push:
    branches:
      - agent/data-bridge/kraken-spot-deep-history-source-repair-r01
    paths:
      - .github/workflows/kraken-hybrid-source-qualification.yml
      - tools/deep_history/kraken_spot_time_sales.py
      - tools/deep_history/kraken_spot_rest_trades.py
      - tools/deep_history/kraken_spot_ohlcvt_backfill.py
      - history/release-manifest.json
      - history/kraken/ETHUSD/5m/**

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      PYTHONPATH: src:tools/deep_history:tools
      KRAKEN_REST_TRADES_DELAY_SECONDS: "1.0"
    steps:
      - name: Checkout exact branch SHA
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up canonical Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Bounded early ETHUSD PostTrade physical probe
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import urllib.parse
          import urllib.request
          from datetime import datetime

          ENDPOINT = "https://api.kraken.com/0/public/PostTrade"
          SYMBOL = "ETH/USD"
          QUERY_START = "2015-08-07T00:00:00Z"
          QUERY_END = "2015-12-31T23:59:59Z"
          EXPECTED_INCEPTION_PREFIX = "2015-08-07T14:03:25"
          USER_AGENT = "eth-macro-data-bridge-posttrade-qualification/1.0"

          def parse_ts(value: str) -> datetime:
              return datetime.fromisoformat(value.replace("Z", "+00:00"))

          def fingerprint(trade: dict) -> str:
              return json.dumps(trade, ensure_ascii=True, sort_keys=True, separators=(",", ":"))

          def fetch_page(from_ts: str) -> tuple[bytes, dict]:
              query = urllib.parse.urlencode(
                  {"symbol": SYMBOL, "from_ts": from_ts, "to_ts": QUERY_END, "count": "1000"}
              )
              request = urllib.request.Request(
                  f"{ENDPOINT}?{query}", headers={"User-Agent": USER_AGENT}
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  status = getattr(response, "status", None)
                  raw = response.read()
              if status != 200:
                  raise RuntimeError(f"Kraken PostTrade HTTP status={status}")
              payload = json.loads(raw.decode("utf-8"))
              if payload.get("error"):
                  raise RuntimeError(f"Kraken PostTrade errors={payload['error']}")
              result = payload.get("result")
              if not isinstance(result, dict):
                  raise RuntimeError("Kraken PostTrade result is not an object")
              return raw, result

          def validate_page(result: dict, label: str) -> tuple[list[dict], list[str], list[str], str]:
              trades = result.get("trades")
              if not isinstance(trades, list) or not trades:
                  raise RuntimeError(f"Kraken PostTrade {label} contains no trades")
              timestamps = []
              trade_ids = []
              for index, trade in enumerate(trades):
                  if not isinstance(trade, dict):
                      raise RuntimeError(f"Kraken PostTrade {label} trade[{index}] is not an object")
                  if trade.get("symbol") != SYMBOL:
                      raise RuntimeError(
                          f"Kraken PostTrade {label} wrong symbol trade[{index}]={trade.get('symbol')!r}"
                      )
                  trade_ts = trade.get("trade_ts")
                  trade_id = trade.get("trade_id")
                  if not isinstance(trade_ts, str) or not trade_ts:
                      raise RuntimeError(f"Kraken PostTrade {label} missing trade_ts at index={index}")
                  if not isinstance(trade_id, str) or not trade_id:
                      raise RuntimeError(f"Kraken PostTrade {label} missing trade_id at index={index}")
                  parse_ts(trade_ts)
                  timestamps.append(trade_ts)
                  trade_ids.append(trade_id)
              if [parse_ts(value) for value in timestamps] != sorted(parse_ts(value) for value in timestamps):
                  raise RuntimeError(f"Kraken PostTrade {label} timestamp regression")
              if len(set(trade_ids)) != len(trade_ids):
                  raise RuntimeError(f"Kraken PostTrade {label} duplicate trade_id inside page")
              last_ts = result.get("last_ts")
              if not isinstance(last_ts, str) or not last_ts:
                  raise RuntimeError(f"Kraken PostTrade {label} missing last_ts")
              parse_ts(last_ts)
              return trades, timestamps, trade_ids, last_ts

          raw_a, result_a = fetch_page(QUERY_START)
          trades_a, timestamps_a, trade_ids_a, last_ts_a = validate_page(result_a, "page-a")
          if len(timestamps_a) != 1000:
              raise RuntimeError(
                  f"Kraken PostTrade inception page did not fill bounded page: rows={len(timestamps_a)}"
              )
          if not timestamps_a[0].startswith(EXPECTED_INCEPTION_PREFIX):
              raise RuntimeError(
                  "Kraken PostTrade does not corroborate known ETHUSD inception: "
                  f"first={timestamps_a[0]} expected_prefix={EXPECTED_INCEPTION_PREFIX}"
              )

          raw_b, result_b = fetch_page(last_ts_a)
          trades_b, timestamps_b, trade_ids_b, last_ts_b = validate_page(result_b, "page-b")
          boundary = parse_ts(timestamps_a[-1])
          if parse_ts(timestamps_b[0]) < boundary:
              raise RuntimeError(
                  "Kraken PostTrade from_ts pagination regressed before prior boundary: "
                  f"prior_last_trade={timestamps_a[-1]} next_first_trade={timestamps_b[0]}"
              )

          seen_a = {trade["trade_id"]: fingerprint(trade) for trade in trades_a}
          repeated_provider_ids = 0
          advanced_trade_seen = False
          for trade in trades_b:
              trade_ts = parse_ts(trade["trade_ts"])
              if trade_ts < boundary:
                  raise RuntimeError("Kraken PostTrade page-b contains pre-boundary trade")
              if trade_ts > boundary:
                  advanced_trade_seen = True
              previous = seen_a.get(trade["trade_id"])
              if previous is not None:
                  if previous != fingerprint(trade):
                      raise RuntimeError(
                          f"Kraken PostTrade trade_id conflict across page boundary: {trade['trade_id']}"
                      )
                  repeated_provider_ids += 1
          if not advanced_trade_seen:
              raise RuntimeError("Kraken PostTrade page-b never advances beyond equal-timestamp boundary")
          if parse_ts(last_ts_b) <= parse_ts(last_ts_a):
              raise RuntimeError(
                  f"Kraken PostTrade last_ts did not advance: {last_ts_a}->{last_ts_b}"
              )

          print(f"KRAKEN_POSTTRADE_ENDPOINT={ENDPOINT}")
          print(f"KRAKEN_POSTTRADE_SYMBOL={SYMBOL}")
          print(f"KRAKEN_POSTTRADE_QUERY_START={QUERY_START}")
          print(f"KRAKEN_POSTTRADE_QUERY_END={QUERY_END}")
          print(f"KRAKEN_POSTTRADE_FIRST_TRADE_TS={timestamps_a[0]}")
          print(f"KRAKEN_POSTTRADE_FIRST_TRADE_ID={trade_ids_a[0]}")
          print(f"KRAKEN_POSTTRADE_PAGE_A_ROWS={len(timestamps_a)}")
          print(f"KRAKEN_POSTTRADE_PAGE_A_LAST_TRADE_TS={timestamps_a[-1]}")
          print(f"KRAKEN_POSTTRADE_PAGE_A_LAST_TS={last_ts_a}")
          print(f"KRAKEN_POSTTRADE_PAGE_A_SHA256={hashlib.sha256(raw_a).hexdigest()}")
          print(f"KRAKEN_POSTTRADE_PAGE_B_ROWS={len(timestamps_b)}")
          print(f"KRAKEN_POSTTRADE_PAGE_B_FIRST_TS={timestamps_b[0]}")
          print(f"KRAKEN_POSTTRADE_PAGE_B_LAST_TS={last_ts_b}")
          print(f"KRAKEN_POSTTRADE_PAGE_B_SHA256={hashlib.sha256(raw_b).hexdigest()}")
          print(f"KRAKEN_POSTTRADE_BOUNDARY_REPEATED_PROVIDER_IDS={repeated_provider_ids}")
          print("KRAKEN_POSTTRADE_PROVIDER_TRADE_ID=PASS")
          print("KRAKEN_POSTTRADE_PAGINATION=PASS")
          print("KRAKEN_POSTTRADE_MARKET_INCEPTION=PASS")
          print("KRAKEN_POSTTRADE_BOUNDED_PHYSICAL_PROBE=PASS")
          PY

      - name: Physically qualify archive to REST to WARM seam
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          from datetime import datetime, timezone
          from pathlib import Path

          from tools.deep_history import kraken_spot_ohlcvt_backfill as backfill

          def iso_ms(value: int) -> str:
              return datetime.fromtimestamp(value / 1000, timezone.utc).isoformat().replace("+00:00", "Z")

          def iso_ns(value: int) -> str:
              return datetime.fromtimestamp(value / 1_000_000_000, timezone.utc).isoformat().replace("+00:00", "Z")

          current_manifest = json.loads(Path("history/release-manifest.json").read_text(encoding="utf-8"))
          cutoff_ms = int(current_manifest["backfill_as_of_ms"])
          warm_first_ms = backfill._warm_first_timestamp()

          print(f"PHYSICAL_QUALIFICATION_HEAD={Path('.git/HEAD').read_text().strip()}")
          print(f"KRAKEN_HYBRID_SOURCE_MODE={backfill.SOURCE_MODE}")
          print(f"KRAKEN_HYBRID_CUTOFF_MS={cutoff_ms}")
          print(f"KRAKEN_HYBRID_CUTOFF_UTC={iso_ms(cutoff_ms)}")
          print(f"KRAKEN_HYBRID_WARM_FIRST_MS={warm_first_ms}")
          print(f"KRAKEN_HYBRID_WARM_FIRST_UTC={iso_ms(warm_first_ms)}")
          print(f"KRAKEN_HYBRID_REST_WARM_OVERLAP_MS={backfill.REST_WARM_OVERLAP_MS}")

          source = backfill.acquire_archive(
              cutoff_ms=cutoff_ms,
              warm_first_ms=warm_first_ms,
          )

          assets_a = backfill.build_assets(backfill.ARCHIVE, backfill.BUILD_A, cutoff_ms, source)
          assets_b = backfill.build_assets(backfill.ARCHIVE, backfill.BUILD_B, cutoff_ms, source)
          backfill.compare_builds(assets_a, assets_b)
          backfill.verify_warm_overlap(assets_a)

          archive_latest_ns = int(source["archive_latest_trade_ns"])
          rest_start_ns = int(source["rest_tail_requested_start_ns"])
          rest_end_ns = int(source["rest_tail_requested_end_ns"])
          final_cursor = int(source["rest_tail_final_cursor"])
          seam = source["source_seam_overlap"]

          if source["source_mode"] != "KRAKEN_OFFICIAL_TIME_SALES_ARCHIVE_PLUS_REST_TRADES_TAIL":
              raise RuntimeError(f"unexpected source mode: {source['source_mode']}")
          if rest_start_ns >= archive_latest_ns:
              raise RuntimeError("REST source overlap does not start before exact archive latest trade")
          if rest_end_ns < warm_first_ms * 1_000_000:
              raise RuntimeError("REST source does not reach canonical WARM boundary")
          if final_cursor <= rest_end_ns:
              raise RuntimeError("REST result.last did not physically advance beyond requested seam end")
          if not source["rest_tail_cursor_monotonic"] or not source["rest_tail_rows_monotonic"]:
              raise RuntimeError("REST pagination monotonicity proof missing")
          if seam.get("status") != "PASS" or int(seam.get("conflicts", -1)) != 0:
              raise RuntimeError(f"archive/REST seam overlap failed: {seam}")
          if int(seam["matches"].get("5m", 0)) < 3 or int(seam["matches"].get("1d", 0)) < 1:
              raise RuntimeError(f"archive/REST seam overlap insufficient: {seam}")
          if int(source["rest_tail_page_count"]) <= 0 or int(source["rest_tail_row_count"]) <= 0:
              raise RuntimeError("REST seam did not freeze physical pages/rows")

          print(f"KRAKEN_ARCHIVE_LATEST_TRADE_NS={archive_latest_ns}")
          print(f"KRAKEN_ARCHIVE_LATEST_TRADE_UTC={iso_ns(archive_latest_ns)}")
          print(f"KRAKEN_REST_TAIL_REQUESTED_START_NS={rest_start_ns}")
          print(f"KRAKEN_REST_TAIL_REQUESTED_START_UTC={iso_ns(rest_start_ns)}")
          print(f"KRAKEN_REST_TAIL_REQUESTED_END_NS={rest_end_ns}")
          print(f"KRAKEN_REST_TAIL_REQUESTED_END_UTC={iso_ns(rest_end_ns)}")
          print(f"KRAKEN_REST_TAIL_FINAL_CURSOR={final_cursor}")
          print(f"KRAKEN_REST_TAIL_PAGE_COUNT={source['rest_tail_page_count']}")
          print(f"KRAKEN_REST_TAIL_ROW_COUNT={source['rest_tail_row_count']}")
          print(f"KRAKEN_REST_TAIL_RAW_PAGES_SHA256={source['rest_tail_raw_pages_sha256']}")
          print(f"KRAKEN_REST_TAIL_ROWS_SHA256={source['rest_tail_rows_sha256']}")
          print(f"KRAKEN_HYBRID_SOURCE_SHA256={source['archive_sha256']}")
          print(f"KRAKEN_HYBRID_DERIVED_ARCHIVE_SHA256={source['derived_archive_sha256']}")
          print("KRAKEN_ARCHIVE_REST_SOURCE_SEAM=" + json.dumps(seam, sort_keys=True, separators=(",", ":")))
          print("KRAKEN_ARCHIVE_REST_SOURCE_SEAM=PASS")
          print("KRAKEN_REST_TO_WARM_COVERAGE=PASS")
          print("KRAKEN_HYBRID_BUILD_AB=PASS")
          print("KRAKEN_HYBRID_WARM_OVERLAP=PASS")
          print("KRAKEN_HYBRID_SOURCE_PHYSICAL_QUALIFICATION=PASS")
          print("RELEASE_PUBLICATION=NOT_RUN")
          print("CONTROL_PLANE_INSTALL=NOT_RUN")
          PY
