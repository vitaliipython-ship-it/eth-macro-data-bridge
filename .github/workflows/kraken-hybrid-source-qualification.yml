name: Kraken Spot v2 R16 repository-native qualification

on:
  push:
    branches:
      - agent/data-bridge/kraken-spot-deep-history-source-repair-r01
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  EXPECTED_PARENT_1: 86916b5c5d0d68d86f69e60c1e513d0d5eceb41f
  EXPECTED_PARENT_2: d0a2ebebc5cfcff9594828b03c9d6427b8b6b4d5
  RELEASE_ID: "383670615"
  RELEASE_TAG: history-kraken-spot-v2
  PYTHONPATH: src:tools/deep_history:tools

jobs:
  r16_repository_native_qualification:
    name: R16 exact-SHA offline integration qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact integration candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Prove exact two-parent candidate identity
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          actual_tree="$(git rev-parse 'HEAD^{tree}')"
          read -r -a parents <<< "$(git show -s --format=%P HEAD)"
          test "$actual_sha" = "$GITHUB_SHA"
          test "${#parents[@]}" -eq 2
          test "${parents[0]}" = "$EXPECTED_PARENT_1"
          test "${parents[1]}" = "$EXPECTED_PARENT_2"
          echo "EXACT_SHA_CHECKOUT=PASS"
          echo "CANDIDATE_TREE=$actual_tree"
          echo "CANDIDATE_PARENT_1=${parents[0]}"
          echo "CANDIDATE_PARENT_2=${parents[1]}"
          git fsck --full
          echo "GIT_FSCK=PASS"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Prove automatic provider-network boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          workflows = Path('.github/workflows')
          probe = (workflows / 'probe-kraken-overlap.yml').read_text(encoding='utf-8')
          free = (workflows / 'qualify-free-multi-instrument-substrate.yml').read_text(encoding='utf-8')
          current = (workflows / 'current-data-request.yml').read_text(encoding='utf-8')
          update = (workflows / 'update-market.yml').read_text(encoding='utf-8')
          assert '\n  push:\n' in probe and '\n  workflow_dispatch:\n' in probe
          assert "if: github.event_name == 'workflow_dispatch'" in probe
          assert probe.count('python tools/deep_history/qualify_kraken_overlap_policy.py') == 1
          assert '\n  push:\n' in free and '\n  pull_request:\n' in free and '\n  workflow_dispatch:\n' in free
          physical = free.index('- name: Bounded public-provider physical probe')
          guard = free.index("if: github.event_name == 'workflow_dispatch'", physical)
          command = free.index('python src/multi_instrument_public_csv.py', physical)
          assert physical < guard < command
          assert "if: github.event_name == 'issues'" in current
          assert 'python src/collector.py' in current
          on_update = update.split('permissions:', 1)[0]
          assert '\n  push:\n' not in on_update and '\n  pull_request:\n' not in on_update
          print('AUTOMATIC_PUSH_PROVIDER_MARKET_DATA_ROUTE_COUNT=0')
          print('AUTOMATIC_PR_PROVIDER_MARKET_DATA_ROUTE_COUNT=0')
          print('BLOCKER_A_TESTS=PASS')
          PY

      - name: Run Kraken R13 R15 and COLD-WARM targeted tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.deep_history.test_r16_kraken_cold_warm_reconciliation -v
          python -m unittest tests.deep_history.test_kraken_spot_r13 -v
          python -m unittest tests.deep_history.test_kraken_spot_ohlcvt_backfill -v
          python -m unittest tests.deep_history.test_kraken_spot_posttrade -v
          python -m unittest tests.deep_history.test_kraken_spot_rest_trades -v
          python -m unittest tests.deep_history.test_kraken_spot_time_sales -v
          python -m unittest tests.deep_history.test_release_publisher -v
          python -m unittest tests.deep_history.test_capability_index -v
          python -m unittest tests.deep_history.test_d62_history_access -v
          python -m unittest tests.deep_history.test_history_consumer -v
          python -m unittest tests.deep_history.test_probe_kraken_overlap_workflow_policy -v
          echo "TARGETED_TESTS=PASS"
          echo "BLOCKER_B_TESTS=PASS"
          echo "NEXT_REFRESH_SIMULATION=PASS"

      - name: Prove capability index deterministic regeneration
        shell: bash
        run: |
          set -euo pipefail
          cp history/capability-index.json "$RUNNER_TEMP/capability-expected.json"
          python tools/capability_index.py validate
          python tools/capability_index.py build
          cp history/capability-index.json "$RUNNER_TEMP/capability-build-a.json"
          cmp "$RUNNER_TEMP/capability-expected.json" "$RUNNER_TEMP/capability-build-a.json"
          python tools/capability_index.py build
          cp history/capability-index.json "$RUNNER_TEMP/capability-build-b.json"
          cmp "$RUNNER_TEMP/capability-build-a.json" "$RUNNER_TEMP/capability-build-b.json"
          git checkout -- history/capability-index.json
          python tools/capability_index.py validate
          echo "CAPABILITY_INDEX_BUILD_A=PASS"
          echo "CAPABILITY_INDEX_BUILD_B=PASS"
          echo "CAPABILITY_INDEX_BUILD_A_B_EQUAL=PASS"

      - name: Read back immutable Release and R13 native authority
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" > "$RUNNER_TEMP/release.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          release = json.loads(Path(os.environ['RUNNER_TEMP'], 'release.json').read_text(encoding='utf-8'))
          assert release['id'] == 383670615
          assert release['tag_name'] == 'history-kraken-spot-v2'
          assert release['immutable'] is True
          assert len(release['assets']) == 24
          manifest = json.loads(Path('history/release-manifest.json').read_text(encoding='utf-8'))
          targets = {('kraken', 'ETHUSD', '5m'), ('kraken', 'ETHUSD', '1d')}
          assets = [item for item in manifest['asset_inventory'] if (item.get('provider'), item.get('instrument'), item.get('interval_or_metric')) in targets and item.get('release_tag') == 'history-kraken-spot-v2']
          assert len(assets) == 24
          assert all(item.get('immutable') is True and item.get('integrity_status') == 'PASS' for item in assets)
          warm = json.loads(Path('history/kraken/ETHUSD/1d/2026.json').read_text(encoding='utf-8'))
          rows = {int(row[0]): row for row in warm['provider_native_records']}
          row = rows[1782172800000]
          assert row[1:8] == ['1726.12', '1734.46', '1633.10', '1665.12', '1671.12', '26130.92616972', 16902]
          print('RELEASE_MANIFEST_SEMANTIC_UNION=PASS')
          print('R13_OBSERVATION_NATIVE_READBACK=PASS')
          PY

      - name: Canonical reader acceptance and deterministic Build A B
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          from tools.history_consumer import read_history
          sid5 = 'spot.kraken-spot.ETHUSD.ohlcv.5m'
          sid1 = 'spot.kraken-spot.ETHUSD.ohlcv.1d'
          def read(cache_name, sid, start, end):
              cache = Path(os.environ['RUNNER_TEMP']) / cache_name
              plan, payload, diagnostics, receipt = read_history(sid, start, end, mode='strict', output_format='json', cache_dir=cache)
              rows = json.loads(payload)
              assert plan['plan_kind'] == 'MARKET_DATA_RESOLUTION_PLAN'
              assert receipt['route']['reader_input_authority'] == 'ResolutionPlan'
              assert diagnostics['status'] == 'PASS' and diagnostics['gap_count'] == 0 and diagnostics['duplicates'] == 0
              return plan, rows, payload
          requests = [
              ('inception5', sid5, '2015-08-07T14:00:00Z', '2015-08-07T14:05:00Z'),
              ('inception1', sid1, '2015-08-07T00:00:00Z', '2015-08-08T00:00:00Z'),
              ('forensic2015', sid1, '2015-10-15T00:00:00Z', '2015-10-16T00:00:00Z'),
              ('high2016', sid1, '2016-06-16T00:00:00Z', '2016-06-17T00:00:00Z'),
              ('low2016', sid1, '2016-12-01T00:00:00Z', '2016-12-02T00:00:00Z'),
              ('ordering2017', sid1, '2017-06-01T00:00:00Z', '2017-08-01T00:00:00Z'),
              ('recovery2021', sid1, '2021-01-01T00:00:00Z', '2021-01-02T00:00:00Z'),
              ('r13', sid1, '2026-06-23T00:00:00Z', '2026-06-24T00:00:00Z'),
              ('seam5', sid5, '2026-08-15T10:30:00Z', '2026-08-15T11:30:00Z'),
              ('seam1', sid1, '2026-08-14T00:00:00Z', '2026-08-17T00:00:00Z'),
          ]
          build_a, build_b, rows_by_name = {}, {}, {}
          for name, sid, start, end in requests:
              _, rows_a, payload_a = read('r16-cache-a', sid, start, end)
              _, rows_b, payload_b = read('r16-cache-b', sid, start, end)
              assert payload_a == payload_b
              build_a[name] = hashlib.sha256(payload_a).hexdigest()
              build_b[name] = hashlib.sha256(payload_b).hexdigest()
              rows_by_name[name] = rows_a
          assert build_a == build_b
          assert rows_by_name['inception5'] == [{'open_time': '2015-08-07T14:00:00Z', 'open': '3.00000', 'high': '3.00000', 'low': '3.00000', 'close': '3.00000', 'volume': '81.85727776'}]
          assert rows_by_name['inception1'] == [{'open_time': '2015-08-07T00:00:00Z', 'open': '3.00000', 'high': '3.00001', 'low': '3.00000', 'close': '3.00000', 'volume': '123.93056831'}]
          for name in ('forensic2015', 'high2016', 'low2016', 'recovery2021', 'r13'):
              assert len(rows_by_name[name]) == 1
          assert len(rows_by_name['seam5']) == 12
          assert len(rows_by_name['seam1']) == 3
          ordering = rows_by_name['ordering2017']
          high_row = max(ordering, key=lambda row: float(row['high']))
          low_row = min(ordering, key=lambda row: float(row['low']))
          assert high_row['open_time'] < low_row['open_time']
          print('BUILD_A=PASS')
          print('BUILD_B=PASS')
          print('BUILD_A_B_EQUAL=PASS')
          print('PROVIDER_NETWORK_CALLS_BUILD_A=0')
          print('PROVIDER_NETWORK_CALLS_BUILD_B=0')
          print('CANONICAL_HISTORY_READ_5M=PASS')
          print('CANONICAL_HISTORY_READ_1D=PASS')
          print('MARKET_INCEPTION_READBACK=PASS')
          print('FORENSIC_2015_2017=PASS')
          print('RECOVERY_2021_READBACK=PASS')
          print('R13_OBSERVATION_READBACK=PASS')
          print('COLD_WARM_SEAM_READBACK=PASS')
          print('CANONICAL_READ_A_B_EQUAL=PASS')
          PY

      - name: Prove no provider acquisition commands ran in R16 carrier
        shell: bash
        run: |
          set -euo pipefail
          echo "PROVIDER_MARKET_DATA_NETWORK_CALLS=0"
          echo "GLOBAL_R16_PUSH_INDUCED_PROVIDER_MARKET_DATA_NETWORK_CALLS=0"
          echo "R16_EXACT_SHA_QUALIFICATION=PASS"
