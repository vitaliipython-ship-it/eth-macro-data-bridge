name: Qualify D9 WARM Release policy

on:
  workflow_dispatch:
  push:
    branches:
      - agent/d9-3-warm-cold-candidate
    paths:
      - "tools/deep_history/qualify_warm_release_policy.py"
      - ".github/workflows/qualify-d9-warm-release-policy.yml"

permissions:
  contents: write

concurrency:
  group: eth-macro-d9-warm-release-policy
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ github.token }}
      PYTHONPATH: src:tools/deep_history
    steps:
      - name: Checkout exact candidate ref
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Probe public prerelease policy and remote read-back
        run: python tools/deep_history/qualify_warm_release_policy.py
      - name: Assert source tree was not mutated
        run: |
          test -z "$(git status --porcelain)"
          echo "WORKFLOW_CHECKOUT=PASS"
          echo "SOURCE_TREE_MUTATION=0"
          echo "ACTIVE_MARKET_AUTHORITY_CHANGED=false"
