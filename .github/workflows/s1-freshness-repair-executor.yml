name: S1 freshness temporal-authority repair executor

on:
  push:
    branches:
      - agent/liquidity-s1/runtime-foundation-v1

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message == 'Execute bounded S1 freshness temporal repair final cleanup'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: src:tools/deep_history:tools
      BRANCH: agent/liquidity-s1/runtime-foundation-v1
      QUALIFIED_PREDECESSOR: 801c0b57f33b792cfd068f6f42e0c09f15774040
    steps:
      - name: Checkout exact executor SHA
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Verify bounded branch and predecessor authority
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-parse origin/$BRANCH)" = "${GITHUB_SHA}"
          test "$(git rev-parse HEAD^)" = "$QUALIFIED_PREDECESSOR"
      - name: Re-execute exact qualified predecessor repair scripts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess

          predecessor = "801c0b57f33b792cfd068f6f42e0c09f15774040"
          workflow_path = ".github/workflows/s1-freshness-repair-executor.yml"
          text = subprocess.check_output(
              ["git", "show", f"{predecessor}:{workflow_path}"],
              text=True,
          )
          lines = text.splitlines()

          def extract(name: str) -> str:
              marker = f"      - name: {name}"
              try:
                  start = lines.index(marker)
              except ValueError as exc:
                  raise SystemExit(f"PREDECESSOR_STEP_NOT_FOUND:{name}") from exc
              run_index = None
              for idx in range(start + 1, len(lines)):
                  if lines[idx].startswith("      - name:"):
                      break
                  if lines[idx] == "        run: |":
                      run_index = idx
                      break
              if run_index is None:
                  raise SystemExit(f"PREDECESSOR_RUN_BLOCK_NOT_FOUND:{name}")
              body = []
              for idx in range(run_index + 1, len(lines)):
                  line = lines[idx]
                  if line.startswith("      - name:"):
                      break
                  if line.startswith("          "):
                      body.append(line[10:])
                  elif line == "":
                      body.append("")
                  else:
                      raise SystemExit(f"PREDECESSOR_RUN_INDENT_INVALID:{name}:{idx + 1}")
              return "\n".join(body) + "\n"

          names = [
              "Normalize prepared carrier validator anchor",
              "Apply prepared bounded freshness repair",
              "Harden millisecond temporal coherence and adversarial proof",
              "Targeted S1 qualification before publication",
          ]
          for ordinal, name in enumerate(names, start=1):
              script = Path(f"/tmp/s1_repair_step_{ordinal}.sh")
              script.write_text(extract(name), encoding="utf-8")
              subprocess.run(["bash", str(script)], check=True)
          PY
      - name: Remove both temporary paths and publish bounded successor
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH"
          test "$(git rev-parse origin/$BRANCH)" = "${GITHUB_SHA}"
          git rm -f .github/workflows/s1-freshness-repair-executor.yml tools/_s1_freshness_repair_executor.py
          git add src/liquidity_s1_runtime.py tests/test_liquidity_s1_runtime.py tools/validation/validate_liquidity_s1_runtime.py
          test "$(git diff --cached --name-only | wc -l)" -eq 5
          git diff --cached --name-only | sort
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Repair S1 freshness temporal authority'
          git push origin "HEAD:$BRANCH"
