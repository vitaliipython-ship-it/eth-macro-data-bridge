name: Apply Data Bridge portability premerge hardening

on:
  pull_request:
    paths:
      - ".github/workflows/premerge-storage-portability-correction.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src:tools/deep_history
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - name: Materialize bounded source correction
        shell: bash
        run: |
          set -euo pipefail
          cat > src/canonical_json.py <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          from typing import Any


          def canonical_json(value: Any) -> str:
              """Repository canonical JSON text: sorted keys, compact separators, UTF-8 Unicode, no newline."""
              return json.dumps(value, sort_keys=True, separators=(",", ":"), ensure_ascii=False)


          def canonical_json_bytes(value: Any) -> bytes:
              return canonical_json(value).encode("utf-8")


          def sha256_canonical_json(value: Any) -> str:
              return hashlib.sha256(canonical_json_bytes(value)).hexdigest()
          PY

          cat > src/d8_capability_routing.py <<'PY'
          from __future__ import annotations

          import json
          import re
          from functools import lru_cache
          from pathlib import Path
          from typing import Any

          CONTRACT_PATH = Path(__file__).resolve().parents[1] / "contracts" / "d8-runtime-candidate.json"


          class CapabilityRoutingError(RuntimeError):
              """Fail-closed capability declaration/routing violation."""


          def declarations_from_contract(contract: dict[str, Any]) -> dict[str, dict[str, Any]]:
              try:
                  capabilities = contract["due_policy"]["capabilities"]
              except (KeyError, TypeError) as exc:
                  raise CapabilityRoutingError("D8 capability declaration authority missing") from exc
              if not isinstance(capabilities, list) or not capabilities:
                  raise CapabilityRoutingError("D8 capability declaration set must be non-empty")
              out: dict[str, dict[str, Any]] = {}
              for capability in capabilities:
                  if not isinstance(capability, dict):
                      raise CapabilityRoutingError("capability declaration must be an object")
                  capability_id = capability.get("id")
                  provider = capability.get("provider")
                  cadence = capability.get("cadence_minutes")
                  forwarding = capability.get("forwarding")
                  if not isinstance(capability_id, str) or not capability_id or capability_id in out:
                      raise CapabilityRoutingError("capability id missing or duplicated")
                  if not isinstance(provider, str) or not provider:
                      raise CapabilityRoutingError(f"capability provider missing: {capability_id}")
                  if not isinstance(cadence, int) or cadence <= 0:
                      raise CapabilityRoutingError(f"capability cadence invalid: {capability_id}")
                  if not isinstance(forwarding, dict):
                      raise CapabilityRoutingError(f"forwarding declaration missing: {capability_id}")
                  if forwarding.get("target_residence_role") != "WARM":
                      raise CapabilityRoutingError(f"unsupported target residence role: {capability_id}")
                  rules = forwarding.get("series_rules")
                  if not isinstance(rules, list) or not rules:
                      raise CapabilityRoutingError(f"series routing rules missing: {capability_id}")
                  for rule in rules:
                      if not isinstance(rule, dict):
                          raise CapabilityRoutingError(f"series rule must be object: {capability_id}")
                      for field in (
                          "series_id_regex",
                          "lifecycle_class",
                          "normalization_family",
                          "finality_policy",
                          "publication_eligibility",
                      ):
                          if not isinstance(rule.get(field), str) or not rule[field]:
                              raise CapabilityRoutingError(f"series rule field missing: {capability_id}:{field}")
                      allowed = rule.get("allowed_finality")
                      if not isinstance(allowed, list) or not allowed or not all(isinstance(x, str) for x in allowed):
                          raise CapabilityRoutingError(f"allowed_finality missing: {capability_id}")
                      try:
                          re.compile(rule["series_id_regex"])
                      except re.error as exc:
                          raise CapabilityRoutingError(f"invalid series regex: {capability_id}") from exc
                  out[capability_id] = capability
              return out


          @lru_cache(maxsize=1)
          def load_default_declarations() -> dict[str, dict[str, Any]]:
              if not CONTRACT_PATH.is_file():
                  raise CapabilityRoutingError(f"D8 capability declaration contract missing: {CONTRACT_PATH}")
              try:
                  contract = json.loads(CONTRACT_PATH.read_text(encoding="utf-8"))
              except (OSError, json.JSONDecodeError) as exc:
                  raise CapabilityRoutingError("D8 capability declaration contract unreadable") from exc
              return declarations_from_contract(contract)


          def capability_provider(capability_id: str, declarations: dict[str, dict[str, Any]] | None = None) -> str:
              declarations = declarations or load_default_declarations()
              try:
                  return str(declarations[capability_id]["provider"])
              except KeyError as exc:
                  raise CapabilityRoutingError(f"unsupported D8 capability: {capability_id}") from exc


          def runtime_due_policy(declarations: dict[str, dict[str, Any]] | None = None) -> tuple[dict[str, Any], ...]:
              declarations = declarations or load_default_declarations()
              rows: list[dict[str, Any]] = []
              for capability in declarations.values():
                  row = {
                      "id": capability["id"],
                      "provider": capability["provider"],
                      "every_minutes": capability["cadence_minutes"],
                      "required": bool(capability.get("required", False)),
                  }
                  if "profiles" in capability:
                      row["profiles"] = list(capability["profiles"])
                  if capability.get("disabled") is True:
                      row["disabled"] = True
                  rows.append(row)
              return tuple(rows)


          def route_capability_series(
              capability_id: str,
              provider: str,
              series_id: str,
              *,
              declarations: dict[str, dict[str, Any]] | None = None,
          ) -> dict[str, Any]:
              declarations = declarations or load_default_declarations()
              try:
                  capability = declarations[capability_id]
              except KeyError as exc:
                  raise CapabilityRoutingError(f"unsupported D8 capability: {capability_id}") from exc
              if provider != capability["provider"]:
                  raise CapabilityRoutingError("capability/provider identity mismatch")
              if not isinstance(series_id, str) or not series_id:
                  raise CapabilityRoutingError("series_id missing")
              matches = [
                  rule
                  for rule in capability["forwarding"]["series_rules"]
                  if re.fullmatch(rule["series_id_regex"], series_id)
              ]
              if len(matches) != 1:
                  raise CapabilityRoutingError(
                      f"capability/series mapping must match exactly one declaration: {capability_id}:{series_id}"
                  )
              rule = matches[0]
              return {
                  "capability_id": capability_id,
                  "provider": provider,
                  "series_id": series_id,
                  "lifecycle_class": rule["lifecycle_class"],
                  "normalization_family": rule["normalization_family"],
                  "finality_policy": rule["finality_policy"],
                  "allowed_finality": tuple(rule["allowed_finality"]),
                  "publication_eligibility": rule["publication_eligibility"],
                  "target_residence_role": capability["forwarding"]["target_residence_role"],
              }
          PY

          cat > src/history_publication_batch.py <<'PY'
          from __future__ import annotations

          import hashlib
          from copy import deepcopy
          from typing import Any, Iterable

          from canonical_json import canonical_json_bytes

          SCHEMA_VERSION = "market-data-history-publication-batch/1.0.0"
          TARGET_RESIDENCE_ROLE = "WARM"


          class PublicationBatchError(RuntimeError):
              """Fail-closed logical PublicationBatch identity/consistency violation."""


          def _sha256(value: bytes) -> str:
              return hashlib.sha256(value).hexdigest()


          def _effective_timestamp(envelope: dict[str, Any]) -> str:
              value = envelope.get("provider_timestamp_at") or envelope.get("known_at")
              if not isinstance(value, str) or not value:
                  raise PublicationBatchError("member lacks canonical effective timestamp")
              return value


          def canonical_member_sort_key(envelope: dict[str, Any]) -> tuple[str, str, str]:
              series_id = envelope.get("series_id")
              observation_id = envelope.get("observation_id")
              if not isinstance(series_id, str) or not series_id:
                  raise PublicationBatchError("member series_id missing")
              if not isinstance(observation_id, str) or not observation_id:
                  raise PublicationBatchError("member observation_id missing")
              return (series_id, _effective_timestamp(envelope), observation_id)


          def membership_preimage(member_observation_ids: list[str]) -> list[str]:
              return list(member_observation_ids)


          def payload_binding_preimage(members: list[dict[str, Any]]) -> list[dict[str, Any]]:
              return [
                  {
                      "position": member["position"],
                      "observation_id": member["observation_id"],
                      "series_id": member["series_id"],
                      "provider_timestamp_at": member.get("provider_timestamp_at"),
                      "known_at": member["known_at"],
                      "payload_fingerprint": member["payload_fingerprint"],
                      "payload_sha256": member["payload_sha256"],
                  }
                  for member in members
              ]


          def batch_id_preimage(batch: dict[str, Any]) -> dict[str, Any]:
              return {
                  "schema_version": batch["schema_version"],
                  "target_residence_role": batch["target_residence_role"],
                  "membership_sha256": batch["membership_sha256"],
                  "payload_sha256": batch["payload_sha256"],
                  "member_observation_ids": list(batch["member_observation_ids"]),
              }


          def _member(envelope: dict[str, Any], position: int) -> dict[str, Any]:
              required = ("observation_id", "series_id", "provider", "fingerprint", "known_at", "finality")
              missing = [name for name in required if name not in envelope]
              if missing:
                  raise PublicationBatchError(f"D8 envelope missing PublicationBatch fields: {missing}")
              return {
                  "position": position,
                  "observation_id": envelope["observation_id"],
                  "series_id": envelope["series_id"],
                  "provider": envelope["provider"],
                  "provider_timestamp_at": envelope.get("provider_timestamp_at"),
                  "payload_fingerprint": envelope["fingerprint"],
                  "payload_sha256": _sha256(canonical_json_bytes(envelope)),
                  "known_at": envelope["known_at"],
                  "finality": envelope["finality"],
              }


          def build_publication_batch(envelopes: Iterable[dict[str, Any]]) -> dict[str, Any]:
              rows = [deepcopy(row) for row in envelopes]
              if not rows:
                  raise PublicationBatchError("PublicationBatch requires at least one observation")
              rows.sort(key=canonical_member_sort_key)
              members = [_member(row, index) for index, row in enumerate(rows)]
              ids = [member["observation_id"] for member in members]
              if len(ids) != len(set(ids)):
                  raise PublicationBatchError("duplicate observation_id in logical PublicationBatch")
              batch: dict[str, Any] = {
                  "schema_version": SCHEMA_VERSION,
                  "target_residence_role": TARGET_RESIDENCE_ROLE,
                  "member_count": len(members),
                  "member_observation_ids": ids,
                  "members": members,
                  "membership_sha256": _sha256(canonical_json_bytes(membership_preimage(ids))),
                  "payload_sha256": _sha256(canonical_json_bytes(payload_binding_preimage(members))),
              }
              batch["batch_id"] = "pub-" + _sha256(canonical_json_bytes(batch_id_preimage(batch)))
              validate_publication_batch(batch)
              return batch


          def validate_publication_batch(batch: dict[str, Any]) -> None:
              if not isinstance(batch, dict):
                  raise PublicationBatchError("PublicationBatch must be an object")
              if batch.get("schema_version") != SCHEMA_VERSION:
                  raise PublicationBatchError("PublicationBatch schema_version mismatch")
              if batch.get("target_residence_role") != TARGET_RESIDENCE_ROLE:
                  raise PublicationBatchError("PublicationBatch target residence role mismatch")
              forbidden = {"publication_attempt_id", "backend_profile", "retry_at", "server_hostname", "filesystem_path", "git_commit"}
              if forbidden & set(batch):
                  raise PublicationBatchError("logical PublicationBatch contains transient/backend attempt state")
              ids = batch.get("member_observation_ids")
              members = batch.get("members")
              if not isinstance(ids, list) or not isinstance(members, list) or not ids or not members:
                  raise PublicationBatchError("PublicationBatch membership missing")
              if len(ids) != len(members):
                  raise PublicationBatchError("member_observation_ids/members length mismatch")
              if batch.get("member_count") != len(members):
                  raise PublicationBatchError("member_count mismatch")
              if len(ids) != len(set(ids)):
                  raise PublicationBatchError("duplicate observation_id in PublicationBatch")
              for index, member in enumerate(members):
                  if not isinstance(member, dict):
                      raise PublicationBatchError("PublicationBatch member must be object")
                  if member.get("position") != index:
                      raise PublicationBatchError("PublicationBatch member position mismatch")
                  if member.get("observation_id") != ids[index]:
                      raise PublicationBatchError("duplicated membership list mismatch")
                  canonical_member_sort_key(member)
              if members != sorted(members, key=canonical_member_sort_key):
                  raise PublicationBatchError("PublicationBatch members are not in canonical order")
              expected_membership = _sha256(canonical_json_bytes(membership_preimage(ids)))
              if batch.get("membership_sha256") != expected_membership:
                  raise PublicationBatchError("membership_sha256 mismatch")
              expected_payload = _sha256(canonical_json_bytes(payload_binding_preimage(members)))
              if batch.get("payload_sha256") != expected_payload:
                  raise PublicationBatchError("payload_sha256 mismatch")
              expected_batch_id = "pub-" + _sha256(canonical_json_bytes(batch_id_preimage(batch)))
              if batch.get("batch_id") != expected_batch_id:
                  raise PublicationBatchError("batch_id mismatch")
          PY

          cat > tests/deep_history/test_history_publication_batch.py <<'PY'
          from __future__ import annotations

          import copy
          import hashlib
          import json
          import unittest

          from canonical_json import canonical_json_bytes
          from history_publication_batch import (
              PublicationBatchError,
              batch_id_preimage,
              build_publication_batch,
              membership_preimage,
              payload_binding_preimage,
              validate_publication_batch,
          )


          def envelope(series: str, ts: str, suffix: str) -> dict:
              value = {"price": suffix, "nested": {"unicode": "Δ"}}
              fingerprint = hashlib.sha256(
                  json.dumps(value, sort_keys=True, separators=(",", ":"), ensure_ascii=False).encode("utf-8")
              ).hexdigest()
              return {
                  "schema_version": "market-data-d8-runtime-observation/1.0.0",
                  "observation_id": "obs-" + hashlib.sha256(f"{series}|{ts}|{suffix}".encode()).hexdigest(),
                  "fingerprint": fingerprint,
                  "provider": "binance-spot",
                  "capability_id": "binance-spot.m5",
                  "series_id": series,
                  "provider_timestamp_at": ts,
                  "known_at": ts,
                  "retrieved_at": ts,
                  "collected_at": ts,
                  "canonical_cycle_id": "d8c-test",
                  "canonical_slot": ts,
                  "finality": "FINALIZED",
                  "validation_status": "PASS",
                  "provenance": {"runtime_contract": "eth-macro-d8-runtime/1.0.0", "source_revision": "test"},
                  "d9_forward_seam": {"target": "FIXED_GRID"},
                  "value": value,
              }


          class PublicationBatchDeterminismTests(unittest.TestCase):
              def setUp(self):
                  self.a = envelope("spot.binance-spot.SOLUSDT.ohlcv.5m", "2026-08-19T12:00:00.000Z", "a")
                  self.b = envelope("spot.binance-spot.BTCUSDT.ohlcv.5m", "2026-08-19T12:05:00.000Z", "b")

              def test_same_input_different_process_order_same_batch(self):
                  first = build_publication_batch([self.a, self.b])
                  second = build_publication_batch([copy.deepcopy(self.b), copy.deepcopy(self.a)])
                  self.assertEqual(first, second)
                  self.assertEqual(
                      canonical_json_bytes({"z": "Δ", "a": None, "n": 7}),
                      b'{"a":null,"n":7,"z":"\xce\x94"}',
                  )
                  reference_membership = hashlib.sha256(
                      json.dumps(membership_preimage(first["member_observation_ids"]), sort_keys=True, separators=(",", ":"), ensure_ascii=False).encode("utf-8")
                  ).hexdigest()
                  reference_payload = hashlib.sha256(
                      json.dumps(payload_binding_preimage(first["members"]), sort_keys=True, separators=(",", ":"), ensure_ascii=False).encode("utf-8")
                  ).hexdigest()
                  reference_batch = "pub-" + hashlib.sha256(
                      json.dumps(batch_id_preimage(first), sort_keys=True, separators=(",", ":"), ensure_ascii=False).encode("utf-8")
                  ).hexdigest()
                  self.assertEqual(first["membership_sha256"], reference_membership)
                  self.assertEqual(first["payload_sha256"], reference_payload)
                  self.assertEqual(first["batch_id"], reference_batch)
                  self.assertNotIn("backend_profile", first)
                  self.assertNotIn("publication_attempt_id", first)

              def test_negative_cross_field_consistency_matrix(self):
                  valid = build_publication_batch([self.a, self.b])
                  cases = {}
                  mutated = copy.deepcopy(valid); mutated["members"] = list(reversed(mutated["members"])); cases["reordered"] = mutated
                  mutated = copy.deepcopy(valid); mutated["members"][1]["observation_id"] = mutated["members"][0]["observation_id"]; mutated["member_observation_ids"][1] = mutated["member_observation_ids"][0]; cases["duplicate"] = mutated
                  mutated = copy.deepcopy(valid); mutated["member_observation_ids"][0] = "obs-" + "f" * 64; cases["membership-list"] = mutated
                  mutated = copy.deepcopy(valid); mutated["members"].pop(); cases["missing-member"] = mutated
                  mutated = copy.deepcopy(valid); mutated["members"][0]["position"] = 7; cases["position"] = mutated
                  mutated = copy.deepcopy(valid); mutated["membership_sha256"] = "0" * 64; cases["membership-hash"] = mutated
                  mutated = copy.deepcopy(valid); mutated["payload_sha256"] = "0" * 64; cases["payload-hash"] = mutated
                  mutated = copy.deepcopy(valid); mutated["batch_id"] = "pub-" + "0" * 64; cases["batch-id"] = mutated
                  mutated = copy.deepcopy(valid); mutated["backend_profile"] = "GITHUB_FIRST_V1"; cases["backend-leak"] = mutated
                  for name, candidate in cases.items():
                      with self.subTest(name=name):
                          with self.assertRaises(PublicationBatchError):
                              validate_publication_batch(candidate)
          PY

          cat > tests/d8/test_capability_routing_extensibility.py <<'PY'
          from __future__ import annotations

          import copy
          import hashlib
          import json
          import unittest
          from pathlib import Path

          from d8_capability_routing import declarations_from_contract, route_capability_series, runtime_due_policy
          from history_publication_batch import build_publication_batch

          ROOT = Path(__file__).resolve().parents[2]


          def load_contract() -> dict:
              return json.loads((ROOT / "contracts/d8-runtime-candidate.json").read_text(encoding="utf-8"))


          class HorizontalCapabilityExtensibilityTests(unittest.TestCase):
              def test_new_instrument_reuses_existing_family_declaration(self):
                  route = route_capability_series(
                      "binance-spot.m5",
                      "binance-spot",
                      "spot.binance-spot.SOLUSDT.ohlcv.5m",
                  )
                  self.assertEqual(route["lifecycle_class"], "FIXED_GRID")
                  self.assertEqual(route["normalization_family"], "OHLCV")
                  self.assertEqual(route["target_residence_role"], "WARM")

              def test_new_metric_requires_declaration_not_forwarder_code(self):
                  contract = load_contract()
                  caps = contract["due_policy"]["capabilities"]
                  target = next(row for row in caps if row["id"] == "binance-spot.m5")
                  target["forwarding"]["series_rules"].append(
                      {
                          "series_id_regex": r"^spot\.binance-spot\.[A-Z0-9_-]+\.mark-price\.5m$",
                          "lifecycle_class": "FIXED_GRID",
                          "normalization_family": "SCALAR_TIME_SERIES",
                          "finality_policy": "FINALIZED_ONLY",
                          "allowed_finality": ["FINALIZED"],
                          "publication_eligibility": "VALIDATED_TERMINAL_CHECKPOINT_V2",
                      }
                  )
                  declarations = declarations_from_contract(contract)
                  route = route_capability_series(
                      "binance-spot.m5",
                      "binance-spot",
                      "spot.binance-spot.SOLUSDT.mark-price.5m",
                      declarations=declarations,
                  )
                  self.assertEqual(route["normalization_family"], "SCALAR_TIME_SERIES")
                  self.assertEqual(route["lifecycle_class"], "FIXED_GRID")

              def test_due_policy_is_derived_from_same_contract(self):
                  contract = load_contract()
                  declarations = declarations_from_contract(contract)
                  derived = {row["id"]: row for row in runtime_due_policy(declarations)}
                  for capability in contract["due_policy"]["capabilities"]:
                      self.assertEqual(derived[capability["id"]]["provider"], capability["provider"])
                      self.assertEqual(derived[capability["id"]]["every_minutes"], capability["cadence_minutes"])

              def test_horizontal_expansion_is_independent_of_backend_profile(self):
                  value = {"close": "200.0"}
                  fingerprint = hashlib.sha256(json.dumps(value, sort_keys=True, separators=(",", ":")).encode()).hexdigest()
                  env = {
                      "observation_id": "obs-" + "1" * 64,
                      "series_id": "spot.binance-spot.SOLUSDT.ohlcv.5m",
                      "provider": "binance-spot",
                      "provider_timestamp_at": "2026-08-19T12:00:00.000Z",
                      "known_at": "2026-08-19T12:00:01.000Z",
                      "fingerprint": fingerprint,
                      "finality": "FINALIZED",
                      "value": value,
                  }
                  batch = build_publication_batch([env])
                  self.assertNotIn("backend_profile", batch)
                  self.assertNotIn("publication_attempt_id", batch)
                  self.assertEqual(batch["target_residence_role"], "WARM")
          PY

