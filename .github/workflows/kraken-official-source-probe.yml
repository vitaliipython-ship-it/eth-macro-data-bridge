name: Kraken official source qualification probe

on:
  push:
    branches:
      - agent/data-bridge/kraken-spot-deep-history-source-repair-r01

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Probe official Kraken Time and Sales ETHUSD archive member
        shell: bash
        run: |
          python - <<'PY'
          import http.cookiejar
          import json
          import struct
          import urllib.parse
          import urllib.request
          import zlib
          from datetime import datetime, timezone
          from html.parser import HTMLParser

          UA = {"User-Agent": "Mozilla/5.0 eth-macro-data-bridge-source-probe/1.0"}
          FILE_ID = "10zh3tDpqANYvVtYVgczwVz3UZFRUb1el"
          LANDING = f"https://drive.google.com/uc?export=download&id={FILE_ID}"

          class FormParser(HTMLParser):
              def __init__(self):
                  super().__init__(); self.forms=[]; self.current=None
              def handle_starttag(self, tag, attrs):
                  values=dict(attrs)
                  if tag == "form":
                      self.current={"action":values.get("action"), "method":values.get("method","get").lower(), "inputs":{}}
                      self.forms.append(self.current)
                  elif tag == "input" and self.current is not None and values.get("name"):
                      self.current["inputs"][values["name"]]=values.get("value","")
              def handle_endtag(self, tag):
                  if tag == "form": self.current=None

          def range_get(opener, url, start, end):
              req=urllib.request.Request(url, headers={**UA, "Range":f"bytes={start}-{end}"})
              with opener.open(req, timeout=120) as response:
                  raw=response.read(end-start+2)
                  assert response.status == 206, (response.status, response.headers.get("Content-Range"))
                  assert len(raw) == end-start+1, (len(raw), end-start+1)
                  return raw

          def zip64_values(extra, need_uncomp, need_comp, need_offset):
              pos=0; values={}
              while pos+4 <= len(extra):
                  field_id, size = struct.unpack_from("<HH", extra, pos); pos += 4
                  data=extra[pos:pos+size]; pos += size
                  if field_id != 0x0001: continue
                  q=0
                  if need_uncomp: values["uncomp"],=struct.unpack_from("<Q",data,q); q+=8
                  if need_comp: values["comp"],=struct.unpack_from("<Q",data,q); q+=8
                  if need_offset: values["offset"],=struct.unpack_from("<Q",data,q); q+=8
                  return values
              return values

          jar=http.cookiejar.CookieJar()
          opener=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))
          req=urllib.request.Request(LANDING, headers=UA)
          with opener.open(req, timeout=120) as response:
              landing_raw=response.read(256*1024)
              landing_type=response.headers.get("Content-Type") or ""
          download_url=LANDING
          if "text/html" in landing_type:
              parser=FormParser(); parser.feed(landing_raw.decode("utf-8",errors="replace"))
              form=next((f for f in parser.forms if f.get("action") and "download" in f["action"] and f.get("method")=="get"),None)
              assert form is not None
              download_url=form["action"]+"?"+urllib.parse.urlencode(form["inputs"])
          req=urllib.request.Request(download_url, headers=UA)
          with opener.open(req, timeout=120) as response:
              ctype=response.headers.get("Content-Type") or ""
              clen=response.headers.get("Content-Length")
              disposition=response.headers.get("Content-Disposition") or ""
              head=response.read(4)
          assert "text/html" not in ctype
          assert head == b"PK\x03\x04"
          assert clen and clen.isdigit()
          archive_size=int(clen)
          tail_size=min(32*1024*1024, archive_size)
          tail_start=archive_size-tail_size
          tail=range_get(opener, download_url, tail_start, archive_size-1)

          entries=[]; pos=0
          while True:
              idx=tail.find(b"PK\x01\x02",pos)
              if idx < 0: break
              if idx+46 > len(tail): break
              fields=struct.unpack_from("<4s6H3I5H2I",tail,idx)
              method=fields[4]; comp=fields[8]; uncomp=fields[9]
              name_len, extra_len, comment_len=fields[10],fields[11],fields[12]
              offset=fields[16]
              stop=idx+46+name_len+extra_len+comment_len
              if stop > len(tail): pos=idx+4; continue
              name=tail[idx+46:idx+46+name_len].decode("utf-8",errors="replace")
              extra=tail[idx+46+name_len:idx+46+name_len+extra_len]
              z64=zip64_values(extra, uncomp==0xFFFFFFFF, comp==0xFFFFFFFF, offset==0xFFFFFFFF)
              uncomp=z64.get("uncomp",uncomp); comp=z64.get("comp",comp); offset=z64.get("offset",offset)
              entries.append({"name":name,"method":method,"compressed_size":comp,"uncompressed_size":uncomp,"local_offset":offset})
              pos=stop

          matches=[e for e in entries if "ETH" in e["name"].upper() and "USD" in e["name"].upper()]
          print("TIME_SALES_ARCHIVE_PHYSICAL_PROBE=ACCESSIBLE_ZIP")
          print("TIME_SALES_ARCHIVE_FILE_ID="+FILE_ID)
          print("TIME_SALES_ARCHIVE_SIZE_BYTES="+str(archive_size))
          print("TIME_SALES_ARCHIVE_CONTENT_DISPOSITION="+disposition)
          print("TIME_SALES_ARCHIVE_CENTRAL_DIRECTORY_ENTRIES_SEEN="+str(len(entries)))
          print("TIME_SALES_ARCHIVE_ETHUSD_MATCHES="+json.dumps(matches,sort_keys=True))
          assert matches, "ETHUSD member not found in official archive central directory"
          exact=[e for e in matches if e["name"].split("/")[-1].upper() in {"ETHUSD.CSV","XETHZUSD.CSV"}]
          member=exact[0] if exact else matches[0]
          off=member["local_offset"]
          local=range_get(opener,download_url,off,off+29)
          sig,ver,flag,method,mtime,mdate,crc,comp32,uncomp32,nlen,xlen=struct.unpack("<4s5H3I2H",local)
          assert sig == b"PK\x03\x04"
          data_offset=off+30+nlen+xlen
          chunk_len=min(member["compressed_size"],16*1024*1024)
          compressed=range_get(opener,download_url,data_offset,data_offset+chunk_len-1)
          if method == 0:
              decoded=compressed[:1024*1024]
          elif method == 8:
              decoded=zlib.decompressobj(-15).decompress(compressed,1024*1024)
          else:
              raise AssertionError(f"unsupported ZIP compression method {method}")
          lines=[line for line in decoded.decode("utf-8",errors="strict").splitlines() if line][:5]
          assert lines
          first=lines[0].split(",")
          ts=float(first[0])
          first_utc=datetime.fromtimestamp(ts,timezone.utc).isoformat().replace("+00:00","Z")
          print("TIME_SALES_ARCHIVE_ETHUSD_PRESENT=PASS")
          print("TIME_SALES_ARCHIVE_ETHUSD_MEMBER="+member["name"])
          print("TIME_SALES_ARCHIVE_ETHUSD_MEMBER_COMPRESSED_SIZE="+str(member["compressed_size"]))
          print("TIME_SALES_ARCHIVE_ETHUSD_MEMBER_UNCOMPRESSED_SIZE="+str(member["uncompressed_size"]))
          print("TIME_SALES_ARCHIVE_ETHUSD_MEMBER_COMPRESSION_METHOD="+str(method))
          print("TIME_SALES_ARCHIVE_ETHUSD_FIRST_ROWS="+json.dumps(lines,ensure_ascii=False))
          print("TIME_SALES_ARCHIVE_ETHUSD_ROW_WIDTH="+str(len(first)))
          print("TIME_SALES_ARCHIVE_ETHUSD_EARLIEST_PROVEN_UTC="+first_utc)
          PY
