name: Kraken official source qualification probe

on:
  push:
    branches:
      - agent/data-bridge/kraken-spot-deep-history-source-repair-r01

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Inspect official quarterly Time and Sales folder
        shell: bash
        run: |
          python - <<'PY'
          import html
          import re
          import urllib.request
          from html.parser import HTMLParser

          URL="https://drive.google.com/drive/mobile/folders/188O9xQjZTythjyLNes_5zfMEFaMbTT22?usp=sharing"
          req=urllib.request.Request(URL,headers={"User-Agent":"Mozilla/5.0"})
          with urllib.request.urlopen(req,timeout=120) as r:
              raw=r.read()
          text=raw.decode("utf-8",errors="replace")
          print("QUARTERLY_FOLDER_HTTP_BYTES="+str(len(raw)))
          print("QUARTERLY_FOLDER_2026_PRESENT="+("YES" if "2026" in text else "NO"))
          patterns=[
              r'href="([^"]+)"[^>]*>([^<]*(?:2026|Q[1234]|zip)[^<]*)<',
              r'([A-Za-z0-9 _.-]*(?:2026|Q[1234])[A-Za-z0-9 _.-]*\.zip)',
              r'([A-Za-z0-9_-]{20,})',
          ]
          for pattern in patterns:
              found=[]
              for m in re.finditer(pattern,text,re.I):
                  value=m.groups() if len(m.groups())>1 else m.group(1)
                  if value not in found: found.append(value)
              print("PATTERN_MATCH="+repr(found[:100]))
          for needle in ("2026","2025","Q1","Q2","Q3","Quarter","Trading_History"):
              pos=text.lower().find(needle.lower())
              if pos>=0:
                  print("CONTEXT_"+needle.replace(" ","_")+"="+html.unescape(text[max(0,pos-500):pos+1000]).replace("\n"," "))
          PY
