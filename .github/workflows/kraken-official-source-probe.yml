name: Kraken official source qualification probe

on:
  push:
    branches:
      - agent/data-bridge/kraken-spot-deep-history-source-repair-r01

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Qualify exact official Kraken ETHUSD Time and Sales member
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,http.cookiejar,struct,urllib.parse,urllib.request,zlib
          from datetime import datetime,timezone
          from html.parser import HTMLParser
          UA={"User-Agent":"Mozilla/5.0 eth-macro-data-bridge-source-probe/1.0"}
          FILE_ID="10zh3tDpqANYvVtYVgczwVz3UZFRUb1el"
          LANDING=f"https://drive.google.com/uc?export=download&id={FILE_ID}"
          class FormParser(HTMLParser):
              def __init__(self): super().__init__(); self.forms=[]; self.current=None
              def handle_starttag(self,tag,attrs):
                  v=dict(attrs)
                  if tag=="form": self.current={"action":v.get("action"),"method":v.get("method","get").lower(),"inputs":{}}; self.forms.append(self.current)
                  elif tag=="input" and self.current is not None and v.get("name"): self.current["inputs"][v["name"]]=v.get("value","")
              def handle_endtag(self,tag):
                  if tag=="form": self.current=None
          jar=http.cookiejar.CookieJar(); opener=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))
          with opener.open(urllib.request.Request(LANDING,headers=UA),timeout=120) as r:
              landing=r.read(256*1024); ctype=r.headers.get("Content-Type") or ""
          url=LANDING
          if "text/html" in ctype:
              p=FormParser(); p.feed(landing.decode("utf-8",errors="replace")); f=next(x for x in p.forms if x.get("action") and "download" in x["action"] and x.get("method")=="get")
              url=f["action"]+"?"+urllib.parse.urlencode(f["inputs"])
          with opener.open(urllib.request.Request(url,headers=UA),timeout=120) as r:
              size=int(r.headers["Content-Length"]); disposition=r.headers.get("Content-Disposition") or ""; assert r.read(4)==b"PK\x03\x04"
          def rg(start,end):
              with opener.open(urllib.request.Request(url,headers={**UA,"Range":f"bytes={start}-{end}"}),timeout=120) as r:
                  raw=r.read(); assert r.status==206 and len(raw)==end-start+1; return raw
          tail_size=min(32*1024*1024,size); tail_start=size-tail_size; tail=rg(tail_start,size-1)
          target=None; pos=0
          while True:
              i=tail.find(b"PK\x01\x02",pos)
              if i<0 or i+46>len(tail): break
              f=struct.unpack_from("<4s6H3I5H2I",tail,i); method=f[4]; comp=f[8]; uncomp=f[9]; nlen,xlen,clen=f[10],f[11],f[12]; off=f[16]; stop=i+46+nlen+xlen+clen
              if stop>len(tail): pos=i+4; continue
              name=tail[i+46:i+46+nlen].decode("utf-8",errors="replace"); extra=tail[i+46+nlen:i+46+nlen+xlen]
              if 0xFFFFFFFF in (comp,uncomp,off):
                  q=0; ep=0
                  while ep+4<=len(extra):
                      eid,es=struct.unpack_from("<HH",extra,ep); ep+=4; data=extra[ep:ep+es]; ep+=es
                      if eid==1:
                          if uncomp==0xFFFFFFFF: uncomp,=struct.unpack_from("<Q",data,q); q+=8
                          if comp==0xFFFFFFFF: comp,=struct.unpack_from("<Q",data,q); q+=8
                          if off==0xFFFFFFFF: off,=struct.unpack_from("<Q",data,q); q+=8
                          break
              if name=="TimeAndSales_Combined/ETHUSD.csv": target=(name,method,comp,uncomp,off)
              pos=stop
          assert target is not None
          name,method,comp,uncomp,off=target; assert method==8
          local=rg(off,off+29); sig,ver,flag,lmethod,mtime,mdate,crc,c32,u32,nlen,xlen=struct.unpack("<4s5H3I2H",local); assert sig==b"PK\x03\x04" and lmethod==8
          data_off=off+30+nlen+xlen
          h=hashlib.sha256(); decomp=zlib.decompressobj(-15); pending=b""; first=None; last=None; rows=0; previous_ts=None; regressions=0
          chunk=8*1024*1024; consumed=0
          while consumed<comp:
              take=min(chunk,comp-consumed); raw=rg(data_off+consumed,data_off+consumed+take-1); consumed+=take; h.update(raw); decoded=decomp.decompress(raw)
              pending+=decoded; lines=pending.split(b"\n"); pending=lines.pop()
              for line in lines:
                  if not line: continue
                  parts=line.decode("ascii").split(","); assert len(parts)==3
                  ts=int(parts[0]);
                  if previous_ts is not None and ts<previous_ts: regressions+=1
                  previous_ts=ts; rows+=1; first=first or parts; last=parts
          pending+=decomp.flush()
          if pending.strip():
              parts=pending.strip().decode("ascii").split(","); assert len(parts)==3; ts=int(parts[0]); regressions+=int(previous_ts is not None and ts<previous_ts); rows+=1; first=first or parts; last=parts
          assert regressions==0 and first and last
          iso=lambda s: datetime.fromtimestamp(int(s),timezone.utc).isoformat().replace("+00:00","Z")
          print("TIME_SALES_ARCHIVE_PHYSICAL_PROBE=PASS")
          print("TIME_SALES_ARCHIVE_FILE_ID="+FILE_ID)
          print("TIME_SALES_ARCHIVE_SIZE_BYTES="+str(size))
          print("TIME_SALES_ARCHIVE_CONTENT_DISPOSITION="+disposition)
          print("TIME_SALES_ARCHIVE_ETHUSD_MEMBER="+name)
          print("TIME_SALES_ARCHIVE_ETHUSD_COMPRESSED_SIZE="+str(comp))
          print("TIME_SALES_ARCHIVE_ETHUSD_UNCOMPRESSED_SIZE="+str(uncomp))
          print("TIME_SALES_ARCHIVE_ETHUSD_COMPRESSED_SHA256="+h.hexdigest())
          print("TIME_SALES_ARCHIVE_ETHUSD_ROW_COUNT="+str(rows))
          print("TIME_SALES_ARCHIVE_ETHUSD_TIMESTAMP_REGRESSIONS="+str(regressions))
          print("TIME_SALES_ARCHIVE_ETHUSD_EARLIEST_PROVEN_UTC="+iso(first[0]))
          print("TIME_SALES_ARCHIVE_ETHUSD_LATEST_PROVEN_UTC="+iso(last[0]))
          print("TIME_SALES_ARCHIVE_ETHUSD_FIRST_ROW="+",".join(first))
          print("TIME_SALES_ARCHIVE_ETHUSD_LAST_ROW="+",".join(last))
          print("TIME_SALES_ARCHIVE_MEMBER_RANGE_ACQUISITION=PASS")
          PY
