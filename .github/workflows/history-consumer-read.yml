name: History consumer read

on:
  workflow_dispatch:
    inputs:
      series_id:
        description: Canonical semantic series_id
        required: true
        default: spot.binance-spot.ETHUSDT.ohlcv.4h
        type: string
      from_utc:
        description: Inclusive UTC start
        required: true
        default: 2023-10-13T00:00:00Z
        type: string
      to_utc:
        description: Exclusive UTC end
        required: true
        default: 2024-03-13T00:00:00Z
        type: string
      cutoff_utc:
        description: Optional point-in-time evidence cutoff
        required: false
        type: string
      mode:
        description: Integrity mode
        required: true
        default: strict
        type: choice
        options:
          - strict
          - permissive
      output_format:
        description: Candle output format
        required: true
        default: csv
        type: choice
        options:
          - csv
          - json
  issues:
    types: [opened]
  push:
    branches:
      - agent/runtime-history-consumer-v1
      - agent/history-issue-transport-v1
    paths:
      - tools/history_consumer.py
      - tools/history_issue_request.py
      - tools/capability_index.py
      - tools/history_access.py
      - tools/validation/qualify_history_consumer_runtime.py
      - tests/deep_history/test_history_consumer.py
      - tests/deep_history/test_history_issue_request.py
      - .github/workflows/history-consumer-read.yml

permissions:
  contents: read
  issues: write

jobs:
  runtime-qualification:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: src:tools/deep_history
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Compile runtime consumer
        run: python -m compileall -q tools/history_consumer.py tools/history_issue_request.py tools/validation/qualify_history_consumer_runtime.py tests/deep_history/test_history_consumer.py tests/deep_history/test_history_issue_request.py
      - name: Run adapter and request regressions
        run: python -m unittest tests.deep_history.test_history_consumer tests.deep_history.test_history_issue_request -v
      - name: Qualify real semantic-to-bytes access
        shell: bash
        run: |
          set -o pipefail
          python -m tools.validation.qualify_history_consumer_runtime | tee runtime-qualification.log
      - name: Materialize exact wave-agent proof artifact
        run: |
          python tools/history_consumer.py read \
            --series-id spot.binance-spot.ETHUSDT.ohlcv.4h \
            --from 2023-10-13T00:00:00Z \
            --to 2024-03-13T00:00:00Z \
            --mode strict \
            --format csv \
            --output candles.csv \
            --plan-output resolution-plan.json \
            --diagnostics-output diagnostics.json \
            --receipt-output receipt.json
          python - <<'PY'
          import json
          from pathlib import Path
          receipt = json.loads(Path('receipt.json').read_text(encoding='utf-8'))
          diagnostics = json.loads(Path('diagnostics.json').read_text(encoding='utf-8'))
          assert receipt['status'] == 'PASS'
          assert diagnostics['gap_count'] == 0
          assert diagnostics['duplicates'] == 0
          assert diagnostics['rows'] == diagnostics['expected_rows']
          assert Path('candles.csv').stat().st_size == receipt['output_bytes']
          print('WAVE_AGENT_ARTIFACT=PASS')
          print('WAVE_AGENT_ROWS=' + str(receipt['rows']))
          print('WAVE_AGENT_PLAN_SHA256=' + receipt['plan_sha256'])
          print('WAVE_AGENT_OUTPUT_SHA256=' + receipt['output_sha256'])
          PY
      - name: Upload verified runtime proof
        uses: actions/upload-artifact@v4
        with:
          name: history-consumer-runtime-proof-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          path: |
            runtime-qualification.log
            resolution-plan.json
            diagnostics.json
            receipt.json
            candles.csv

  consumer-read:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: src:tools/deep_history
    steps:
      - name: Checkout requested revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Resolve and materialize canonical history
        env:
          SERIES_ID: ${{ inputs.series_id }}
          FROM_UTC: ${{ inputs.from_utc }}
          TO_UTC: ${{ inputs.to_utc }}
          CUTOFF_UTC: ${{ inputs.cutoff_utc }}
          MODE: ${{ inputs.mode }}
          OUTPUT_FORMAT: ${{ inputs.output_format }}
        run: |
          args=(read --series-id "$SERIES_ID" --from "$FROM_UTC" --to "$TO_UTC" --mode "$MODE" --format "$OUTPUT_FORMAT" --output "candles.$OUTPUT_FORMAT" --plan-output resolution-plan.json --diagnostics-output diagnostics.json --receipt-output receipt.json)
          if [ -n "$CUTOFF_UTC" ]; then
            args+=(--cutoff "$CUTOFF_UTC")
          fi
          python tools/history_consumer.py "${args[@]}"
          python - <<'PY'
          import json
          from pathlib import Path
          receipt = json.loads(Path('receipt.json').read_text(encoding='utf-8'))
          print('HISTORY_CONSUMER_READ=' + receipt['status'])
          print('HISTORY_CONSUMER_ROWS=' + str(receipt['rows']))
          print('HISTORY_CONSUMER_PLAN_SHA256=' + receipt['plan_sha256'])
          print('HISTORY_CONSUMER_OUTPUT_SHA256=' + receipt['output_sha256'])
          PY
      - name: Upload read result and provenance receipt
        uses: actions/upload-artifact@v4
        with:
          name: history-consumer-read-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 7
          path: |
            resolution-plan.json
            diagnostics.json
            receipt.json
            candles.*

  issue-consumer-read:
    if: github.event_name == 'issues' && github.actor == github.repository_owner && startsWith(github.event.issue.title, '[history-read]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: src:tools/deep_history
    steps:
      - name: Checkout request-time main revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Validate semantic issue request
        id: request
        continue-on-error: true
        run: python tools/history_issue_request.py parse --event "$GITHUB_EVENT_PATH" --github-output "$GITHUB_OUTPUT"
      - name: Resolve and materialize canonical history
        id: materialize
        if: steps.request.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          SERIES_ID: ${{ steps.request.outputs.series_id }}
          FROM_UTC: ${{ steps.request.outputs.from_utc }}
          TO_UTC: ${{ steps.request.outputs.to_utc }}
          CUTOFF_UTC: ${{ steps.request.outputs.cutoff_utc }}
          MODE: ${{ steps.request.outputs.mode }}
          OUTPUT_FORMAT: ${{ steps.request.outputs.output_format }}
        run: |
          set -o pipefail
          args=(read --series-id "$SERIES_ID" --from "$FROM_UTC" --to "$TO_UTC" --mode "$MODE" --format "$OUTPUT_FORMAT" --output "candles.$OUTPUT_FORMAT" --plan-output resolution-plan.json --diagnostics-output diagnostics.json --receipt-output receipt.json)
          if [ -n "$CUTOFF_UTC" ]; then
            args+=(--cutoff "$CUTOFF_UTC")
          fi
          python tools/history_consumer.py "${args[@]}" 2>&1 | tee history-consumer.log
      - name: Validate materialization receipt
        id: receipt
        if: steps.materialize.outcome == 'success'
        env:
          MODE: ${{ steps.request.outputs.mode }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          receipt = json.loads(Path('receipt.json').read_text(encoding='utf-8'))
          diagnostics = json.loads(Path('diagnostics.json').read_text(encoding='utf-8'))
          if os.environ['MODE'] == 'strict':
              assert receipt['status'] == 'PASS'
              assert diagnostics['gap_count'] == 0
              assert diagnostics['duplicates'] == 0
              assert diagnostics['rows'] == diagnostics['expected_rows']
          else:
              assert receipt['status'] in {'PASS', 'DEGRADED'}
          pairs = {
              'status': receipt['status'],
              'rows': receipt['rows'],
              'expected_rows': diagnostics['expected_rows'],
              'gap_count': diagnostics['gap_count'],
              'duplicates': diagnostics['duplicates'],
              'plan_sha256': receipt['plan_sha256'],
              'output_sha256': receipt['output_sha256'],
          }
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              for key, value in pairs.items():
                  handle.write(f'{key}={value}\n')
          print('HISTORY_ISSUE_MATERIALIZATION=' + receipt['status'])
          PY
      - name: Upload semantic read result
        id: upload
        if: steps.receipt.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: history-issue-read-${{ github.event.issue.number }}-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 7
          path: |
            resolution-plan.json
            diagnostics.json
            receipt.json
            history-consumer.log
            candles.*
      - name: Publish request receipt to issue
        if: always()
        uses: actions/github-script@v8
        env:
          REQUEST_OUTCOME: ${{ steps.request.outcome }}
          MATERIALIZE_OUTCOME: ${{ steps.materialize.outcome }}
          RECEIPT_OUTCOME: ${{ steps.receipt.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
          REQUEST_SHA256: ${{ steps.request.outputs.request_sha256 }}
          STATUS: ${{ steps.receipt.outputs.status }}
          ROWS: ${{ steps.receipt.outputs.rows }}
          EXPECTED_ROWS: ${{ steps.receipt.outputs.expected_rows }}
          GAP_COUNT: ${{ steps.receipt.outputs.gap_count }}
          DUPLICATES: ${{ steps.receipt.outputs.duplicates }}
          PLAN_SHA256: ${{ steps.receipt.outputs.plan_sha256 }}
          OUTPUT_SHA256: ${{ steps.receipt.outputs.output_sha256 }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        with:
          script: |
            const success = process.env.REQUEST_OUTCOME === 'success' && process.env.MATERIALIZE_OUTCOME === 'success' && process.env.RECEIPT_OUTCOME === 'success' && process.env.UPLOAD_OUTCOME === 'success';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const lines = success ? [
              'HISTORY_AGENT_REQUEST=PASS',
              `REQUEST_SHA256=${process.env.REQUEST_SHA256}`,
              `STATUS=${process.env.STATUS}`,
              `ROWS=${process.env.ROWS}/${process.env.EXPECTED_ROWS}`,
              `GAPS=${process.env.GAP_COUNT}`,
              `DUPLICATES=${process.env.DUPLICATES}`,
              `PLAN_SHA256=${process.env.PLAN_SHA256}`,
              `OUTPUT_SHA256=${process.env.OUTPUT_SHA256}`,
              `RUN_ID=${context.runId}`,
              `RUN_URL=${runUrl}`,
              `ARTIFACT_URL=${process.env.ARTIFACT_URL}`,
            ] : [
              'HISTORY_AGENT_REQUEST=FAIL',
              `REQUEST_OUTCOME=${process.env.REQUEST_OUTCOME}`,
              `MATERIALIZE_OUTCOME=${process.env.MATERIALIZE_OUTCOME}`,
              `RECEIPT_OUTCOME=${process.env.RECEIPT_OUTCOME}`,
              `UPLOAD_OUTCOME=${process.env.UPLOAD_OUTCOME}`,
              `RUN_ID=${context.runId}`,
              `RUN_URL=${runUrl}`,
            ];
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body: '```text\n' + lines.join('\n') + '\n```'});
            await github.rest.issues.update({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, state: 'closed'});
      - name: Fail closed on request failure
        if: always() && (steps.request.outcome != 'success' || steps.materialize.outcome != 'success' || steps.receipt.outcome != 'success' || steps.upload.outcome != 'success')
        run: exit 1
