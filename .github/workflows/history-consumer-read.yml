name: History consumer read

on:
  workflow_dispatch:
    inputs:
      series_id:
        description: Canonical semantic series_id
        required: true
        default: spot.binance-spot.ETHUSDT.ohlcv.4h
        type: string
      from_utc:
        description: Inclusive UTC start
        required: true
        default: 2023-10-13T00:00:00Z
        type: string
      to_utc:
        description: Exclusive UTC end
        required: true
        default: 2024-03-13T00:00:00Z
        type: string
      cutoff_utc:
        description: Optional point-in-time evidence cutoff
        required: false
        type: string
      mode:
        description: Integrity mode
        required: true
        default: strict
        type: choice
        options: [strict, permissive]
      current_policy:
        description: Active D6 current-data policy
        required: true
        default: FINALIZED_ONLY
        type: choice
        options: [FINALIZED_ONLY]
      output_format:
        description: Candle output format
        required: true
        default: csv
        type: choice
        options: [csv, json]
  issues:
    types: [opened]
  push:
    branches:
      - agent/runtime-history-consumer-v1
      - agent/history-issue-transport-v1
      - agent/d9-5-semantic-receipt-v2-contract-closure-v1
      - agent/market-data/history-fresh-current-tail-seam-v1
      - agent/market-data/options-forward-sampled-history-r01
    paths:
      - src/intelligence.py
      - src/options_derivation.py
      - tools/history_consumer.py
      - tools/history_issue_request.py
      - tools/sampled_history.py
      - tools/validation/qualify_options_sampled_history.py
      - tests/deep_history/test_history_consumer.py
      - tests/deep_history/test_history_issue_request.py
      - tests/deep_history/test_options_sampled_history.py
      - tools/history_access_v2.py
      - tools/current_tail_admission.py
      - tools/history_current_tail_runtime.py
      - tools/validation/validate_research_semantic_receipt_compat.py
      - tools/capability_index.py
      - tools/history_access.py
      - tools/validation/qualify_history_consumer_runtime.py
      - tests/deep_history/test_history_fresh_current_tail.py
      - tests/deep_history/test_semantic_receipt_contract.py
      - tests/fixtures/research-d9-5/market-data-ref.schema.json
      - .github/workflows/history-consumer-read.yml

permissions:
  contents: read
  issues: write

jobs:
  runtime-qualification:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: src:tools/deep_history:tools
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Compile exact repository source and tests
        run: python -m compileall -q src tools tests
      - name: Run sampled-history T1-T15 and existing history transport regressions
        run: |
          python -m unittest tests.deep_history.test_options_sampled_history -v
          python -m unittest tests.deep_history.test_history_consumer tests.deep_history.test_history_issue_request tests.deep_history.test_history_fresh_current_tail tests.deep_history.test_semantic_receipt_contract -v
      - name: Run canonical Data Bridge gates
        run: |
          python -m unittest discover -s tests/deep_history -p 'test_*.py' -v
          python tools/validation/validate_repository.py
          python tools/validation/validate_d9_contracts.py
          python tools/validation/consumer_proof.py
          python tools/validation/validate_d9_resolution_v2.py
          python tools/capability_index.py validate
      - name: Qualify existing real semantic-to-bytes access
        run: python -m tools.validation.qualify_history_consumer_runtime
      - name: Qualify real options CURRENT 24H 72H 7D sampled history
        shell: bash
        run: |
          set -euo pipefail
          python -m tools.validation.qualify_options_sampled_history | tee options-sampled-history-qualification.log
          grep -Fx 'CAPABILITY_DISCOVERY=PASS' options-sampled-history-qualification.log
          grep -Fx 'FORWARD_SAMPLED_HISTORY_RESOLUTION=PASS' options-sampled-history-qualification.log
          grep -Fx 'AT_OR_BEFORE_SELECTION=PASS' options-sampled-history-qualification.log
          grep -Fx 'CANONICAL_SNAPSHOT_READER=PASS' options-sampled-history-qualification.log
          grep -Fx 'SHARED_OPTIONS_DERIVATION=PASS' options-sampled-history-qualification.log
          grep -Fx 'CURRENT_HISTORICAL_DERIVATION_PARITY=PASS' options-sampled-history-qualification.log
          grep -Fx 'OPTIONS_24H_READ=PASS' options-sampled-history-qualification.log
          grep -Fx 'OPTIONS_72H_READ=PASS' options-sampled-history-qualification.log
          grep -Fx 'OPTIONS_7D_READ=PASS' options-sampled-history-qualification.log
          grep -Fx 'DERIVATION_POLICY_MATCH=YES' options-sampled-history-qualification.log
          grep -Fx 'NO_DIRECT_PROVIDER_HISTORY_SUBSTITUTION=PASS' options-sampled-history-qualification.log
          grep -Fx 'SECOND_MARKET_DATA_AUTHORITY=NO' options-sampled-history-qualification.log
      - name: Upload runtime proof
        uses: actions/upload-artifact@v4
        with:
          name: history-consumer-runtime-proof-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          path: options-sampled-history-qualification.log

  consumer-read:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: market-bridge-update
      cancel-in-progress: false
    env:
      PYTHONPATH: src:tools/deep_history:tools
    steps:
      - name: Checkout requested revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Resolve and materialize canonical series history
        env:
          SERIES_ID: ${{ inputs.series_id }}
          FROM_UTC: ${{ inputs.from_utc }}
          TO_UTC: ${{ inputs.to_utc }}
          CUTOFF_UTC: ${{ inputs.cutoff_utc }}
          MODE: ${{ inputs.mode }}
          CURRENT_POLICY: ${{ inputs.current_policy }}
          OUTPUT_FORMAT: ${{ inputs.output_format }}
        run: |
          args=(read --series-id "$SERIES_ID" --from "$FROM_UTC" --to "$TO_UTC" --mode "$MODE" --current-policy "$CURRENT_POLICY" --format "$OUTPUT_FORMAT" --output "candles.$OUTPUT_FORMAT" --plan-output resolution-plan.json --diagnostics-output diagnostics.json --receipt-output receipt.json --semantic-receipt-output semantic-receipt.json)
          if [ -n "$CUTOFF_UTC" ]; then args+=(--cutoff "$CUTOFF_UTC"); fi
          python -m tools.history_current_tail_runtime "${args[@]}"
      - name: Upload read result and provenance receipt
        uses: actions/upload-artifact@v4
        with:
          name: history-consumer-read-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 7
          path: |
            resolution-plan.json
            diagnostics.json
            receipt.json
            semantic-receipt.json
            candles.*

  issue-consumer-read:
    if: github.event_name == 'issues' && github.actor == github.repository_owner && startsWith(github.event.issue.title, '[history-read]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: market-bridge-update
      cancel-in-progress: false
    env:
      PYTHONPATH: src:tools/deep_history:tools
    steps:
      - name: Checkout request-time main revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Validate semantic issue request
        id: request
        continue-on-error: true
        run: python tools/history_issue_request.py parse --event "$GITHUB_EVENT_PATH" --github-output "$GITHUB_OUTPUT"
      - name: Materialize series request
        id: series_materialize
        if: steps.request.outcome == 'success' && steps.request.outputs.request_kind == 'SERIES'
        continue-on-error: true
        shell: bash
        env:
          SERIES_ID: ${{ steps.request.outputs.series_id }}
          FROM_UTC: ${{ steps.request.outputs.from_utc }}
          TO_UTC: ${{ steps.request.outputs.to_utc }}
          CUTOFF_UTC: ${{ steps.request.outputs.cutoff_utc }}
          MODE: ${{ steps.request.outputs.mode }}
          CURRENT_POLICY: ${{ steps.request.outputs.current_policy }}
          OUTPUT_FORMAT: ${{ steps.request.outputs.output_format }}
        run: |
          set -o pipefail
          history_log="$RUNNER_TEMP/history-consumer.log"
          args=(read --series-id "$SERIES_ID" --from "$FROM_UTC" --to "$TO_UTC" --mode "$MODE" --current-policy "$CURRENT_POLICY" --format "$OUTPUT_FORMAT" --output "candles.$OUTPUT_FORMAT" --plan-output resolution-plan.json --diagnostics-output diagnostics.json --receipt-output receipt.json --semantic-receipt-output semantic-receipt.json)
          if [ -n "$CUTOFF_UTC" ]; then args+=(--cutoff "$CUTOFF_UTC"); fi
          python -m tools.history_current_tail_runtime "${args[@]}" 2>&1 | tee "$history_log"
      - name: Materialize sampled request
        id: sampled_materialize
        if: steps.request.outcome == 'success' && steps.request.outputs.request_kind == 'SAMPLED'
        continue-on-error: true
        shell: bash
        env:
          CAPABILITY_ID: ${{ steps.request.outputs.capability_id }}
          TARGET_UTC: ${{ steps.request.outputs.target_utc }}
          SELECTION_POLICY: ${{ steps.request.outputs.selection_policy }}
        run: |
          set -o pipefail
          history_log="$RUNNER_TEMP/history-consumer.log"
          python tools/history_consumer.py sampled \
            --capability-id "$CAPABILITY_ID" \
            --target "$TARGET_UTC" \
            --selection "$SELECTION_POLICY" \
            --format json \
            --output sampled.json \
            --plan-output resolution-plan.json \
            --diagnostics-output diagnostics.json \
            --receipt-output receipt.json \
            --semantic-receipt-output semantic-receipt.json 2>&1 | tee "$history_log"
      - name: Validate materialization receipt
        id: receipt
        if: steps.request.outcome == 'success' && (steps.series_materialize.outcome == 'success' || steps.sampled_materialize.outcome == 'success')
        shell: bash
        env:
          REQUEST_KIND: ${{ steps.request.outputs.request_kind }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          receipt=json.loads(Path('receipt.json').read_text(encoding='utf-8'))
          semantic=json.loads(Path('semantic-receipt.json').read_text(encoding='utf-8'))
          diagnostics=json.loads(Path('diagnostics.json').read_text(encoding='utf-8'))
          assert semantic == receipt['semantic_receipt']
          pairs={'request_kind':os.environ['REQUEST_KIND']}
          if os.environ['REQUEST_KIND']=='SERIES':
              assert semantic['receipt_schema_version']=='history-access-receipt/2.0.0'
              assert receipt['status'] in {'PASS','DEGRADED'}
              pairs.update(status=receipt['status'],rows=receipt['rows'],plan_sha256=receipt['plan_sha256'],output_sha256=receipt['transport_output_sha256'],availability_state='SERIES_NA',selected_observation_utc='SERIES_NA',distance_to_target_ms='SERIES_NA',resource_identity='SERIES_NA',derivation_policy_id='SERIES_NA',derivation_policy_version='SERIES_NA',derivation_policy_sha256='SERIES_NA')
          else:
              assert semantic['receipt_schema_version']=='market-data-sampled-history-receipt/1.0.0'
              assert receipt['availability_state']=='HISTORY_AVAILABLE'
              identity=receipt['derivation_policy_identity']
              pairs.update(status='PASS',rows=1,plan_sha256=receipt['plan_sha256'],output_sha256=receipt['output_sha256'],availability_state=receipt['availability_state'],selected_observation_utc=receipt['selected_observation_timestamp_utc'],distance_to_target_ms=receipt['distance_to_target_ms'],resource_identity=receipt['resource_identity'],derivation_policy_id=identity['derivation_policy_id'],derivation_policy_version=identity['derivation_policy_version'],derivation_policy_sha256=identity['derivation_policy_sha256'])
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as handle:
              for key,value in pairs.items(): handle.write(f'{key}={value}\n')
          print('HISTORY_ISSUE_MATERIALIZATION=PASS')
          PY
      - name: Upload semantic read result
        id: upload
        if: steps.receipt.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: history-issue-read-${{ github.event.issue.number }}-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 7
          path: |
            resolution-plan.json
            diagnostics.json
            receipt.json
            semantic-receipt.json
            sampled.json
            candles.*
            ${{ runner.temp }}/history-consumer.log
      - name: Publish request receipt to issue
        if: always()
        uses: actions/github-script@v8
        env:
          REQUEST_KIND: ${{ steps.request.outputs.request_kind }}
          REQUEST_OUTCOME: ${{ steps.request.outcome }}
          SERIES_OUTCOME: ${{ steps.series_materialize.outcome }}
          SAMPLED_OUTCOME: ${{ steps.sampled_materialize.outcome }}
          RECEIPT_OUTCOME: ${{ steps.receipt.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
          REQUEST_SHA256: ${{ steps.request.outputs.request_sha256 }}
          STATUS: ${{ steps.receipt.outputs.status }}
          PLAN_SHA256: ${{ steps.receipt.outputs.plan_sha256 }}
          OUTPUT_SHA256: ${{ steps.receipt.outputs.output_sha256 }}
          AVAILABILITY_STATE: ${{ steps.receipt.outputs.availability_state }}
          SELECTED_OBSERVATION_UTC: ${{ steps.receipt.outputs.selected_observation_utc }}
          DISTANCE_TO_TARGET_MS: ${{ steps.receipt.outputs.distance_to_target_ms }}
          RESOURCE_IDENTITY: ${{ steps.receipt.outputs.resource_identity }}
          DERIVATION_POLICY_ID: ${{ steps.receipt.outputs.derivation_policy_id }}
          DERIVATION_POLICY_VERSION: ${{ steps.receipt.outputs.derivation_policy_version }}
          DERIVATION_POLICY_SHA256: ${{ steps.receipt.outputs.derivation_policy_sha256 }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        with:
          script: |
            const materializeOk = process.env.REQUEST_KIND === 'SERIES' ? process.env.SERIES_OUTCOME === 'success' : process.env.SAMPLED_OUTCOME === 'success';
            const success = process.env.REQUEST_OUTCOME === 'success' && materializeOk && process.env.RECEIPT_OUTCOME === 'success' && process.env.UPLOAD_OUTCOME === 'success';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const lines = success ? [
              'HISTORY_AGENT_REQUEST=PASS',
              `REQUEST_KIND=${process.env.REQUEST_KIND}`,
              `REQUEST_SHA256=${process.env.REQUEST_SHA256}`,
              `STATUS=${process.env.STATUS}`,
              `AVAILABILITY_STATE=${process.env.AVAILABILITY_STATE}`,
              `SELECTED_OBSERVATION_UTC=${process.env.SELECTED_OBSERVATION_UTC}`,
              `DISTANCE_TO_TARGET_MS=${process.env.DISTANCE_TO_TARGET_MS}`,
              `RESOURCE_IDENTITY=${process.env.RESOURCE_IDENTITY}`,
              `DERIVATION_POLICY_ID=${process.env.DERIVATION_POLICY_ID}`,
              `DERIVATION_POLICY_VERSION=${process.env.DERIVATION_POLICY_VERSION}`,
              `DERIVATION_POLICY_SHA256=${process.env.DERIVATION_POLICY_SHA256}`,
              `PLAN_SHA256=${process.env.PLAN_SHA256}`,
              `OUTPUT_SHA256=${process.env.OUTPUT_SHA256}`,
              `RUN_ID=${context.runId}`,
              `RUN_URL=${runUrl}`,
              `ARTIFACT_URL=${process.env.ARTIFACT_URL}`,
            ] : [
              'HISTORY_AGENT_REQUEST=FAIL',
              `REQUEST_KIND=${process.env.REQUEST_KIND}`,
              `REQUEST_OUTCOME=${process.env.REQUEST_OUTCOME}`,
              `SERIES_OUTCOME=${process.env.SERIES_OUTCOME}`,
              `SAMPLED_OUTCOME=${process.env.SAMPLED_OUTCOME}`,
              `RECEIPT_OUTCOME=${process.env.RECEIPT_OUTCOME}`,
              `UPLOAD_OUTCOME=${process.env.UPLOAD_OUTCOME}`,
              `RUN_ID=${context.runId}`,
              `RUN_URL=${runUrl}`,
            ];
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body: '```text\n' + lines.join('\n') + '\n```'});
            await github.rest.issues.update({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, state: 'closed'});
      - name: Fail closed on request failure
        if: always() && (steps.request.outcome != 'success' || steps.receipt.outcome != 'success' || steps.upload.outcome != 'success')
        run: exit 1
