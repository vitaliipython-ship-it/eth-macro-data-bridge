name: Kraken hybrid seam candidate builder

on:
  push:
    branches:
      - agent/data-bridge/kraken-spot-deep-history-source-repair-r01
    paths:
      - .github/workflows/kraken-rest-seam-probe.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: src:tools/deep_history:tools
    steps:
      - name: Checkout exact branch SHA
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up canonical Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Materialize hybrid source patch
        run: |
          python .github/scripts/kraken_hybrid_patch.py
          python .github/scripts/kraken_hybrid_bounded_tail_patch.py

      - name: Run targeted and deep-history qualification
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.deep_history.test_kraken_spot_rest_trades -v
          python -m unittest tests.deep_history.test_kraken_spot_time_sales -v
          python -m unittest tests.deep_history.test_kraken_spot_ohlcvt_backfill -v
          python -m unittest discover -s tests/deep_history -p 'test_*.py' -v
          python -m compileall -q tools tests
          cp history/capability-index.json "$RUNNER_TEMP/capability-index.before.json"
          python tools/capability_index.py build
          cmp "$RUNNER_TEMP/capability-index.before.json" history/capability-index.json
          python tools/capability_index.py validate
          python tools/validation/validate_history.py

      - name: Commit candidate and remove temporary carriers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "eth-macro-data-bridge[bot]"
          git config user.email "eth-macro-data-bridge[bot]@users.noreply.github.com"
          git rm \
            .github/workflows/kraken-rest-seam-probe.yml \
            .github/scripts/kraken_hybrid_patch.py \
            .github/scripts/kraken_hybrid_bounded_tail_patch.py
          git add AGENTS.md contracts/provider-contracts.json docs/semantics/capability-index.md \
            tools/deep_history/kraken_spot_time_sales.py \
            tools/deep_history/kraken_spot_ohlcvt_backfill.py \
            tools/deep_history/kraken_spot_rest_trades.py \
            tests/deep_history/test_kraken_spot_ohlcvt_backfill.py \
            tests/deep_history/test_kraken_spot_rest_trades.py
          test -z "$(git status --porcelain | grep '^??' || true)"
          git commit -m "data: complete Kraken deep-history seam with REST trades"
          git push origin HEAD:agent/data-bridge/kraken-spot-deep-history-source-repair-r01
