name: Fresh Current request-scope repair runner

on:
  push:
    branches:
      - agent/current-data/invocation-contract-hardening-v1
    paths:
      - .tmp/apply_current_data_request_scope_repair.py
      - .github/workflows/current-data-request-scope-repair-runner.yml

permissions:
  contents: write

env:
  PYTHONPATH: src:tools/deep_history:tools

jobs:
  apply-test-publish:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@v6
        with:
          ref: agent/current-data/invocation-contract-hardening-v1
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Apply bounded semantic repair
        run: python .tmp/apply_current_data_request_scope_repair.py
      - name: Run targeted request-scope matrix
        run: |
          python -m unittest discover -s tests/deep_history -p 'test_current_data_request_scope_qualification.py' -v
          python -m unittest discover -s tests/deep_history -p 'test_current_data_transport.py' -v
          python -m unittest discover -s tests/deep_history -p 'test_current_data_invocation_contract.py' -v
          python -m unittest discover -s tests -p 'test_kraken_trade_flow*.py' -v
          python tools/validation/validate_v4.py
          python -m compileall -q src tools tests
      - name: Publish bounded repair and remove bootstrap
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- .tmp/apply_current_data_request_scope_repair.py .github/workflows/current-data-request-scope-repair-runner.yml
          git add -- .github/workflows/current-data-request.yml tools/validation/validate_v4.py
          git diff --cached --check
          git commit -m "Repair Fresh Current request-scoped qualification"
          git push origin HEAD:agent/current-data/invocation-contract-hardening-v1
