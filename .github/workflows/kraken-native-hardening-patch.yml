name: Apply Kraken native hardening patch

on:
  push:
    paths:
      - ".github/workflows/kraken-native-hardening-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/kraken-futures/raw-trade-false-zero-repair-v1
          fetch-depth: 0
      - name: Apply bounded semantic repair
        run: python .tmp/kraken_native_patch.py
      - name: Targeted pre-commit validation
        run: |
          python -m compileall -q src tests
          PYTHONPATH=src python -m unittest discover -s tests -p 'test_kraken_trade_flow.py' -v
      - name: Commit bounded repair and remove temporary carriers
        run: |
          git config user.name "vitaliipython-ship-it"
          git config user.email "vitalii.python@gmail.com"
          git rm .github/workflows/kraken-native-alignment-probe.yml .github/workflows/kraken-native-hardening-patch.yml .tmp/kraken_native_patch.py
          git add -- src/kraken_trade_flow.py tests/test_kraken_trade_flow.py
          git commit -m "fix: harden Kraken raw-native value reconciliation"
          git push origin HEAD:agent/kraken-futures/raw-trade-false-zero-repair-v1
