name: Qualify EVENTS Fresh Current

on:
  push:
    branches:
      - agent/market-data/fresh-current-events-real-acceptance-v1

permissions:
  contents: read

env:
  PYTHONPATH: src:tools/deep_history:tools

jobs:
  real-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact repair candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Capture exact control-plane identity
        id: control
        shell: bash
        run: |
          set -euo pipefail
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
          echo "CONTROL_PLANE_HEAD=$(git rev-parse HEAD)"
          echo "CONTROL_PLANE_TREE=$(git rev-parse 'HEAD^{tree}')"
      - name: Build exact six-domain Technical Indicators request
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .current-data-output .current-data-work
          cat > .current-data-work/real-request.json <<'JSON'
          {
            "request_type":"FRESH_CURRENT",
            "required_series":[
              {"series_id":"spot.binance-spot.ETHUSDT.ohlcv.5m","latest_bars":256},
              {"series_id":"spot.binance-spot.ETHUSDT.ohlcv.15m","latest_bars":256},
              {"series_id":"spot.binance-spot.ETHUSDT.ohlcv.1h","latest_bars":256},
              {"series_id":"spot.binance-spot.ETHUSDT.ohlcv.4h","latest_bars":256},
              {"series_id":"spot.binance-spot.ETHUSDT.ohlcv.1d","latest_bars":256},
              {"series_id":"spot.binance-spot.ETHUSDT.ohlcv.1w","latest_bars":256},
              {"series_id":"spot.binance-spot.BTCUSDT.ohlcv.5m","latest_bars":256},
              {"series_id":"spot.binance-spot.BTCUSDT.ohlcv.15m","latest_bars":256},
              {"series_id":"spot.binance-spot.BTCUSDT.ohlcv.1h","latest_bars":256},
              {"series_id":"spot.binance-spot.BTCUSDT.ohlcv.4h","latest_bars":256},
              {"series_id":"spot.binance-spot.BTCUSDT.ohlcv.1d","latest_bars":256},
              {"series_id":"spot.binance-spot.BTCUSDT.ohlcv.1w","latest_bars":256},
              {"series_id":"spot.binance-spot.ETHBTC.ohlcv.5m","latest_bars":256},
              {"series_id":"spot.binance-spot.ETHBTC.ohlcv.15m","latest_bars":256},
              {"series_id":"spot.binance-spot.ETHBTC.ohlcv.1h","latest_bars":256},
              {"series_id":"spot.binance-spot.ETHBTC.ohlcv.4h","latest_bars":256},
              {"series_id":"spot.binance-spot.ETHBTC.ohlcv.1d","latest_bars":256},
              {"series_id":"spot.binance-spot.ETHBTC.ohlcv.1w","latest_bars":256}
            ],
            "required_domains":["SPOT","DERIVATIVES","OPTIONS","LIQUIDITY","ANALYTICS","EVENTS"],
            "max_generation_age_seconds":600,
            "current_policy":"FINALIZED_ONLY"
          }
          JSON
          python tools/current_data_transport.py parse-request \
            --request-file .current-data-work/real-request.json \
            --output .current-data-work/request.json
      - name: Prove pre-repair persisted EVENTS needs canonical acquisition
        shell: bash
        run: |
          set -euo pipefail
          python tools/current_data_transport.py evaluate-freshness \
            --request .current-data-work/request.json \
            --output .current-data-work/freshness.json
          python - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path('.current-data-work/freshness.json').read_text())
          assert result['acquisition_required'] is True
          assert 'NO_GENERATION_TIME:domain:EVENTS' in result['reasons']
          print('EVENTS_PRE_ACQUISITION_MISSING_GENERATION=PROVEN')
          PY
      - name: Acquire exactly one generation through existing canonical collector
        run: python src/collector.py
      - name: Run complete approved validation contour
        run: |
          python -m compileall -q src tools tests
          python tools/validation/validate.py
          python tools/validation/validate_v4.py
          python tools/validation/validate_history.py
          python tools/validation/consumer_proof.py
          python tools/validation/validate_repository.py
          python tools/validation/validate_d9_contracts.py
          python tools/validation/validate_d9_resolution_v2.py
          python tools/capability_index.py validate
          python -m unittest discover -s tests/deep_history -p 'test_*.py' -v
      - name: Materialize exact 18 requested finalized series
        id: cutoff
        shell: bash
        run: |
          set -euo pipefail
          cutoff="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "utc=$cutoff" >> "$GITHUB_OUTPUT"
          python tools/current_data_transport.py materialize-series \
            --request .current-data-work/request.json \
            --cutoff "$cutoff" \
            --output-root .current-data-output
      - name: Build and validate all six semantic domain resources
        shell: bash
        run: |
          set -euo pipefail
          python tools/current_data_transport.py build-resource-index \
            --request .current-data-work/request.json \
            --output-root .current-data-output
          python tools/current_data_transport.py validate-generation \
            --request .current-data-work/request.json \
            --output-root .current-data-output
          python - <<'PY'
          import json
          from pathlib import Path
          index=json.loads(Path('.current-data-output/resource-index.json').read_text())
          rows={row['domain_id']:row for row in index['domains']}
          assert set(rows)=={'SPOT','DERIVATIVES','OPTIONS','LIQUIDITY','ANALYTICS','EVENTS'}
          events=rows['EVENTS']
          event_manifest=json.loads(Path('events/manifest.json').read_text())
          data_manifest=json.loads(Path('data/manifest.json').read_text())
          assert event_manifest['event_count']==0
          assert event_manifest['latest_event'] is None
          assert event_manifest['events']==[]
          assert events['status']=='PASS'
          assert events['freshness']=='FRESH'
          assert events['generated_at_utc']==event_manifest['generated_at_utc']==data_manifest['generated_at_utc']
          print('EVENTS_RESOURCE_INDEX=PASS')
          print('EVENTS_GENERATION_MATCHES_COLLECTION_ANCHOR=PASS')
          print('DOMAIN_GENERATION_TIME_MISSING=ABSENT')
          PY
      - name: Prove no remote repository mutation
        id: boundary
        shell: bash
        run: |
          set -euo pipefail
          head_after="$(git rev-parse HEAD)"
          test "$head_after" = "${{ steps.control.outputs.head }}"
          echo "head_after=$head_after" >> "$GITHUB_OUTPUT"
          echo "HEAD_BEFORE_EQUALS_HEAD_AFTER=YES"
          echo "REMOTE_REPOSITORY_MUTATION=NO"
      - name: Build canonical generation receipt
        id: receipt
        shell: bash
        run: |
          set -euo pipefail
          known_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          python tools/current_data_transport.py build-receipt \
            --request .current-data-work/request.json \
            --output-root .current-data-output \
            --control-plane-head "${{ steps.control.outputs.head }}" \
            --control-plane-tree "${{ steps.control.outputs.tree }}" \
            --head-after "${{ steps.boundary.outputs.head_after }}" \
            --generation-mode FRESH_ACQUISITION \
            --known-at-utc "$known_at" \
            --run-id "${{ github.run_id }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --artifact-name "events-fresh-current-real-${{ github.run_id }}" \
            --github-output "$GITHUB_OUTPUT"
      - name: Validate unchanged durability promotion semantics
        run: |
          python tools/current_data_promotion.py build-handoff \
            --request .current-data-work/request.json \
            --output-root .current-data-output \
            --repository-root .
          python tools/current_data_promotion.py validate-artifact \
            --artifact-root .current-data-output \
            --source-control-root .
      - name: Upload real acceptance evidence
        uses: actions/upload-artifact@v4
        with:
          name: events-fresh-current-real-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: true
          path: .current-data-output/**
      - name: Emit exact acceptance proof
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          request=json.loads(Path('.current-data-work/request.json').read_text())['request']
          generation=json.loads(Path('.current-data-output/current-generation.json').read_text())
          index=json.loads(Path('.current-data-output/resource-index.json').read_text())
          domains=sorted(row['domain_id'] for row in index['domains'])
          assert len(request['required_series'])==18
          assert domains==['ANALYTICS','DERIVATIVES','EVENTS','LIQUIDITY','OPTIONS','SPOT']
          assert generation['on_demand_current_data_can_be_used_for_live_analysis'] is True
          print('CURRENT_DATA_AGENT_REQUEST=PASS')
          print('VALIDATION=PASS')
          print('CURRENT_ANALYSIS_ALLOWED=YES')
          print('REQUIRED_SERIES_COUNT=18')
          print('REQUIRED_DOMAINS=' + ','.join(domains))
          print('RESOURCE_INDEX_INCLUDES_EVENTS=YES')
          print('EVENTS_RESOURCE_INDEX=PASS')
          print('DOMAIN_GENERATION_TIME_MISSING=ABSENT')
          print('REMOTE_REPOSITORY_MUTATION=NO')
          print('GENERATION_ID=' + generation['generation_id'])
          PY
