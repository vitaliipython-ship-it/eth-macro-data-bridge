name: Current data invocation hardening runner

on:
  push:
    branches:
      - agent/current-data/invocation-contract-hardening-v1
    paths:
      - .tmp/apply_current_data_invocation_hardening.py
      - .github/workflows/current-data-invocation-hardening-runner.yml

permissions:
  contents: write

env:
  PYTHONPATH: src:tools/deep_history:tools

jobs:
  apply-validate-publish:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact hardening branch
        uses: actions/checkout@v6
        with:
          ref: agent/current-data/invocation-contract-hardening-v1
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Apply bounded invocation hardening
        run: python .tmp/apply_current_data_invocation_hardening.py
      - name: Validate invocation contract regressions
        run: |
          python -m unittest discover -s tests/deep_history -p 'test_current_data_invocation_contract.py' -v
          python -m unittest discover -s tests/deep_history -p 'test_current_data_transport.py' -v
          python -m compileall -q src tools tests
          python tools/validation/validate_repository.py
          python tools/validation/validate_d9_contracts.py
      - name: Publish non-workflow source repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- AGENTS.md bridge-contract.json docs/semantics/fresh-current-agent-transport-v1.md tools/current_data_transport.py tests/deep_history/test_current_data_invocation_contract.py
          git diff --cached --check
          git commit -m "Harden fresh-current invocation contract"
          git push origin HEAD:agent/current-data/invocation-contract-hardening-v1
