          grep -q 'decoded payload SHA-256 differs' "$C7_TEMP_ROOT/nc06.json"
          echo 'NC06=PASS'

          if docker exec "$C7_CONTAINER_B" grep -Eiq 'binance|kraken|deribit|provider[_ -]?specific' /app/server/runtime/c7_carrier.py; then
            echo 'NC07 provider-specific carrier content detected' >&2; exit 1
          fi
          echo 'NC07=PASS'

          ACTUAL_REVISION="$(docker image inspect "$C7_IMAGE_DIGEST" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')"
          check_image_revision() { [[ "$ACTUAL_REVISION" == "$1" ]]; }
          check_image_revision "$QUALIFIED_CHECKOUT_SHA"
          if check_image_revision "0000000000000000000000000000000000000000"; then
            echo 'NC08 wrong expected image revision was accepted' >&2; exit 1
          fi
          echo 'NC08=PASS'

          python - <<'PY'
          import json,os
          from pathlib import Path
          c=json.loads((Path(os.environ['C7_EVIDENCE_ROOT'])/'container-b.json').read_text())[0]
          destinations=sorted(m['Destination'] for m in c['Mounts'])
          assert destinations==['/qualification-inputs','/var/lib/aife/control','/var/lib/aife/data'],destinations
          assert c['HostConfig']['NetworkMode']=='none'
          assert c['HostConfig']['ReadonlyRootfs'] is True
          assert '/tmp' in c['HostConfig']['Tmpfs']
          print('NC09=PASS')
          image=json.loads((Path(os.environ['C7_EVIDENCE_ROOT'])/'image.json').read_text())[0]
          cfg=image['Config']
          assert cfg['Entrypoint']==['python','-m','server.runtime.c7_carrier']
          assert cfg['Cmd']==['serve']
          print('NC10=PASS')
          PY

          expected="$(printf '%s\n' \
            $'M\t.github/workflows/qualify-d8-runtime.yml' \
            $'A\tAIFE/staging/server/Dockerfile.c7' \
            $'A\tAIFE/staging/server/runtime/c7_carrier.py' | sort)"
          actual="$(git diff --name-status b645d34a992c0fc88d8cb09aed6fa6913c5190ad HEAD | sort)"
          test "$actual" = "$expected"
          bad_actual="$(printf '%s\n%s\n' "$actual" $'A\tAIFE/staging/server/forbidden-fourth-path' | sort)"
          test "$bad_actual" != "$expected"
          echo 'NC11=PASS'

          python - <<'PY'
          import json,os
          from pathlib import Path
          value={f'NC{i:02d}':'PASS' for i in range(1,12)}
          (Path(os.environ['C7_EVIDENCE_ROOT'])/'negative-controls.json').write_text(json.dumps(value,sort_keys=True,separators=(',',':'))+'\n')
          PY
          echo 'NC01_NC11=11/11_PASS'

      - name: Verify F5C C7 P01-P20 proof matrix and evidence
        if: env.C7_EXACT == 'YES'
        shell: bash
        run: |
          set -euo pipefail
          export C7_CONTAINER_A_ID C7_CONTAINER_B_ID C7_SOURCE_A_WORK_ID C7_SOURCE_B_WORK_ID C7_IMAGE_DIGEST
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          e=Path(os.environ['C7_EVIDENCE_ROOT'])
          authority=json.loads((e/'authority.json').read_text())
          image=json.loads((e/'image.json').read_text())[0]
          a1=json.loads((e/'source-a-first.json').read_text())
          ar1=json.loads((e/'source-a-readback-a.json').read_text())
          ar2=json.loads((e/'source-a-readback-b.json').read_text())
          replay=json.loads((e/'source-a-replay.json').read_text())
          b=json.loads((e/'source-b.json').read_text())
          br=json.loads((e/'source-b-readback.json').read_text())
          before=json.loads((e/'state-before-restart.json').read_text())
          after=json.loads((e/'state-after-restart.json').read_text())
          neg=json.loads((e/'negative-controls.json').read_text())
          cfg=image['Config']; labels=cfg['Labels']
          proofs={
            'P01': authority['qualified_checkout_sha']==os.environ['QUALIFIED_CHECKOUT_SHA'],
            'P02': authority['qualified_checkout_tree']==os.environ['QUALIFIED_CHECKOUT_TREE'],
            'P03': authority['parent']=='b645d34a992c0fc88d8cb09aed6fa6913c5190ad',
            'P04': authority['C6_EXACT']=='NO' and authority['C7_EXACT']=='YES',
            'P05': image['Id']==os.environ['C7_IMAGE_DIGEST'],
            'P06': labels['org.opencontainers.image.revision']==os.environ['QUALIFIED_CHECKOUT_SHA'],
            'P07': labels['io.aife.f5c.source-tree']==os.environ['QUALIFIED_CHECKOUT_TREE'],
            'P08': labels['io.aife.f5c.qualification-profile']=='C7',
            'P09': cfg['User']=='10001:10001',
            'P10': cfg['Entrypoint']==['python','-m','server.runtime.c7_carrier'] and cfg['Cmd']==['serve'],
            'P11': json.load(open(Path(os.environ['C7_TEMP_ROOT'])/'readiness-a.json'))['status']=='PASS',
            'P12': a1['status']=='PASS' and a1['content_identity']=='0f9f5ce47831e099e77e295ed8bb627f089efa8672ee6fbdc49eac6f0d7f5275',
            'P13': ar1['work_id']==a1['work_id'] and ar1['payload_base64']=='c291cmNlLWE=',
            'P14': before['work_count']==1 and before['object_count']==1,
            'P15': os.environ['C7_CONTAINER_A_ID']!=os.environ['C7_CONTAINER_B_ID'],
            'P16': json.load(open(Path(os.environ['C7_TEMP_ROOT'])/'readiness-b.json'))['status']=='PASS',
            'P17': after['pre_replay']==before,
            'P18': replay['work_id']==a1['work_id']==ar2['work_id'] and replay['object_digest']==a1['object_digest'],
            'P19': b['status']=='PASS' and br['work_id']==b['work_id'] and b['payload_base64']==br['payload_base64']=='c291cmNlLWI=',
            'P20': after['final']['work_count']==2 and after['final']['object_count']==2 and all(v=='PASS' for v in neg.values()),
          }
          failed=[k for k,v in proofs.items() if not v]
          assert not failed,failed
          (e/'positive-proofs.json').write_text(json.dumps({k:'PASS' for k in proofs},sort_keys=True,separators=(',',':'))+'\n')
          required=['authority.json','image.json','source-a-first.json','source-a-readback-a.json','container-a.json','state-before-restart.json','container-b.json','source-a-readback-b.json','source-a-replay.json','source-b.json','state-after-restart.json','negative-controls.json','positive-proofs.json','source-b-readback.json','container-a.log','container-b.log']
          for name in required: assert (e/name).is_file(),name
          print('P01_P20=20/20_PASS')
          print('NC01_NC11=11/11_PASS')
          print('PHYSICAL_RESTART=PASS')
          print('SOURCE_A_REPLAY=PASS')
          print('SOURCE_B_GENERICITY=PASS')
          print('NO_NEW_STORAGE_AUTHORITY=PASS')
          print('C7_EXACT_SHA_BINDING=PASS')
          PY
          (cd "$C7_EVIDENCE_ROOT" && sha256sum $(find . -maxdepth 1 -type f ! -name sha256sums.txt -printf '%f\n' | sort) > sha256sums.txt)
          (cd "$C7_EVIDENCE_ROOT" && sha256sum -c sha256sums.txt)
          echo 'SHA256SUMS=PASS'

      - name: Upload F5C C7 qualification evidence
        if: always() && env.C7_EXACT == 'YES'
        uses: actions/upload-artifact@v4
        with:
          name: f5c-c7-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ env.C7_EVIDENCE_ROOT }}
          if-no-files-found: error
          retention-days: 30

      - name: Cleanup F5C C7 containers
        if: always() && env.C7_EXACT == 'YES'
        shell: bash
        run: |
          docker rm -f "$C7_CONTAINER_A" "$C7_CONTAINER_B" >/dev/null 2>&1 || true
          echo 'C7_CONTAINER_CLEANUP=PASS'

      - name: Build D8 OCI-compatible image
        if: env.C6_SOURCE_QUALIFICATION != 'YES' && env.C7_EXACT != 'YES'
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="eth-macro-d8:${QUALIFIED_CHECKOUT_SHA}"
          docker build -f tools/d8/Dockerfile -t "$IMAGE" .
          DIGEST="$(docker image inspect "$IMAGE" --format '{{.Id}}')"
          test -n "$DIGEST"
          printf 'QUALIFIED_CONTAINER_IMAGE_REF=%s\n' "$IMAGE" >> "$GITHUB_ENV"
          printf 'QUALIFIED_CONTAINER_IMAGE_DIGEST=%s\n' "$DIGEST" >> "$GITHUB_ENV"
          echo "CONTAINER_BUILD=PASS"
          echo "CONTAINER_IMAGE_REF=$IMAGE"
          echo "QUALIFIED_CONTAINER_IMAGE_REF=$IMAGE"
          echo "QUALIFIED_CONTAINER_IMAGE_DIGEST=$DIGEST"
          uid=$(docker run --rm --entrypoint id "$IMAGE" -u)
          test "$uid" = "10001"
          echo "CONTAINER_NON_ROOT=PASS"

      - name: Qualify persistent container restart and same-slot replay
        if: env.C6_SOURCE_QUALIFICATION != 'YES' && env.C7_EXACT != 'YES'
        shell: bash
        run: |
          set -euo pipefail
          TOKEN='d8-ci-fixture-token'
          VOLUME='d8-ci-state'
          IMAGE="$QUALIFIED_CONTAINER_IMAGE_REF"
          ACTUAL_IMAGE_DIGEST="$(docker image inspect "$IMAGE" --format '{{.Id}}')"
          test "$ACTUAL_IMAGE_DIGEST" = "$QUALIFIED_CONTAINER_IMAGE_DIGEST"
          cleanup() { docker rm -f d8-ci-1 d8-ci-2 >/dev/null 2>&1 || true; docker volume rm "$VOLUME" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker volume create "$VOLUME" >/dev/null
          start_container() {
            local name="$1"
            docker run -d --name "$name" -p 127.0.0.1:18080:8080 \
              -v "$VOLUME":/var/lib/eth-macro-data-bridge \
              -e D8_RUNTIME_PROFILE=test \
              -e D8_PROVIDER_MODE=mock \
              -e D8_RUNTIME_TOKEN="$TOKEN" \
              -e D8_SOURCE_REVISION="$QUALIFIED_CHECKOUT_SHA" \
              "$IMAGE" >/dev/null
            for _ in $(seq 1 60); do
              if curl -fsS -H "Authorization: Bearer $TOKEN" http://127.0.0.1:18080/v1/readiness > readiness.json; then return 0; fi
              sleep 1
            done
            docker logs "$name"
            return 1
          }
          start_container d8-ci-1
          runtime_source="$(docker exec d8-ci-1 python -c 'from d8_runtime import config_from_env; print(config_from_env().source_revision)')"
          test "$runtime_source" = "$QUALIFIED_CHECKOUT_SHA"
          echo "D8_SOURCE_REVISION_USED=$runtime_source"
          echo "CONTAINER_SOURCE_BINDING=PASS"
          slot=$(python - <<'PY'
          from datetime import datetime,timezone
          d=datetime.now(timezone.utc).replace(second=0,microsecond=0)
          d=d.replace(minute=(d.minute//5)*5)
          print(d.isoformat().replace('+00:00','Z'))
          PY
          )
          python - "$slot" > request.json <<'PY'
          import json,sys
          print(json.dumps({'schema_version':'eth-macro-d8-collect-cycle-request/1.0.0','expected_schedule_at':sys.argv[1],'canonical_slot':'M5','trace_id':'ci'}))
          PY
          curl -fsS -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' --data @request.json http://127.0.0.1:18080/v1/collect-cycle > first.json
          python - <<'PY'
          import json
          r=json.load(open('first.json'))
          assert r['overall_status']=='PASS', r
          assert r['hot_promotion']=='PROMOTED', r
          assert r['collection_gap_summary']['synthetic_fill'] is False
          print('FIRST_CYCLE_ID='+r['cycle_id'])
          PY
          echo "CONTAINER_MEMORY_FIRST=$(docker stats --no-stream --format '{{.MemUsage}}' d8-ci-1)"
          first_id=$(python -c "import json; print(json.load(open('first.json'))['cycle_id'])")
          persisted_source="$(docker exec d8-ci-1 python -c 'import sqlite3,sys; db=sqlite3.connect("/var/lib/eth-macro-data-bridge/d8-runtime.sqlite3"); row=db.execute("SELECT source_revision FROM cycles WHERE cycle_id=?",(sys.argv[1],)).fetchone(); print(row[0] if row else "")' "$first_id")"
          test "$persisted_source" = "$QUALIFIED_CHECKOUT_SHA"
          echo "D8_PERSISTED_CYCLE_SOURCE_REVISION=$persisted_source"
          echo "D8_PERSISTED_SOURCE_BINDING=PASS"
          docker stop -t 10 d8-ci-1 >/dev/null
          docker rm d8-ci-1 >/dev/null
          start_container d8-ci-2
          restart_source="$(docker exec d8-ci-2 python -c 'from d8_runtime import config_from_env; print(config_from_env().source_revision)')"
          test "$restart_source" = "$QUALIFIED_CHECKOUT_SHA"
          curl -fsS -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' --data @request.json http://127.0.0.1:18080/v1/collect-cycle > replay.json
          curl -fsS -H "Authorization: Bearer $TOKEN" http://127.0.0.1:18080/v1/readiness > readiness-after.json
          python - "$first_id" <<'PY'
          import json,sys
          replay=json.load(open('replay.json')); ready=json.load(open('readiness-after.json'))
          assert replay['cycle_id']==sys.argv[1]
          assert replay['overall_status']=='PASS'
          assert replay['replayed'] is True
          assert ready['hot_cycle_id']==sys.argv[1]
          assert ready['spool_rows'] > 0
          assert ready['ledger_rows'] > 0
          print('CONTAINER_RESTART=PASS')
          print('CONTAINER_SAME_SLOT_REPLAY=PASS')
          print('CONTAINER_HOT_RETAINED=PASS')
          print('CONTAINER_SPOOL_RETAINED=PASS')
          print('CONTAINER_LEDGER_RETAINED=PASS')
          PY
          echo "CONTAINER_IMAGE_REF=$IMAGE"
          echo "QUALIFIED_CONTAINER_IMAGE_DIGEST=$QUALIFIED_CONTAINER_IMAGE_DIGEST"
          echo "CONTAINER_SOURCE_BINDING=PASS"
          echo "CONTAINER_MEMORY_RESTART=$(docker stats --no-stream --format '{{.MemUsage}}' d8-ci-2)"
          echo "CONTAINER_RUNTIME_TEST=PASS"
