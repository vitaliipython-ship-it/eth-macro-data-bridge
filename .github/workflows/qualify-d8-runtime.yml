name: Qualify D8 VPS runtime candidate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "AGENTS.md"
      - "contracts/d8-runtime-candidate.json"
      - "docs/semantics/d8-vps-unified-acquisition-runtime-v1.md"
      - "docs/semantics/d8-production-capability-parity-expansion-and-cutover-v1.md"
      - "docs/handoffs/d8-vps-runtime-integration-handoff-v1.md"
      - "tools/d8/Dockerfile"
      - "src/d8_runtime.py"
      - "src/d8_service.py"
      - "src/acquisition_core.py"
      - "src/d8_observation_normalizer.py"
      - "src/aife_server_adapter.py"
      - "src/aife_f5c_acquisition_adapter.py"
      - "tests/d8/**"
      - "AIFE/staging/server/acquisition/**"
      - "AIFE/staging/server/integration/bindings.py"
      - "AIFE/staging/server/runtime/composition.py"
      - "AIFE/staging/server/runtime/deployment.py"
      - "AIFE/staging/tests/integration/server/test_f5_permissions_and_deployment.py"
      - "AIFE/staging/tests/integration/server/test_f5c_acquisition_durable_acceptance.py"
      - "AIFE/staging/tests/integration/server/test_f5c_acquisition_extensibility.py"
      - "AIFE/staging/tests/integration/server/test_f5_vertical_slice.py"
      - "AIFE/staging/tests/integration/server/test_f5_publication_integrity.py"
      - "AIFE/staging/tests/integration/server/test_f5_publication_recovery.py"
      - "AIFE/staging/tests/integration/server/test_f5_sqlite_control.py"
      - ".github/workflows/qualify-d8-runtime.yml"
      - "bridge-contract.json"
      - "tools/history_consumer.py"
      - "tools/history_access_v2.py"
      - "tools/history_issue_request.py"
      - "tools/validation/validate_research_semantic_receipt_compat.py"
      - "tools/validation/validate_r2_p1_auth_scope_authority.py"
      - "tests/deep_history/test_history_consumer.py"
      - "tests/deep_history/test_history_issue_request.py"
      - "tests/deep_history/test_semantic_receipt_contract.py"
      - "tests/deep_history/test_release_publisher.py"
      - "tests/fixtures/research-d9-5/market-data-ref.schema.json"
      - ".github/workflows/history-consumer-read.yml"
  push:
    paths:
      - "AGENTS.md"
      - "contracts/d8-runtime-candidate.json"
      - "docs/semantics/d8-vps-unified-acquisition-runtime-v1.md"
      - "docs/semantics/d8-production-capability-parity-expansion-and-cutover-v1.md"
      - "docs/handoffs/d8-vps-runtime-integration-handoff-v1.md"
      - "tools/d8/Dockerfile"
      - "src/d8_runtime.py"
      - "src/d8_service.py"
      - "src/acquisition_core.py"
      - "src/d8_observation_normalizer.py"
      - "src/aife_server_adapter.py"
      - "src/aife_f5c_acquisition_adapter.py"
      - "tests/d8/**"
      - "AIFE/staging/server/acquisition/**"
      - "AIFE/staging/server/integration/bindings.py"
      - "AIFE/staging/server/runtime/composition.py"
      - "AIFE/staging/server/runtime/deployment.py"
      - "AIFE/staging/tests/integration/server/test_f5_permissions_and_deployment.py"
      - "AIFE/staging/tests/integration/server/test_f5c_acquisition_durable_acceptance.py"
      - "AIFE/staging/tests/integration/server/test_f5c_acquisition_extensibility.py"
      - "AIFE/staging/tests/integration/server/test_f5_vertical_slice.py"
      - "AIFE/staging/tests/integration/server/test_f5_publication_integrity.py"
      - "AIFE/staging/tests/integration/server/test_f5_publication_recovery.py"
      - "AIFE/staging/tests/integration/server/test_f5_sqlite_control.py"
      - ".github/workflows/qualify-d8-runtime.yml"
      - "bridge-contract.json"
      - "tools/history_consumer.py"
      - "tools/history_access_v2.py"
      - "tools/history_issue_request.py"
      - "tools/validation/validate_research_semantic_receipt_compat.py"
      - "tools/validation/validate_r2_p1_auth_scope_authority.py"
      - "tests/deep_history/test_history_consumer.py"
      - "tests/deep_history/test_history_issue_request.py"
      - "tests/deep_history/test_semantic_receipt_contract.py"
      - "tests/deep_history/test_release_publisher.py"
      - "tests/fixtures/research-d9-5/market-data-ref.schema.json"
      - ".github/workflows/history-consumer-read.yml"

permissions:
  contents: read

concurrency:
  group: eth-macro-d8-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-and-container:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: .:src:tools:tools/deep_history:AIFE/staging
    steps:
      - name: Checkout exact current ref
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Prove C6 additive history objects available
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e 9564082c20030a9d2f4c9b4556a26101f22b46ff^{commit}
          git cat-file -e 971424a04187b2442d7b49ec07dadadd8e432e00^{commit}
          git cat-file -e 803f6bac33edd8315693d8ff4065965c9d03c464^{commit}
          echo "C6_FROZEN_BASE_OBJECT_AVAILABLE=PASS"
          echo "C6_INITIAL_SOURCE_OBJECT_AVAILABLE=PASS"
          echo "C6_FIRST_REPAIR_OBJECT_AVAILABLE=PASS"

      - name: Bind qualification provenance to exact checkout
        shell: bash
        env:
          PR_BASE_SHA_FROM_EVENT: ${{ github.event.pull_request.base.sha || '' }}
          PR_HEAD_SHA_FROM_EVENT: ${{ github.event.pull_request.head.sha || '' }}
        run: |
          set -euo pipefail
          QUALIFIED_CHECKOUT_SHA="$(git rev-parse HEAD)"
          QUALIFIED_CHECKOUT_TREE="$(git rev-parse 'HEAD^{tree}')"
          test -n "$QUALIFIED_CHECKOUT_SHA"
          test -n "$QUALIFIED_CHECKOUT_TREE"
          ACTUAL="$(git rev-parse HEAD)"
          test "$ACTUAL" = "$QUALIFIED_CHECKOUT_SHA"

          PR_HEAD_SHA="${PR_HEAD_SHA_FROM_EVENT:-$GITHUB_SHA}"
          RESEARCH_BRIDGE_HEAD_SHA="${PR_HEAD_SHA_FROM_EVENT:-$GITHUB_SHA}"
          test -n "$PR_HEAD_SHA"
          test -n "$RESEARCH_BRIDGE_HEAD_SHA"

          printf 'QUALIFIED_CHECKOUT_SHA=%s\n' "$QUALIFIED_CHECKOUT_SHA" >> "$GITHUB_ENV"
          printf 'QUALIFIED_CHECKOUT_TREE=%s\n' "$QUALIFIED_CHECKOUT_TREE" >> "$GITHUB_ENV"
          printf 'PR_HEAD_SHA=%s\n' "$PR_HEAD_SHA" >> "$GITHUB_ENV"
          printf 'RESEARCH_BRIDGE_HEAD_SHA=%s\n' "$RESEARCH_BRIDGE_HEAD_SHA" >> "$GITHUB_ENV"

          printf 'GITHUB_EVENT_NAME=%s\n' "$GITHUB_EVENT_NAME"
          printf 'GITHUB_REF=%s\n' "$GITHUB_REF"
          printf 'GITHUB_EVENT_SHA=%s\n' "$GITHUB_SHA"
          printf 'PR_HEAD_SHA=%s\n' "$PR_HEAD_SHA"
          printf 'QUALIFIED_CHECKOUT_SHA=%s\n' "$QUALIFIED_CHECKOUT_SHA"
          printf 'QUALIFIED_CHECKOUT_TREE=%s\n' "$QUALIFIED_CHECKOUT_TREE"
          printf 'ACTUAL_GIT_HEAD=%s\n' "$ACTUAL"

          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            read -r -a parents <<< "$(git show -s --format=%P HEAD)"
            test "${#parents[@]}" -eq 2
            test "${parents[0]}" = "$PR_BASE_SHA_FROM_EVENT"
            test "${parents[1]}" = "$PR_HEAD_SHA_FROM_EVENT"
            echo "PR_BASE_SHA=$PR_BASE_SHA_FROM_EVENT"
            echo "PR_HEAD_SHA=$PR_HEAD_SHA_FROM_EVENT"
            echo "PARENT_1=${parents[0]}"
            echo "PARENT_2=${parents[1]}"
            echo "PR_EFFECTIVE_INTEGRATION_BINDING=PASS"
          else
            echo "PR_EFFECTIVE_INTEGRATION_BINDING=N/A"
          fi

          echo "ACTUAL_GIT_HEAD_MATCH=PASS"
          echo "ACTUAL_CHECKOUT_SHA_MATCH=PASS"
          echo "PHYSICAL_IDENTITY_PROOF=PASS"
          echo "QUALIFIED_CHECKOUT_SHA_ROLE=TESTED_BYTES"
          echo "PR_HEAD_SHA_ROLE=LOGICAL_PR_HEAD_OR_NON_PR_EVENT_SOURCE_FALLBACK"
          echo "GITHUB_SHA_ROLE=EVENT_IDENTITY_AND_TESTED_BYTES_AUTHORITY"

      - name: Classify exact F5C C6 or C7 qualification
        shell: bash
        run: |
          set -euo pipefail
          C6_FROZEN_BASE_HEAD="9564082c20030a9d2f4c9b4556a26101f22b46ff"
          C6_INITIAL_SOURCE_HEAD="971424a04187b2442d7b49ec07dadadd8e432e00"
          C6_FIRST_REPAIR_HEAD="803f6bac33edd8315693d8ff4065965c9d03c464"
          C6_ACCEPTED_HEAD="a5a0f7f0ac4fd0ce6fd19d9e14b079fa0d041dc9"
          C6_ACCEPTED_TREE="e6886d8c24e6452a2418e6e22d567d19960cd8a9"
          C7_PARENT="b645d34a992c0fc88d8cb09aed6fa6913c5190ad"
          C7_BRANCH_REF="refs/heads/agent/aife/server-data-foundation-wip"
          C6_EXACT=NO
          C7_EXACT=NO

          if [[ "$GITHUB_EVENT_NAME" == "push" \
                && "$(git rev-parse HEAD)" == "$C6_ACCEPTED_HEAD" \
                && "$(git rev-parse 'HEAD^{tree}')" == "$C6_ACCEPTED_TREE" ]]; then
            git merge-base --is-ancestor "$C6_FROZEN_BASE_HEAD" HEAD
            git merge-base --is-ancestor "$C6_INITIAL_SOURCE_HEAD" HEAD
            git merge-base --is-ancestor "$C6_FIRST_REPAIR_HEAD" HEAD
            test "$(git rev-parse HEAD^)" = "$C6_FIRST_REPAIR_HEAD"
            git diff --quiet "$C6_INITIAL_SOURCE_HEAD" HEAD -- AIFE/staging/server/runtime/deployment.py
            git diff --quiet "$C6_INITIAL_SOURCE_HEAD" HEAD -- AIFE/staging/tests/integration/server/test_f5_permissions_and_deployment.py
            expected="$(printf '%s\n' \
              '.github/workflows/qualify-d8-runtime.yml' \
              'AIFE/staging/server/runtime/deployment.py' \
              'AIFE/staging/tests/integration/server/test_f5_permissions_and_deployment.py' | sort)"
            actual="$(git diff --name-only "$C6_FROZEN_BASE_HEAD" HEAD | sort)"
            test "$actual" = "$expected"
            C6_EXACT=YES
            echo "C6_FROZEN_BASE_ANCESTRY=PASS"
            echo "C6_INITIAL_SOURCE_ANCESTRY=PASS"
            echo "C6_FIRST_REPAIR_ANCESTRY=PASS"
            echo "C6_SECOND_REPAIR_DIRECT_PARENT=PASS"
            echo "C6_CUMULATIVE_SOURCE_DIFF_BOUNDARY=PASS"
            echo "C6_CUMULATIVE_SOURCE_CHANGED_PATH_COUNT=3"
          elif [[ "$GITHUB_EVENT_NAME" == "push" \
                  && "$GITHUB_REF" == "$C7_BRANCH_REF" \
                  && "$(git rev-parse HEAD^)" == "$C7_PARENT" ]]; then
            expected="$(printf '%s\n' \
              'M\t.github/workflows/qualify-d8-runtime.yml' \
              'A\tAIFE/staging/server/Dockerfile.c7' \
              'A\tAIFE/staging/server/runtime/c7_carrier.py' | sort)"
            actual="$(git diff --name-status "$C7_PARENT" HEAD | sort)"
            test "$actual" = "$expected"
            git diff --quiet "$C6_ACCEPTED_HEAD" HEAD -- AIFE/staging/core
            git diff --quiet "$C6_ACCEPTED_HEAD" HEAD -- AIFE/staging/tests
            server_delta="$(git diff --name-status "$C6_ACCEPTED_HEAD" HEAD -- AIFE/staging/server | sort)"
            expected_server="$(printf '%s\n' \
              'A\tAIFE/staging/server/Dockerfile.c7' \
              'A\tAIFE/staging/server/runtime/c7_carrier.py' | sort)"
            test "$server_delta" = "$expected_server"
            C7_EXACT=YES
            echo "C7_DIRECT_PARENT=PASS"
            echo "C7_EXACT_3PATH_DELTA=PASS"
            echo "C7_CORE_UNCHANGED_FROM_C6=PASS"
            echo "C7_TESTS_UNCHANGED_FROM_C6=PASS"
            echo "C7_SERVER_DELTA_EXACT=PASS"
          fi

          test ! \( "$C6_EXACT" = YES && "$C7_EXACT" = YES \)
          echo "C6_SOURCE_QUALIFICATION=$C6_EXACT" >> "$GITHUB_ENV"
          echo "C6_EXACT=$C6_EXACT" >> "$GITHUB_ENV"
          echo "C7_EXACT=$C7_EXACT" >> "$GITHUB_ENV"
          echo "C6_EXACT=$C6_EXACT"
          echo "C7_EXACT=$C7_EXACT"
          if [[ "$C6_EXACT" = NO && "$C7_EXACT" = NO ]]; then
            echo "F5C_EXACT_CLASSIFICATION=OTHER"
          fi
          echo "C6_C7_MUTUAL_EXCLUSION=PASS"

      - name: Prove planning-only or authorized C6 diff boundary
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only HEAD^1 HEAD^2)"
          printf '%s\n' "$changed"
          if [[ "$C6_SOURCE_QUALIFICATION" == "YES" ]]; then
            allowed='^(\.github/workflows/qualify-d8-runtime\.yml|AIFE/staging/server/runtime/deployment\.py|AIFE/staging/tests/integration/server/test_f5_permissions_and_deployment\.py)$'
            unexpected="$(printf '%s\n' "$changed" | grep -Ev "$allowed" || true)"
            test -z "$unexpected"
            echo "C6_AUTHORIZED_RUNTIME_SOURCE_DIFF=PASS"
            echo "RUNTIME_SOURCE_MUTATION=C6_AUTHORIZED"
            echo "RESEARCH_MUTATION=NO"
          else
            allowed='^(\.github/workflows/qualify-d8-runtime\.yml|docs/semantics/d8-production-capability-parity-expansion-and-cutover-v1\.md|tools/validation/validate_r2_p1_auth_scope_authority\.py)$'
            unexpected="$(printf '%s\n' "$changed" | grep -Ev "$allowed" || true)"
            test -z "$unexpected"
            echo "NO_RUNTIME_SOURCE_DIFF=PASS"
            echo "RUNTIME_SOURCE_MUTATION=NO"
            echo "RESEARCH_MUTATION=NO"
          fi

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install F5 integration test dependency
        run: python -m pip install pytest

      - name: Run F5C F5 integration qualification
        run: |
          python -m pytest -q \
            AIFE/staging/tests/integration/server/test_f5_permissions_and_deployment.py \
            AIFE/staging/tests/integration/server/test_f5c_acquisition_durable_acceptance.py \
            AIFE/staging/tests/integration/server/test_f5c_acquisition_extensibility.py \
            AIFE/staging/tests/integration/server/test_f5_vertical_slice.py \
            AIFE/staging/tests/integration/server/test_f5_publication_integrity.py \
            AIFE/staging/tests/integration/server/test_f5_publication_recovery.py \
            AIFE/staging/tests/integration/server/test_f5_sqlite_control.py
          echo "F5_PERMISSIONS_AND_DEPLOYMENT_TESTS=PASS"
          echo "NEGATIVE_DEPLOYMENT_IDENTITY_PROOFS=PASS"

      - name: Qualify F5C C6 exact Git deployment primitive
        if: env.C6_SOURCE_QUALIFICATION == 'YES'
        shell: bash
        run: |
          set -euo pipefail
          C6_EVIDENCE_PATH="$RUNNER_TEMP/c6-deployment-evidence.json"
          export C6_EVIDENCE_PATH
          printf 'C6_EVIDENCE_PATH=%s\n' "$C6_EVIDENCE_PATH" >> "$GITHUB_ENV"
          echo "C6_EVIDENCE_PATH=$C6_EVIDENCE_PATH"
          python -m server.runtime.deployment qualify \
            --repo-root . \
            --expected-head "$QUALIFIED_CHECKOUT_SHA" \
            --expected-tree "$QUALIFIED_CHECKOUT_TREE" \
            --evidence-output "$C6_EVIDENCE_PATH"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          evidence=json.loads(
              Path(os.environ["C6_EVIDENCE_PATH"]).read_text(encoding="utf-8")
          )
          required={
              'ACTUAL_GIT_HEAD_MATCH':'PASS',
              'ACTUAL_GIT_TREE_MATCH':'PASS',
              'ACTUAL_CHECKOUT_SHA_MATCH':'PASS',
              'PHYSICAL_IDENTITY_PROOF':'PASS',
              'C6_EXECUTABLE_DEPLOYMENT_PRIMITIVE':'PASS',
              'MATERIALIZED_SOURCE_BYTE_IDENTITY':'PASS',
              'IMMUTABLE_RELEASE_MATERIALIZATION':'PASS',
              'RELEASE_IDENTITY':'PASS',
              'RELEASE_GIT_BINDING':'PASS',
              'DEPLOYMENT_MAP_BINDING':'PASS',
              'DEPLOYMENT_RECEIPT_BINDING':'PASS',
              'DEPLOYMENT_RECEIPT_DURABLE_READBACK':'PASS',
              'ATOMIC_RELEASE_ACTIVATION_PROOF':'PASS',
              'F5_READINESS':'PASS',
              'QUALIFICATION_IS_ACTIVATION':'NO',
              'REAL_SERVER_ACTIVATION':'NO',
              'SHADOW_ACTIVATION':'NO',
              'PRODUCTION_ACTIVATION':'NO',
          }
          assert evidence['QUALIFIED_CHECKOUT_SHA'] == __import__('os').environ['QUALIFIED_CHECKOUT_SHA']
          assert evidence['QUALIFIED_CHECKOUT_TREE'] == __import__('os').environ['QUALIFIED_CHECKOUT_TREE']
          assert evidence['MATERIALIZED_PATH_COUNT'] > 0
          for key,value in required.items():
              assert evidence[key] == value, (key,evidence.get(key))
          print('C6_EXACT_SHA_DEPLOYMENT_EVIDENCE=PASS')
          print('F5_READINESS=PASS')
          print('NEGATIVE_DEPLOYMENT_IDENTITY_PROOFS=PASS')
          print('DOCKER_QUALIFICATION=NO')
          print('C7_STARTED=NO')
          PY

      - name: Prove active D6 D9 and legacy GitHub boundaries
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          bridge=json.loads(Path('bridge-contract.json').read_text())
          d8=json.loads(Path('contracts/d8-runtime-candidate.json').read_text())
          assert bridge['semantic_resolution']['resolver']['resolution_plan_schema']=='market-data-resolution-plan/1.0.0'
          assert bridge['disabled_providers']['binance-usdm']['status']=='DISABLED_BY_POLICY'
          assert bridge['disabled_providers']['binance-usdm']['network_calls']==0
          assert bridge['disabled_providers']['binance-usdm']['vps_runtime_status']=='NOT_ACTIVE'
          assert d8['status']=='SOURCE_CANDIDATE_NOT_DEPLOYED'
          assert d8['authority']['d9_active'] is False
          assert d8['authority']['active_default_route']=='D6_RESOLUTION_PLAN_V1'
          assert d8['authority']['provider_authority_transition_allowed'] is False
          workflow=Path('.github/workflows/update-market.yml').read_text()
          assert 'cron: "35 * * * *"' in workflow
          assert '*/5' not in workflow
          assert 'python src/collector.py' in workflow
          print('D6_ACTIVE_ROUTE_COMPATIBILITY=PASS')
          print('D9_SOURCE_COMPATIBILITY=PASS')
          print('EXISTING_GITHUB_PRODUCTION_SCHEDULE_DISABLED=false')
          print('GITHUB_5M_SCHEDULER_CREATED=false')
          print('NO_BINANCE_USDM_GITHUB_NETWORK_CALL=PASS')
          PY

      - name: Prove shared provider family
        run: |
          python - <<'PY'
          import acquisition_core, collector, intelligence
          assert acquisition_core.binance is collector.binance
          assert acquisition_core.kraken is collector.kraken
          assert acquisition_core.collect_binance is intelligence.collect_binance
          assert acquisition_core.collect_kraken is intelligence.collect_kraken
          assert acquisition_core.collect_deribit_perpetual is intelligence.collect_deribit_perpetual
          assert acquisition_core.collect_options is intelligence.collect_options
          assert acquisition_core.collect_liquidity is intelligence.collect_liquidity
          print('SHARED_PROVIDER_LOGIC=PASS')
          print('NO_SECOND_COLLECTOR_FAMILY=PASS')
          PY

      - name: Run targeted stale-window checkpoint and post-D9.5 regressions
        run: |
          python -m unittest tests.d8.test_stale_window_recovery -v
          python -m unittest tests.d8.test_checkpoint_recovery -v
          python -m unittest tests.deep_history.test_history_consumer tests.deep_history.test_history_issue_request tests.deep_history.test_semantic_receipt_contract tests.deep_history.test_d9_public_resolution_v2 -v

      - name: Compile D8 source
        run: python -m compileall -q src tools tests

      - name: Run D8 targeted provider failure concurrency restart tests
        run: python -m unittest discover -s tests/d8 -p 'test_*.py' -v

      - name: Prove C6 repository root ephemeral evidence absent
        if: env.C6_SOURCE_QUALIFICATION == 'YES'
        shell: bash
        run: |
          set -euo pipefail
          test -n "$C6_EVIDENCE_PATH"
          test -f "$C6_EVIDENCE_PATH"
          test ! -e c6-deployment-evidence.json
          echo "C6_REPOSITORY_ROOT_EPHEMERAL_EVIDENCE_ABSENT=PASS"

      - name: Run existing repository gates
        run: |
          python tools/validation/validate_repository.py
          python tools/validation/validate_d9_contracts.py
          python tools/validation/validate.py
          python tools/validation/validate_v4.py
          python tools/validation/validate_history.py
          python tools/validation/consumer_proof.py
          python tools/validation/validate_d9_resolution_v2.py
          python tools/validation/validate_d8_r1_parity.py
          python tools/validation/validate_r2_p1_auth_scope_authority.py
          python tools/capability_index.py validate
          python -m unittest discover -s tests/deep_history -p 'test_*.py' -v

      - name: Qualify D9.5 semantic receipt producer contract
        run: |
          python -m unittest tests.deep_history.test_history_consumer tests.deep_history.test_history_issue_request tests.deep_history.test_semantic_receipt_contract tests.deep_history.test_d9_public_resolution_v2 -v
          python tools/history_consumer.py read \
            --series-id spot.binance-spot.ETHUSDT.ohlcv.5m \
            --from 2026-08-17T14:00:00Z \
            --to 2026-08-17T15:00:00Z \
            --mode strict \
            --current-policy FINALIZED_ONLY \
            --format csv \
            --output candles.csv \
            --plan-output resolution-plan.json \
            --diagnostics-output diagnostics.json \
            --receipt-output receipt.json \
            --semantic-receipt-output semantic-receipt.json
          python - <<'PY2'
          import hashlib,json
          from pathlib import Path
          plan=json.loads(Path('resolution-plan.json').read_text())
          diag=json.loads(Path('diagnostics.json').read_text())
          legacy=json.loads(Path('receipt.json').read_text())
          receipt=json.loads(Path('semantic-receipt.json').read_text())
          assert diag['status']=='PASS'
          assert diag['rows']==diag['expected_rows']==12
          assert diag['gap_count']==0 and diag['duplicates']==0
          assert receipt==legacy['semantic_receipt']
          assert receipt['receipt_schema_version']=='history-access-receipt/2.0.0'
          assert receipt['series_id']=='spot.binance-spot.ETHUSDT.ohlcv.5m'
          assert receipt['request']=={'from_utc':'2026-08-17T14:00:00Z','to_utc':'2026-08-17T15:00:00Z','cutoff_utc':None,'mode':'strict','current_policy':'FINALIZED_ONLY'}
          assert receipt['resolution_plan_sha256']==plan['plan_sha256']==legacy['plan_sha256']
          assert receipt['observation_count']==12
          assert receipt['finality']=='FINALIZED' and receipt['revision_context'] is None
          assert hashlib.sha256(Path('candles.csv').read_bytes()).hexdigest()==legacy['transport_output_sha256']==legacy['output_sha256']
          print('HISTORY_CONSUMER_E2E=PASS')
          print('ROWS=12')
          print('GAPS=0')
          print('DUPLICATES=0')
          print('SEMANTIC_RECEIPT_SCHEMA='+receipt['receipt_schema_version'])
          print('SERIES_ID_MATCH=PASS')
          print('REQUEST_IDENTITY_MATCH=PASS')
          print('PLAN_SHA_MATCH=PASS')
          print('OUTPUT_SHA_MATCH=PASS')
          print('OBSERVATION_COUNT_MATCH=PASS')
          print('FINALITY=FINALIZED')
