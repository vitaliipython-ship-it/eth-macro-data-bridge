name: Qualify D8 VPS runtime candidate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "AGENTS.md"
      - "contracts/d8-runtime-candidate.json"
      - "docs/semantics/d8-vps-unified-acquisition-runtime-v1.md"
      - "docs/semantics/d8-production-capability-parity-expansion-and-cutover-v1.md"
      - "docs/handoffs/d8-vps-runtime-integration-handoff-v1.md"
      - "tools/d8/Dockerfile"
      - "src/d8_runtime.py"
      - "src/d8_service.py"
      - "src/acquisition_core.py"
      - "tests/d8/**"
      - ".github/workflows/qualify-d8-runtime.yml"
      - "bridge-contract.json"
      - "tools/history_consumer.py"
      - "tools/history_access_v2.py"
      - "tools/history_issue_request.py"
      - "tools/validation/validate_research_semantic_receipt_compat.py"
      - "tools/validation/validate_r2_p1_auth_scope_authority.py"
      - "tests/deep_history/test_history_consumer.py"
      - "tests/deep_history/test_history_issue_request.py"
      - "tests/deep_history/test_semantic_receipt_contract.py"
      - "tests/deep_history/test_release_publisher.py"
      - "tests/fixtures/research-d9-5/market-data-ref.schema.json"
      - ".github/workflows/history-consumer-read.yml"
  push:
    paths:
      - "AGENTS.md"
      - "contracts/d8-runtime-candidate.json"
      - "docs/semantics/d8-vps-unified-acquisition-runtime-v1.md"
      - "docs/semantics/d8-production-capability-parity-expansion-and-cutover-v1.md"
      - "docs/handoffs/d8-vps-runtime-integration-handoff-v1.md"
      - "tools/d8/Dockerfile"
      - "src/d8_runtime.py"
      - "src/d8_service.py"
      - "src/acquisition_core.py"
      - "tests/d8/**"
      - ".github/workflows/qualify-d8-runtime.yml"
      - "bridge-contract.json"
      - "tools/history_consumer.py"
      - "tools/history_access_v2.py"
      - "tools/history_issue_request.py"
      - "tools/validation/validate_research_semantic_receipt_compat.py"
      - "tools/validation/validate_r2_p1_auth_scope_authority.py"
      - "tests/deep_history/test_history_consumer.py"
      - "tests/deep_history/test_history_issue_request.py"
      - "tests/deep_history/test_semantic_receipt_contract.py"
      - "tests/deep_history/test_release_publisher.py"
      - "tests/fixtures/research-d9-5/market-data-ref.schema.json"
      - ".github/workflows/history-consumer-read.yml"

permissions:
  contents: read

concurrency:
  group: eth-macro-d8-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-and-container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .:src:tools:tools/deep_history
    steps:
      - name: Checkout exact current ref
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Bind qualification provenance to exact checkout
        shell: bash
        env:
          EVENT_PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          EVENT_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
        run: |
          set -euo pipefail
          QUALIFIED_CHECKOUT_SHA="$(git rev-parse HEAD)"
          QUALIFIED_CHECKOUT_TREE="$(git rev-parse 'HEAD^{tree}')"
          test -n "$QUALIFIED_CHECKOUT_SHA"
          test -n "$QUALIFIED_CHECKOUT_TREE"
          ACTUAL="$(git rev-parse HEAD)"
          test "$ACTUAL" = "$QUALIFIED_CHECKOUT_SHA"
          test "$QUALIFIED_CHECKOUT_SHA" = "$GITHUB_SHA"

          PR_HEAD_SHA="${EVENT_PR_HEAD_SHA:-$GITHUB_SHA}"
          RESEARCH_BRIDGE_HEAD_SHA="${EVENT_PR_HEAD_SHA:-$GITHUB_SHA}"
          test -n "$PR_HEAD_SHA"
          test -n "$RESEARCH_BRIDGE_HEAD_SHA"

          printf 'QUALIFIED_CHECKOUT_SHA=%s\n' "$QUALIFIED_CHECKOUT_SHA" >> "$GITHUB_ENV"
          printf 'QUALIFIED_CHECKOUT_TREE=%s\n' "$QUALIFIED_CHECKOUT_TREE" >> "$GITHUB_ENV"
          printf 'PR_HEAD_SHA=%s\n' "$PR_HEAD_SHA" >> "$GITHUB_ENV"
          printf 'RESEARCH_BRIDGE_HEAD_SHA=%s\n' "$RESEARCH_BRIDGE_HEAD_SHA" >> "$GITHUB_ENV"

          printf 'GITHUB_EVENT_NAME=%s\n' "$GITHUB_EVENT_NAME"
          printf 'GITHUB_REF=%s\n' "$GITHUB_REF"
          printf 'GITHUB_EVENT_SHA=%s\n' "$GITHUB_SHA"
          printf 'PR_HEAD_SHA=%s\n' "$PR_HEAD_SHA"
          printf 'QUALIFIED_CHECKOUT_SHA=%s\n' "$QUALIFIED_CHECKOUT_SHA"
          printf 'QUALIFIED_CHECKOUT_TREE=%s\n' "$QUALIFIED_CHECKOUT_TREE"
          printf 'ACTUAL_GIT_HEAD=%s\n' "$ACTUAL"

          assert_pr_parent_model() {
            local actual_base="$1" actual_head="$2" event_base="$3" event_head="$4"
            test -n "$actual_base"
            test -n "$actual_head"
            test -n "$event_base"
            test -n "$event_head"
            test "$actual_head" = "$event_head"
          }

          assert_pr_parent_model base-a head-a base-a head-a
          echo "SCENARIO_BASE_UNCHANGED=PASS"
          assert_pr_parent_model base-b head-a base-a head-a
          echo "SCENARIO_MOVING_BASE=PASS"
          if assert_pr_parent_model base-a head-a base-a substituted-head; then
            echo "SCENARIO_HEAD_SUBSTITUTION=UNEXPECTED_PASS"
            exit 1
          else
            echo "SCENARIO_HEAD_SUBSTITUTION=FAIL_EXPECTED"
          fi
          echo "NON_PR_BEHAVIOR=PASS"

          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            read -r -a parents <<< "$(git show -s --format=%P HEAD)"
            test "${#parents[@]}" -eq 2
            ACTUAL_TESTED_BASE_SHA="${parents[0]}"
            ACTUAL_TESTED_PR_HEAD_SHA="${parents[1]}"
            test -n "$EVENT_PR_BASE_SHA"
            test -n "$EVENT_PR_HEAD_SHA"
            test "$ACTUAL_TESTED_PR_HEAD_SHA" = "$EVENT_PR_HEAD_SHA"

            echo "SYNTHETIC_PARENT_COUNT=2"
            echo "ACTUAL_TESTED_BASE_SHA=$ACTUAL_TESTED_BASE_SHA"
            echo "EVENT_PR_BASE_SHA=$EVENT_PR_BASE_SHA"
            echo "ACTUAL_TESTED_PR_HEAD_SHA=$ACTUAL_TESTED_PR_HEAD_SHA"
            echo "EVENT_PR_HEAD_SHA=$EVENT_PR_HEAD_SHA"
            if [[ "$ACTUAL_TESTED_BASE_SHA" = "$EVENT_PR_BASE_SHA" ]]; then
              echo "EVENT_BASE_DIFFERS_FROM_ACTUAL_TESTED_BASE=NO"
            else
              echo "EVENT_BASE_DIFFERS_FROM_ACTUAL_TESTED_BASE=YES"
            fi
            echo "ACTUAL_TESTED_PR_HEAD_EQUALS_EVENT_PR_HEAD=PASS"
            echo "PR_EFFECTIVE_INTEGRATION_BINDING=PASS"
            echo "ACTUAL_TESTED_BASE_SHA_ROLE=SYNTHETIC_PARENT1"
            echo "EVENT_PR_BASE_SHA_ROLE=EVENT_METADATA_ONLY"
            echo "ACTUAL_TESTED_PR_HEAD_SHA_ROLE=SYNTHETIC_PARENT2"
            echo "EVENT_PR_HEAD_SHA_ROLE=LOGICAL_PR_HEAD"
          else
            echo "PR_EFFECTIVE_INTEGRATION_BINDING=N/A"
          fi

          echo "ACTUAL_GIT_HEAD_MATCH=PASS"
          echo "ACTUAL_CHECKOUT_SHA_MATCH=PASS"
          echo "PHYSICAL_IDENTITY_PROOF=PASS"
          echo "QUALIFIED_CHECKOUT_SHA_ROLE=TESTED_BYTES"
          echo "PR_HEAD_SHA_ROLE=LOGICAL_PR_HEAD_OR_NON_PR_EVENT_SOURCE_FALLBACK"
          echo "GITHUB_SHA_ROLE=EVENT_IDENTITY_AND_TESTED_BYTES_AUTHORITY"

      - name: Prove planning-only diff boundary
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail

          classify_paths() {
            local input="$1"
            local path count=0 marker=NO unexpected=NO
            while IFS= read -r path; do
              [[ -n "$path" ]] || continue
              ((count+=1))
              case "$path" in
                docs/semantics/d8-production-capability-parity-expansion-and-cutover-v1.md|tools/validation/validate_r2_p1_auth_scope_authority.py)
                  marker=YES
                  ;;
              esac
              case "$path" in
                .github/workflows/qualify-d8-runtime.yml|docs/semantics/d8-production-capability-parity-expansion-and-cutover-v1.md|tools/validation/validate_r2_p1_auth_scope_authority.py)
                  ;;
                *)
                  unexpected=YES
                  ;;
              esac
            done <<< "$input"

            if (( count == 0 )); then
              printf 'INVALID %d %s\n' "$count" "$marker"
            elif [[ "$marker" == YES && "$unexpected" == YES ]]; then
              printf 'FAIL %d %s\n' "$count" "$marker"
            elif [[ "$marker" == YES ]]; then
              printf 'PASS %d %s\n' "$count" "$marker"
            else
              printf 'NOT_APPLICABLE %d %s\n' "$count" "$marker"
            fi
          }

          assert_classification() {
            local name="$1" expected="$2" payload="$3" actual count marker
            read -r actual count marker <<< "$(classify_paths "$payload")"
            test "$actual" = "$expected"
            printf '%s=PASS classification=%s count=%s marker=%s\n' "$name" "$actual" "$count" "$marker"
          }

          assert_classification SHARED_ONLY_CLASSIFICATION_TEST NOT_APPLICABLE $'AGENTS.md\nbridge-contract.json\ntools/history_consumer.py'
          assert_classification RUNTIME_ONLY_CLASSIFICATION_TEST NOT_APPLICABLE $'src/d8_runtime.py\ntests/d8/test_stale_window_recovery.py'
          assert_classification VALID_PLANNING_ONLY_TEST PASS $'docs/semantics/d8-production-capability-parity-expansion-and-cutover-v1.md\ntools/validation/validate_r2_p1_auth_scope_authority.py\n.github/workflows/qualify-d8-runtime.yml'
          assert_classification INVALID_MIXED_PLANNING_TEST FAIL $'docs/semantics/d8-production-capability-parity-expansion-and-cutover-v1.md\nsrc/d8_runtime.py'
          assert_classification WORKFLOW_REPAIR_ONLY_TEST NOT_APPLICABLE '.github/workflows/qualify-d8-runtime.yml'
          assert_classification HISTORICAL_FALSE_RED_REPLAY NOT_APPLICABLE $'.github/workflows/current-data-request.yml\n.github/workflows/update-market.yml\nAGENTS.md\nbridge-contract.json\ndocs/semantics/fresh-current-agent-transport-v1.md\ntools/current_data_transport.py\ntools/current_data_promotion.py\ntools/history_consumer.py\ntests/deep_history/test_current_data_transport.py\ntests/deep_history/test_current_data_promotion.py\ntests/deep_history/test_history_consumer.py'
          assert_classification EMPTY_DIFF_TEST INVALID ''
          echo "D8_SCOPE_CLASSIFIER_SELF_TEST=PASS"

          changed="$(git diff --name-only HEAD^1 HEAD^2)"
          printf '%s\n' "$changed"
          read -r classification changed_count marker_present <<< "$(classify_paths "$changed")"
          echo "D8_CHANGED_PATH_COUNT=$changed_count"
          echo "D8_PLANNING_MARKER_PRESENT=$marker_present"
          echo "D8_PLANNING_ONLY_BOUNDARY=$classification"

          case "$classification" in
            PASS)
              echo "NO_RUNTIME_SOURCE_DIFF=PASS"
              echo "RUNTIME_SOURCE_MUTATION=NO"
              echo "RESEARCH_MUTATION=NO"
              echo "D8_QUALIFICATION_CONTINUES=YES"
              ;;
            NOT_APPLICABLE)
              echo "D8_QUALIFICATION_CONTINUES=YES"
              ;;
            FAIL|INVALID)
              echo "D8_QUALIFICATION_CONTINUES=NO"
              exit 1
              ;;
            *)
              echo "D8_QUALIFICATION_CONTINUES=NO"
              exit 1
              ;;
          esac

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Prove active D6 D9 and legacy GitHub boundaries
        shell: bash
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path
          bridge=json.loads(Path('bridge-contract.json').read_text())
          d8=json.loads(Path('contracts/d8-runtime-candidate.json').read_text())
          assert bridge['semantic_resolution']['resolver']['resolution_plan_schema']=='market-data-resolution-plan/1.0.0'
          assert bridge['disabled_providers']['binance-usdm']['status']=='DISABLED_BY_POLICY'
          assert bridge['disabled_providers']['binance-usdm']['network_calls']==0
          assert bridge['disabled_providers']['binance-usdm']['vps_runtime_status']=='NOT_ACTIVE'
          assert d8['status']=='SOURCE_CANDIDATE_NOT_DEPLOYED'
          assert d8['authority']['d9_active'] is False
          assert d8['authority']['active_default_route']=='D6_RESOLUTION_PLAN_V1'
          assert d8['authority']['provider_authority_transition_allowed'] is False
          workflow=Path('.github/workflows/update-market.yml').read_text()
          assert re.search(r'cron: "[0-5]?\d \* \* \* \*"', workflow)
          assert '*/5' not in workflow
          assert 'python src/collector.py' in workflow
          print('D6_ACTIVE_ROUTE_COMPATIBILITY=PASS')
          print('D9_SOURCE_COMPATIBILITY=PASS')
          print('EXISTING_GITHUB_PRODUCTION_SCHEDULE_DISABLED=false')
          print('GITHUB_5M_SCHEDULER_CREATED=false')
          print('NO_BINANCE_USDM_GITHUB_NETWORK_CALL=PASS')
          PY

      - name: Prove shared provider family
        run: |
          python - <<'PY'
          import acquisition_core, collector, intelligence
          assert acquisition_core.binance is collector.binance
          assert acquisition_core.kraken is collector.kraken
          assert acquisition_core.collect_binance is intelligence.collect_binance
          assert acquisition_core.collect_kraken is intelligence.collect_kraken
          assert acquisition_core.collect_deribit_perpetual is intelligence.collect_deribit_perpetual
          assert acquisition_core.collect_options is intelligence.collect_options
          assert acquisition_core.collect_liquidity is intelligence.collect_liquidity
          print('SHARED_PROVIDER_LOGIC=PASS')
          print('NO_SECOND_COLLECTOR_FAMILY=PASS')
          PY

      - name: Run targeted stale-window checkpoint and post-D9.5 regressions
        run: |
          python -m unittest tests.d8.test_stale_window_recovery -v
          python -m unittest tests.d8.test_checkpoint_recovery -v
          python -m unittest tests.deep_history.test_history_consumer tests.deep_history.test_history_issue_request tests.deep_history.test_semantic_receipt_contract tests.deep_history.test_d9_public_resolution_v2 -v

      - name: Compile D8 source
        run: python -m compileall -q src tools tests

      - name: Run D8 targeted provider failure concurrency restart tests
        run: python -m unittest discover -s tests/d8 -p 'test_*.py' -v

      - name: Run existing repository gates
        run: |
          python tools/validation/validate_repository.py
          python tools/validation/validate_d9_contracts.py
          python tools/validation/validate.py
          python tools/validation/validate_v4.py
          python tools/validation/validate_history.py
          python tools/validation/consumer_proof.py
          python tools/validation/validate_d9_resolution_v2.py
          python tools/validation/validate_d8_r1_parity.py
          python tools/validation/validate_r2_p1_auth_scope_authority.py
          python tools/capability_index.py validate
          python -m unittest discover -s tests/deep_history -p 'test_*.py' -v

      - name: Qualify D9.5 semantic receipt producer contract
        run: |
          python -m unittest tests.deep_history.test_history_consumer tests.deep_history.test_history_issue_request tests.deep_history.test_semantic_receipt_contract tests.deep_history.test_d9_public_resolution_v2 -v
          python tools/history_consumer.py read \
            --series-id spot.binance-spot.ETHUSDT.ohlcv.5m \
            --from 2026-08-17T14:00:00Z \
            --to 2026-08-17T15:00:00Z \
            --mode strict \
            --current-policy FINALIZED_ONLY \
            --format csv \
            --output candles.csv \
            --plan-output resolution-plan.json \
            --diagnostics-output diagnostics.json \
            --receipt-output receipt.json \
            --semantic-receipt-output semantic-receipt.json
          python - <<'PY2'
          import hashlib,json
          from pathlib import Path
          plan=json.loads(Path('resolution-plan.json').read_text())
          diag=json.loads(Path('diagnostics.json').read_text())
          legacy=json.loads(Path('receipt.json').read_text())
          receipt=json.loads(Path('semantic-receipt.json').read_text())
          assert diag['status']=='PASS'
          assert diag['rows']==diag['expected_rows']==12
          assert diag['gap_count']==0 and diag['duplicates']==0
          assert receipt==legacy['semantic_receipt']
          assert receipt['receipt_schema_version']=='history-access-receipt/2.0.0'
          assert receipt['series_id']=='spot.binance-spot.ETHUSDT.ohlcv.5m'
          assert receipt['request']=={'from_utc':'2026-08-17T14:00:00Z','to_utc':'2026-08-17T15:00:00Z','cutoff_utc':None,'mode':'strict','current_policy':'FINALIZED_ONLY'}
          assert receipt['resolution_plan_sha256']==plan['plan_sha256']==legacy['plan_sha256']
          assert receipt['observation_count']==12
          assert receipt['finality']=='FINALIZED' and receipt['revision_context'] is None
          assert hashlib.sha256(Path('candles.csv').read_bytes()).hexdigest()==legacy['transport_output_sha256']==legacy['output_sha256']
          print('HISTORY_CONSUMER_E2E=PASS')
          print('ROWS=12')
          print('GAPS=0')
          print('DUPLICATES=0')
          print('SEMANTIC_RECEIPT_SCHEMA='+receipt['receipt_schema_version'])
          print('SERIES_ID_MATCH=PASS')
          print('REQUEST_IDENTITY_MATCH=PASS')
          print('PLAN_SHA_MATCH=PASS')
          print('OUTPUT_SHA_MATCH=PASS')
          print('OBSERVATION_COUNT_MATCH=PASS')
          print('FINALITY=FINALIZED')
          print('SEMANTIC_OUTPUT_SHA256='+receipt['output_sha256'])
          print('TRANSPORT_OUTPUT_SHA256='+legacy['transport_output_sha256'])
          PY2

      - name: Prove exact pinned Research semantic receipt compatibility
        shell: bash
        run: |
          echo "RESEARCH_BRIDGE_HEAD_IDENTITY_ROLE=LOGICAL_PR_OR_EVENT_SOURCE_HEAD"
          echo "RESEARCH_BRIDGE_HEAD_SHA=$RESEARCH_BRIDGE_HEAD_SHA"
          python tools/validation/validate_research_semantic_receipt_compat.py \
            --receipt semantic-receipt.json \
            --bridge-head "$RESEARCH_BRIDGE_HEAD_SHA"

      - name: Build D8 OCI-compatible image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="eth-macro-d8:${QUALIFIED_CHECKOUT_SHA}"
          docker build -f tools/d8/Dockerfile -t "$IMAGE" .
          DIGEST="$(docker image inspect "$IMAGE" --format '{{.Id}}')"
          test -n "$DIGEST"
          printf 'QUALIFIED_CONTAINER_IMAGE_REF=%s\n' "$IMAGE" >> "$GITHUB_ENV"
          printf 'QUALIFIED_CONTAINER_IMAGE_DIGEST=%s\n' "$DIGEST" >> "$GITHUB_ENV"
          echo "CONTAINER_BUILD=PASS"
          echo "CONTAINER_IMAGE_REF=$IMAGE"
          echo "QUALIFIED_CONTAINER_IMAGE_REF=$IMAGE"
          echo "QUALIFIED_CONTAINER_IMAGE_DIGEST=$DIGEST"
          uid=$(docker run --rm --entrypoint id "$IMAGE" -u)
          test "$uid" = "10001"
          echo "CONTAINER_NON_ROOT=PASS"

      - name: Qualify persistent container restart and same-slot replay
        shell: bash
        run: |
          set -euo pipefail
          TOKEN='d8-ci-fixture-token'
          VOLUME='d8-ci-state'
          IMAGE="$QUALIFIED_CONTAINER_IMAGE_REF"
          ACTUAL_IMAGE_DIGEST="$(docker image inspect "$IMAGE" --format '{{.Id}}')"
          test "$ACTUAL_IMAGE_DIGEST" = "$QUALIFIED_CONTAINER_IMAGE_DIGEST"
          cleanup() { docker rm -f d8-ci-1 d8-ci-2 >/dev/null 2>&1 || true; docker volume rm "$VOLUME" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker volume create "$VOLUME" >/dev/null
          start_container() {
            local name="$1"
            docker run -d --name "$name" -p 127.0.0.1:18080:8080 \
              -v "$VOLUME":/var/lib/eth-macro-data-bridge \
              -e D8_RUNTIME_PROFILE=test \
              -e D8_PROVIDER_MODE=mock \
              -e D8_RUNTIME_TOKEN="$TOKEN" \
              -e D8_SOURCE_REVISION="$QUALIFIED_CHECKOUT_SHA" \
              "$IMAGE" >/dev/null
            for _ in $(seq 1 60); do
              if curl -fsS -H "Authorization: Bearer $TOKEN" http://127.0.0.1:18080/v1/readiness > readiness.json; then return 0; fi
              sleep 1
            done
            docker logs "$name"
            return 1
          }
          start_container d8-ci-1
          runtime_source="$(docker exec d8-ci-1 python -c 'from d8_runtime import config_from_env; print(config_from_env().source_revision)')"
          test "$runtime_source" = "$QUALIFIED_CHECKOUT_SHA"
          echo "D8_SOURCE_REVISION_USED=$runtime_source"
          echo "CONTAINER_SOURCE_BINDING=PASS"
          slot=$(python - <<'PY'
          from datetime import datetime,timezone
          d=datetime.now(timezone.utc).replace(second=0,microsecond=0)
          d=d.replace(minute=(d.minute//5)*5)
          print(d.isoformat().replace('+00:00','Z'))
          PY
          )
          python - "$slot" > request.json <<'PY'
          import json,sys
          print(json.dumps({'schema_version':'eth-macro-d8-collect-cycle-request/1.0.0','expected_schedule_at':sys.argv[1],'canonical_slot':'M5','trace_id':'ci'}))
          PY
          curl -fsS -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' --data @request.json http://127.0.0.1:18080/v1/collect-cycle > first.json
          python - <<'PY'
          import json
          r=json.load(open('first.json'))
          assert r['overall_status']=='PASS', r
          assert r['hot_promotion']=='PROMOTED', r
          assert r['collection_gap_summary']['synthetic_fill'] is False
          print('FIRST_CYCLE_ID='+r['cycle_id'])
          PY
          echo "CONTAINER_MEMORY_FIRST=$(docker stats --no-stream --format '{{.MemUsage}}' d8-ci-1)"
          first_id=$(python -c "import json; print(json.load(open('first.json'))['cycle_id'])")
          persisted_source="$(docker exec d8-ci-1 python -c 'import sqlite3,sys; db=sqlite3.connect("/var/lib/eth-macro-data-bridge/d8-runtime.sqlite3"); row=db.execute("SELECT source_revision FROM cycles WHERE cycle_id=?",(sys.argv[1],)).fetchone(); print(row[0] if row else "")' "$first_id")"
          test "$persisted_source" = "$QUALIFIED_CHECKOUT_SHA"
          echo "D8_PERSISTED_CYCLE_SOURCE_REVISION=$persisted_source"
          echo "D8_PERSISTED_SOURCE_BINDING=PASS"
          docker stop -t 10 d8-ci-1 >/dev/null
          docker rm d8-ci-1 >/dev/null
          start_container d8-ci-2
          restart_source="$(docker exec d8-ci-2 python -c 'from d8_runtime import config_from_env; print(config_from_env().source_revision)')"
          test "$restart_source" = "$QUALIFIED_CHECKOUT_SHA"
          curl -fsS -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' --data @request.json http://127.0.0.1:18080/v1/collect-cycle > replay.json
          curl -fsS -H "Authorization: Bearer $TOKEN" http://127.0.0.1:18080/v1/readiness > readiness-after.json
          python - "$first_id" <<'PY'
          import json,sys
          replay=json.load(open('replay.json')); ready=json.load(open('readiness-after.json'))
          assert replay['cycle_id']==sys.argv[1]
          assert replay['overall_status']=='PASS'
          assert replay['replayed'] is True
          assert ready['hot_cycle_id']==sys.argv[1]
          assert ready['spool_rows'] > 0
          assert ready['ledger_rows'] > 0
          print('CONTAINER_RESTART=PASS')
          print('CONTAINER_SAME_SLOT_REPLAY=PASS')
          print('CONTAINER_HOT_RETAINED=PASS')
          print('CONTAINER_SPOOL_RETAINED=PASS')
          print('CONTAINER_LEDGER_RETAINED=PASS')
          PY
          echo "CONTAINER_IMAGE_REF=$IMAGE"
          echo "QUALIFIED_CONTAINER_IMAGE_DIGEST=$QUALIFIED_CONTAINER_IMAGE_DIGEST"
          echo "CONTAINER_SOURCE_BINDING=PASS"
