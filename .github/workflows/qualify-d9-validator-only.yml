name: Qualify D9 validators only

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - "tools/validation/validate_d9_sealing.py"
      - ".github/workflows/qualify-d9-validator-only.yml"

permissions:
  contents: read

concurrency:
  group: eth-macro-d9-validator-only-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: src:tools/deep_history:tools
    steps:
      - name: Checkout exact PR merge ref SHA
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Bind qualification to exact PR merge ref
        shell: bash
        run: |
          set -euo pipefail
          PR_NUMBER="${{ github.event.pull_request.number }}"
          EXPECTED_REF="refs/pull/${PR_NUMBER}/merge"
          ACTUAL_HEAD="$(git rev-parse HEAD)"
          echo "PR_NUMBER=$PR_NUMBER"
          echo "EXPECTED_PR_MERGE_REF=$EXPECTED_REF"
          echo "EXPECTED_QUALIFICATION_SHA=$GITHUB_SHA"
          echo "ACTUAL_QUALIFICATION_SHA=$ACTUAL_HEAD"
          test "$GITHUB_REF" = "$EXPECTED_REF"
          test "$ACTUAL_HEAD" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          echo "EXACT_PR_MERGE_REF_BINDING=PASS"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Prove tools-root import contract
        run: |
          python - <<'PY'
          import publication_control_v2
          import publication_reader_v2
          print("TOOLS_ROOT_IMPORT_CONTRACT=PASS")
          PY

      - name: Validate D9 contracts
        run: |
          python tools/validation/validate_d9_contracts.py
          echo "D9_CONTRACT_VALIDATION=PASS"

      - name: Validate D9 sealing contract
        run: |
          python tools/validation/validate_d9_sealing.py
          echo "D9_SEALING_VALIDATION=PASS"

      - name: Run full deep-history regression
        run: |
          python -m unittest discover -s tests/deep_history -p 'test_*.py' -v
          echo "DEEP_HISTORY_REGRESSION=PASS"

      - name: Compile source tools and tests
        run: |
          python -m compileall -q src tools tests
          echo "COMPILEALL=PASS"

      - name: Prove qualification is read-only
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          test -z "$(git status --porcelain -- history/generation-index.json history/generations)"
          echo "ELIGIBILITY_DETECTION_EXECUTED=NO"
          echo "CANDIDATE_BUILD_EXECUTED=NO"
          echo "COLD_PUBLICATION_EXECUTED=NO"
          echo "GENERATION_INDEX_CREATED=NO"
          echo "GENERATION_METADATA_CREATED=NO"
          echo "ACTIVE_AUTHORITY_MUTATION=NO"
          echo "QUALIFICATION_WORKTREE_CLEAN=PASS"
          echo "D9_VALIDATOR_ONLY_QUALIFICATION=PASS"
