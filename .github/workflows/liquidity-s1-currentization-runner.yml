name: Liquidity S1 currentization candidate runner

on:
  push:
    branches:
      - agent/liquidity-s1/canonical-ssot-installation-v1
    paths:
      - .github/workflows/liquidity-s1-currentization-runner.yml
      - .tmp/liquidity_s1_currentize_core.py
      - .tmp/s1_validator_template.py
      - .tmp/s1_test_template.py

permissions:
  contents: write

env:
  PYTHONPATH: .:src:tools:tools/deep_history

jobs:
  build-and-qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact candidate carrier
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Capture carrier authority
        shell: bash
        run: |
          set -euo pipefail
          echo "CARRIER_HEAD=$(git rev-parse HEAD)"
          echo "CARRIER_TREE=$(git rev-parse 'HEAD^{tree}')"
          git show -s --format='CARRIER_PARENTS=%P' HEAD

      - name: Build semantic currentization candidate
        shell: bash
        run: |
          set -euo pipefail
          python .tmp/liquidity_s1_currentize_core.py
          mv .liquidity-s1-candidate-manifest.json .tmp/liquidity-s1-candidate-manifest.json

      - name: Prove candidate diff boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          expected = {
              '.github/workflows/validate-repository.yml',
              'AGENTS.md',
              'bridge-contract.json',
              'contracts/liquidity-s1-semantic-contract-v1.json',
              'contracts/provider-contracts.json',
              'docs/semantics/capability-index.md',
              'docs/semantics/d9-operational-status-and-agent-usage-v1.md',
              'docs/semantics/fresh-current-agent-transport-v1.md',
              'docs/semantics/liquidity-s1-semantic-contract-v1.md',
              'tests/test_liquidity_s1_ssot.py',
              'tools/validation/validate_liquidity_s1_ssot.py',
          }
          lines = subprocess.check_output(['git','status','--porcelain=v1'], text=True).splitlines()
          changed = set()
          for line in lines:
              path = line[3:]
              if path in {'.liquidity-s1-candidate-manifest.json', '.tmp/liquidity-s1-candidate-manifest.json'}:
                  continue
              if path in {'.github/workflows/liquidity-s1-currentization-runner.yml', '.tmp/liquidity_s1_currentize_core.py', '.tmp/s1_validator_template.py', '.tmp/s1_test_template.py'}:
                  continue
              changed.add(path)
          assert changed == expected, (sorted(changed), sorted(expected))
          print('CANDIDATE_DIFF_BOUNDARY=PASS')
          print('CANDIDATE_CHANGED_FILE_COUNT=11')
          for path in sorted(changed):
              print('CANDIDATE_CHANGED_PATH=' + path)
          PY

      - name: Run S1 targeted qualification
        shell: bash
        run: |
          set -euo pipefail
          python tools/validation/validate_liquidity_s1_ssot.py
          python -m unittest discover -s tests -p 'test_liquidity_s1_ssot.py' -v

      - name: Run Fresh Current successor regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests/deep_history -p 'test_current_data*.py' -v
          python tools/validation/validate_v4.py

      - name: Run Kraken fail-closed regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_kraken_trade_flow*.py' -v

      - name: Compile candidate source and tooling
        run: python -m compileall -q src tools tests

      - name: Run full canonical repository qualification
        shell: bash
        run: |
          set -euo pipefail
          python tools/validation/validate_repository.py
          python tools/validation/validate_d9_contracts.py
          python tools/validation/validate_liquidity_s1_ssot.py
          python tools/validation/validate.py
          python tools/validation/validate_v4.py
          python tools/validation/validate_history.py
          python tools/validation/consumer_proof.py
          python tools/validation/validate_d9_resolution_v2.py
          python tools/capability_index.py validate
          python -m unittest discover -s tests/deep_history -p 'test_*.py' -v

      - name: Create unattached exact qualified Git tree
        id: git_objects
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_TREE: 9c1a71f06ef4555d102630128add9469a8ead64d
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, json, os, pathlib, urllib.request
          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          base_tree = os.environ['BASE_TREE']
          paths = [
              '.github/workflows/validate-repository.yml',
              'AGENTS.md',
              'bridge-contract.json',
              'contracts/liquidity-s1-semantic-contract-v1.json',
              'contracts/provider-contracts.json',
              'docs/semantics/capability-index.md',
              'docs/semantics/d9-operational-status-and-agent-usage-v1.md',
              'docs/semantics/fresh-current-agent-transport-v1.md',
              'docs/semantics/liquidity-s1-semantic-contract-v1.md',
              'tests/test_liquidity_s1_ssot.py',
              'tools/validation/validate_liquidity_s1_ssot.py',
          ]
          def post(endpoint, payload):
              data=json.dumps(payload,separators=(',',':')).encode()
              req=urllib.request.Request(f'https://api.github.com/repos/{repo}{endpoint}', data=data, method='POST', headers={
                  'Authorization': f'Bearer {token}', 'Accept':'application/vnd.github+json',
                  'X-GitHub-Api-Version':'2022-11-28', 'Content-Type':'application/json'})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)
          tree=[]
          for path in paths:
              raw=pathlib.Path(path).read_bytes()
              obj=post('/git/blobs', {'content':base64.b64encode(raw).decode(),'encoding':'base64'})
              print(f'CANDIDATE_BLOB={path} {obj["sha"]}')
              tree.append({'path':path,'mode':'100644','type':'blob','sha':obj['sha']})
          out=post('/git/trees', {'base_tree':base_tree,'tree':tree})
          print('CANDIDATE_GIT_TREE='+out['sha'])
          pathlib.Path('.tmp/candidate-git-tree.txt').write_text(out['sha']+'\n', encoding='utf-8')
          PY

      - name: Upload exact qualified candidate bytes
        uses: actions/upload-artifact@v4
        with:
          name: liquidity-s1-currentization-candidate-${{ github.run_id }}
          retention-days: 1
          if-no-files-found: error
          path: |
            .tmp/liquidity-s1-candidate-manifest.json
            .tmp/candidate-git-tree.txt
            .github/workflows/validate-repository.yml
            AGENTS.md
            bridge-contract.json
            contracts/liquidity-s1-semantic-contract-v1.json
            contracts/provider-contracts.json
            docs/semantics/capability-index.md
            docs/semantics/d9-operational-status-and-agent-usage-v1.md
            docs/semantics/fresh-current-agent-transport-v1.md
            docs/semantics/liquidity-s1-semantic-contract-v1.md
            tests/test_liquidity_s1_ssot.py
            tools/validation/validate_liquidity_s1_ssot.py
