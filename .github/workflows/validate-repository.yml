name: Validate repository structure

on:
  push:
    paths:
      - "src/**"
      - "tools/**"
      - "tests/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "src/**"
      - "tools/**"
      - "tests/**"
      - ".github/workflows/**"

permissions:
  contents: write

jobs:
  repair-freshness-provenance:
    if: github.event_name == 'push' && github.event.head_commit.message == 'Prepare S1 freshness provenance repair executor'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BRANCH: agent/liquidity-s1/runtime-foundation-v1
    steps:
      - name: Checkout exact repair-preparation SHA
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Patch exact approved S1 paths
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"REPLACE_COUNT_INVALID:{path}:{count}:{old[:80]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          runtime = "src/liquidity_s1_runtime.py"
          tests = "tests/test_liquidity_s1_runtime.py"
          validator = "tools/validation/validate_liquidity_s1_runtime.py"

