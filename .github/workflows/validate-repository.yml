name: DB-F S3 R01 qualification carrier

on:
  push:
    branches: [agent/db-f-s3-bounded-execution-r01]
    paths: [".github/workflows/validate-repository.yml"]

permissions:
  contents: write

env:
  PYTHONPATH: src:tools/deep_history:tools
  IMPLEMENTATION_BASE: f4ef5f59917096adee6d0ae2f9b75fafa633caa2
  PATCHER_GZIP_SHA256: 6af483b0258a4c43c22afbcfc8899dce9c9ad81f9907d2b936398be5a19c4921
  PATCHER_SHA256: 015bf4a60dbf92eb33cbd9e0621bf4b21395dabd7a9f0e4ce71f31c50753a05a

jobs:
  qualify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/db-f-s3-bounded-execution-r01
          fetch-depth: 10
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Recover verified WIP and apply lifecycle repair
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$IMPLEMENTATION_BASE" HEAD
          test "$(git rev-parse "$IMPLEMENTATION_BASE^{tree}")" = "336137646ba2b6a8ef4606d1fcd384c166547e0c"
          test "$(git diff --name-only "$IMPLEMENTATION_BASE" HEAD | tr -d '\r')" = ".github/workflows/validate-repository.yml"
          : > /tmp/dbf_s3_patcher.py.gz
          for blob in 93bf88667e72007e41ee34f0df698c31e5edd014 ddcf87fae81938e24cff65d2e67cd38ae07718cc 40bba9db95a5917c607500c4d861bef2dd5cd30d cb42ed9d7172f37f1a2c3d442261d38779d7c077 14eb982bc86572aff0a71dbcea6128560187ab3f 034f96ddeac2c7c9d463f40161a9381a77a0b0c1 4a9273f5883f2104b264b8b0e0df8d10ede1755d ae882e687e92b62df9bdc1939f68a6af4b555412; do
            gh api "repos/${GITHUB_REPOSITORY}/git/blobs/${blob}" --jq '.content' | tr -d '\n' | base64 -d >> /tmp/dbf_s3_patcher.py.gz
          done
          printf '%s  %s\n' "$PATCHER_GZIP_SHA256" /tmp/dbf_s3_patcher.py.gz | sha256sum -c -
          gzip -dc /tmp/dbf_s3_patcher.py.gz > /tmp/dbf_s3_patcher.py
          printf '%s  %s\n' "$PATCHER_SHA256" /tmp/dbf_s3_patcher.py | sha256sum -c -
          python -m py_compile /tmp/dbf_s3_patcher.py
          python /tmp/dbf_s3_patcher.py
          python - <<'PY'
          from pathlib import Path
          p=Path('src/liquidity_s3_executor.py')
          text=p.read_text()
          old='''            if parsed.get("feed")=="book_snapshot":\n                ack=True; snapshot=parsed; terminal_index=index; break\n            if parsed.get("feed")=="book": raise S3ExecutionError("FAIL_INCOMPLETE_OBSERVATION","KRAKEN_FUTURES_DELTA_BEFORE_INITIAL_SNAPSHOT")\n            if _futures_ack(parsed,plan): ack=True; continue\n            if parsed.get("event") in {"alert","error"}: raise S3ExecutionError("FAIL_RATE_LIMIT_OR_PROVIDER_REJECTION","KRAKEN_FUTURES_SUBSCRIPTION_REJECTED")'''
          new='''            if parsed.get("feed")=="book_snapshot":\n                ack=True; snapshot=parsed; terminal_index=index; break\n            if _futures_ack(parsed,plan): ack=True; continue\n            if parsed.get("feed")=="book": raise S3ExecutionError("FAIL_INCOMPLETE_OBSERVATION","KRAKEN_FUTURES_DELTA_BEFORE_INITIAL_SNAPSHOT")\n            if parsed.get("event") in {"alert","error"}: raise S3ExecutionError("FAIL_RATE_LIMIT_OR_PROVIDER_REJECTION","KRAKEN_FUTURES_SUBSCRIPTION_REJECTED")'''
          if old not in text: raise SystemExit('KRAKEN_FUTURES_LIFECYCLE_REPAIR_TARGET_MISSING')
          p.write_text(text.replace(old,new,1))
          print('KRAKEN_FUTURES_ACK_BEFORE_DELTA_REPAIR=PASS')
          PY
          test "$(cat tools/requirements-s3.txt)" = "websockets==17.1"
          echo "LOCAL_WIP_RECOVERED=YES"
          echo "TEMPORARY_IMPLEMENTATION_PATCHER_IN_REPOSITORY=NO"
          echo "WEBSOCKETS_EXACT_PIN=websockets==17.1"

      - name: Audit exact frozen scope
        shell: bash
        run: |
          set -euo pipefail
          git add -N src/liquidity_s3_executor.py tools/requirements-s3.txt tests/test_liquidity_s3_executor.py
          python - <<'PY'
          import subprocess
          base='f4ef5f59917096adee6d0ae2f9b75fafa633caa2'
          modify={
          'AGENTS.md','bridge-contract.json','contracts/provider-contracts.json','contracts/liquidity-s1-semantic-contract-v1.json','schema/capability-index.schema.json','history/capability-index.json','tools/_capability_index_v1.py','tools/capability_index.py','tools/current_data_transport.py','tools/current_data_request_scope.py','tools/current_data_promotion.py','tools/current_tail_admission.py','src/liquidity_s2_binance_adapter.py','src/liquidity_s2_kraken_spot_adapter.py','src/liquidity_s2_kraken_futures_adapter.py','.github/workflows/current-data-request.yml','.github/workflows/validate-repository.yml','docs/semantics/fresh-current-agent-transport-v1.md','docs/semantics/liquidity-s1-semantic-contract-v1.md','docs/semantics/d9-operational-status-and-agent-usage-v1.md','docs/semantics/capability-index.md','tools/validation/validate_liquidity_s1_ssot.py','tools/validation/validate_liquidity_s1_runtime.py','tools/validation/validate_liquidity_s2_binance_adapter.py','tools/validation/validate_liquidity_s2_kraken_spot_adapter.py','tools/validation/validate_liquidity_s2_kraken_futures_adapter.py','tools/validation/validate_d9_contracts.py','tests/deep_history/test_capability_index.py','tests/deep_history/test_current_data_transport.py','tests/deep_history/test_current_data_invocation_contract.py','tests/deep_history/test_current_data_request_scope_qualification.py','tests/deep_history/test_current_data_promotion.py','tests/deep_history/test_history_fresh_current_tail.py','tests/deep_history/test_d9_contract_foundation.py','tests/test_liquidity_s1_ssot.py','tests/test_liquidity_s2_binance_adapter.py','tests/test_liquidity_s2_kraken_spot_adapter.py','tests/test_liquidity_s2_kraken_futures_adapter.py'}
          add={'src/liquidity_s3_executor.py','tools/requirements-s3.txt','tests/test_liquidity_s3_executor.py'}
          rows=[x.split('\t',1) for x in subprocess.check_output(['git','diff','--name-status','--no-renames',base,'--'],text=True).splitlines() if x]
          gm={p for s,p in rows if s=='M'}; ga={p for s,p in rows if s=='A'}
          if gm!=modify or ga!=add: raise SystemExit(f'PATH_SCOPE_FAIL missing={sorted((modify|add)-{p for _,p in rows})} extra={sorted({p for _,p in rows}-(modify|add))} M={len(gm)} A={len(ga)}')
          print('CHANGED_PATH_COUNT=41'); print('ADD_COUNT=3'); print('MODIFY_COUNT=38'); print('UNEXPECTED_PATH_COUNT=0')
          PY
          for p in src/collector.py src/liquidity_s1_runtime.py src/intelligence.py .github/workflows/update-market.yml tools/current_data_pr_binding.py tools/validation/validate_v4.py tools/validation/validate_repository.py; do git diff --quiet "$IMPLEMENTATION_BASE" -- "$p"; done
          echo "S1_RUNTIME_MODIFIED=NO"
          echo "FORBIDDEN_PATH_BYTE_IDENTITY=PASS"

      - name: Install exact S3 dependency
        run: python -m pip install -r tools/requirements-s3.txt

      - name: Run targeted network-free qualification
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q src tools tests
          python tools/validation/validate_liquidity_s1_ssot.py
          python tools/validation/validate_liquidity_s1_runtime.py
          python tools/validation/validate_liquidity_s2_binance_adapter.py
          python tools/validation/validate_liquidity_s2_kraken_spot_adapter.py
          python tools/validation/validate_liquidity_s2_kraken_futures_adapter.py
          python -m unittest tests.test_liquidity_s3_executor tests.test_liquidity_s1_ssot tests.test_liquidity_s2_binance_adapter tests.test_liquidity_s2_kraken_spot_adapter tests.test_liquidity_s2_kraken_futures_adapter -v
          python -m unittest tests.deep_history.test_capability_index tests.deep_history.test_current_data_transport tests.deep_history.test_current_data_invocation_contract tests.deep_history.test_current_data_request_scope_qualification tests.deep_history.test_current_data_promotion tests.deep_history.test_history_fresh_current_tail tests.deep_history.test_d9_contract_foundation -v
          echo "TARGETED_TESTS=PASS"
          echo "NORMAL_TEST_NETWORK_CALLS=0"

      - name: Run canonical terminal validation
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q src tools tests
          python tools/validation/validate_repository.py
          python tools/validation/validate_d9_contracts.py
          python tools/validation/validate_liquidity_s1_ssot.py
          python tools/validation/validate_liquidity_s1_runtime.py
          python tools/validation/validate_liquidity_s2_binance_adapter.py
          python tools/validation/validate_liquidity_s2_kraken_spot_adapter.py
          python tools/validation/validate_liquidity_s2_kraken_futures_adapter.py
          python tools/validation/validate.py
          python tools/validation/validate_v4.py
          python tools/validation/validate_history.py
          python tools/validation/consumer_proof.py
          python tools/validation/validate_d9_resolution_v2.py
          python tools/capability_index.py validate
          python -m unittest discover -s tests/deep_history -p 'test_*.py' -v
          echo "COMPILE_SYNTAX_GATE=PASS"
          echo "CANONICAL_VALIDATION=PASS"
          echo "NETWORK_FREE_PROOF=PASS"

      - name: Publish qualified implementation commit
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          python - <<'PY'
          import subprocess
          r=[x.split('\t',1) for x in subprocess.check_output(['git','diff','--cached','--name-status','--no-renames','f4ef5f59917096adee6d0ae2f9b75fafa633caa2','--'],text=True).splitlines() if x]
          assert len(r)==41 and sum(s=='A' for s,_ in r)==3 and sum(s=='M' for s,_ in r)==38, r
          print('FINAL_PATH_AUDIT=PASS')
          PY
          git config user.name "DB-F S3 implementation agent"
          git config user.email "db-f-s3-agent@users.noreply.github.com"
          git commit -m "feat(liquidity): implement bounded selective S3 execution"
          echo "IMPLEMENTATION_COMMIT=$(git rev-parse HEAD)"
          echo "IMPLEMENTATION_TREE=$(git rev-parse 'HEAD^{tree}')"
          git push origin HEAD:refs/heads/agent/db-f-s3-bounded-execution-r01
