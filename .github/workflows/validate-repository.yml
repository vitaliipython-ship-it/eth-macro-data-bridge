        r["temporal_provenance"]["authority_owner"] = "caller"
        sat = evaluate_resource_satisfaction(r, request(250))
        self.assertEqual(sat["status"], "NOT_QUALIFIED")
        self.assertFalse(sat["reusable"])

    def test_126_canonical_resource_temporal_revalidation_idempotent(self):
        r = legit_resource(age=1)
        self.assertEqual(validate_qualified_liquidity_resource(r), r)
        self.assertEqual(validate_qualified_liquidity_resource(validate_qualified_liquidity_resource(r)), r)

    def test_127_legitimate_fresh_resource_remains_reusable(self):
        r = legit_resource(age=0)
        plan = plan_liquidity_acquisition(request(250, max_age=60), capability(), r)
        self.assertEqual(plan["decision"], "REUSE")
        self.assertFalse(plan["network_required"])

    def test_128_legitimate_stale_resource_requires_acquisition(self):
        r = legit_resource(age=61)
        plan = plan_liquidity_acquisition(request(250, max_age=60), capability(), r)
        self.assertEqual(plan["decision"], "ACQUISITION_REQUIRED")
        self.assertTrue(plan["network_required"])

    def test_129_planner_revalidates_freshness_at_current_evaluation_time(self):
        r = legit_resource(age=0)
        self.assertTrue(r["request_satisfied"])
        with patch("liquidity_s1_runtime._utc_now_ms", return_value=TEST_EVALUATION_TIME_MS + 61 * 1000):
            plan = plan_liquidity_acquisition(request(250, max_age=60), capability(), r)
        self.assertEqual(plan["decision"], "ACQUISITION_REQUIRED")
        self.assertTrue(plan["network_required"])
        self.assertIn("STALE", plan["resource_satisfaction"]["reasons"])


