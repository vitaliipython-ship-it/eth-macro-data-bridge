    _require(isinstance(value, int) and not isinstance(value, bool) and value >= 0, f"{field}_INVALID")
    return int(value)


def _utc_now_ms() -> int:
    """Capture the same UTC wall-clock model used by current-data freshness evaluation."""
    return int(datetime.now(timezone.utc).timestamp() * 1000)


def _derive_temporal_provenance(
    normalized_book: Mapping[str, Any],
    *,
    evaluation_time_ms: int,
) -> dict[str, Any]:
    evaluation = _positive_int(evaluation_time_ms, "EVALUATION_TIME_MS")
    observation = _positive_int(normalized_book.get("timestamp_ms"), "OBSERVATION_TIMESTAMP_MS")
    _require(evaluation >= observation, "OBSERVATION_TIMESTAMP_IN_FUTURE")
    age = (evaluation - observation) // 1000
    return {
        "authority_owner": TEMPORAL_AUTHORITY_OWNER,
        "authority_model": TEMPORAL_AUTHORITY_MODEL,
        "evaluation_time_ms": evaluation,
        "observation_timestamp_ms": observation,
        "derived_age_seconds": age,
    }


def _validate_temporal_provenance(
    temporal_provenance: Mapping[str, Any],
    normalized_book: Mapping[str, Any],
) -> dict[str, Any]:
    _require(isinstance(temporal_provenance, Mapping), "TEMPORAL_PROVENANCE_REQUIRED")
    _require(set(temporal_provenance) == TEMPORAL_PROVENANCE_FIELDS, "TEMPORAL_PROVENANCE_FIELDS_INVALID")
    _require(
        temporal_provenance.get("authority_owner") == TEMPORAL_AUTHORITY_OWNER,
        "TEMPORAL_AUTHORITY_OWNER_INVALID",
    )
    _require(
        temporal_provenance.get("authority_model") == TEMPORAL_AUTHORITY_MODEL,
        "TEMPORAL_AUTHORITY_MODEL_INVALID",
    )
    canonical = _derive_temporal_provenance(
        normalized_book,
        evaluation_time_ms=_positive_int(temporal_provenance.get("evaluation_time_ms"), "EVALUATION_TIME_MS"),
    )
    _require(
        temporal_provenance.get("observation_timestamp_ms") == canonical["observation_timestamp_ms"],
        "TEMPORAL_OBSERVATION_TIMESTAMP_MISMATCH",
    )
    _require(
        temporal_provenance.get("derived_age_seconds") == canonical["derived_age_seconds"],
        "TEMPORAL_DERIVED_AGE_MISMATCH",
    )
    _require(dict(temporal_provenance) == canonical, "TEMPORAL_PROVENANCE_NOT_CANONICAL")
    return canonical


