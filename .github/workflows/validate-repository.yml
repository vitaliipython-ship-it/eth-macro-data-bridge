name: DB-F S3 R01 focused diagnostic

on:
  push:
    branches: [agent/db-f-s3-bounded-execution-r01]
    paths: [".github/workflows/validate-repository.yml"]

permissions:
  contents: read

env:
  PYTHONPATH: src:tools/deep_history:tools
  IMPLEMENTATION_BASE: f4ef5f59917096adee6d0ae2f9b75fafa633caa2
  PATCHER_GZIP_SHA256: 6af483b0258a4c43c22afbcfc8899dce9c9ad81f9907d2b936398be5a19c4921
  PATCHER_SHA256: 015bf4a60dbf92eb33cbd9e0621bf4b21395dabd7a9f0e4ce71f31c50753a05a

jobs:
  diagnose-kraken-futures:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/db-f-s3-bounded-execution-r01
          fetch-depth: 8
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Recover and apply frozen patcher
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/dbf_s3_patcher.py.gz
          for blob in 93bf88667e72007e41ee34f0df698c31e5edd014 ddcf87fae81938e24cff65d2e67cd38ae07718cc 40bba9db95a5917c607500c4d861bef2dd5cd30d cb42ed9d7172f37f1a2c3d442261d38779d7c077 14eb982bc86572aff0a71dbcea6128560187ab3f 034f96ddeac2c7c9d463f40161a9381a77a0b0c1 4a9273f5883f2104b264b8b0e0df8d10ede1755d ae882e687e92b62df9bdc1939f68a6af4b555412; do
            gh api "repos/${GITHUB_REPOSITORY}/git/blobs/${blob}" --jq '.content' | tr -d '\n' | base64 -d >> /tmp/dbf_s3_patcher.py.gz
          done
          printf '%s  %s\n' "$PATCHER_GZIP_SHA256" /tmp/dbf_s3_patcher.py.gz | sha256sum -c -
          gzip -dc /tmp/dbf_s3_patcher.py.gz > /tmp/dbf_s3_patcher.py
          printf '%s  %s\n' "$PATCHER_SHA256" /tmp/dbf_s3_patcher.py | sha256sum -c -
          python /tmp/dbf_s3_patcher.py
          python -m pip install -r tools/requirements-s3.txt >/dev/null
      - name: Print exact Kraken Futures failure envelope
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from unittest.mock import patch
          import current_data_transport
          from tests.test_liquidity_s3_executor import NOW, NONCE, req, provider_plan, FakeTransport
          from liquidity_s3_executor import execute_s3
          request=req('kraken-futures','PI_ETHUSD','FUTURES_L2_BOOK')
          s1,plan=provider_plan(request)
          fake=FakeTransport()
          with patch.object(current_data_transport,'_utc_now',return_value=NOW):
              result=execute_s3(request,s1,plan,transport=fake,execution_nonce=NONCE)
          print('FAKE_CALLS='+str(fake.calls))
          print('STATUS='+str(result['status']))
          print('TERMINAL_STATUS='+str(result['receipt']['terminal_status']))
          print('ERROR_CLASS='+str(result['receipt']['error_class']))
          print('RAW_MESSAGE_COUNT='+str(result['receipt']['raw_message_count']))
          print('WS_ACK='+str(result['receipt']['ws_subscription_acknowledged']))
          print('WS_INDEX='+str(result['receipt']['ws_terminal_snapshot_message_index']))
          print('PLAN='+str(plan))
          PY
