name: D8 one-shot source materialization

on:
  push:
    branches:
      - "agent/d8-vps-unified-acquisition-runtime"
    paths:
      - ".d8-bootstrap/READY"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact D8 branch
        uses: actions/checkout@v4
        with:
          ref: agent/d8-vps-unified-acquisition-runtime
          fetch-depth: 1
      - name: Verify and materialize D8 source
        shell: bash
        run: |
          set -euo pipefail
          cat .d8-bootstrap/part-* | base64 -d > /tmp/d8payload.tar.gz
          echo "3d7785fdc0d8d383578f3fa02f62df6bbabb21c6ff304e53d3e900ab617a4014  /tmp/d8payload.tar.gz" | sha256sum -c -
          tar -xzf /tmp/d8payload.tar.gz -C .
          if ! grep -q '^## D8 VPS unified acquisition runtime source candidate$' AGENTS.md; then
            cat >> AGENTS.md <<'EOF'

## D8 VPS unified acquisition runtime source candidate

- Canonical source contract: `contracts/d8-runtime-candidate.json`.
- Operational source semantics: `docs/semantics/d8-vps-unified-acquisition-runtime-v1.md`.
- Server handoff: `docs/handoffs/d8-vps-runtime-integration-handoff-v1.md`.
- Entrypoint: `python -m d8_service`; container: `Dockerfile.d8`.
- Status: `SOURCE_CANDIDATE_NOT_DEPLOYED`; VPS shadow source supported, VPS_ACTIVE forbidden by candidate.
- D8 does not change `D9_ACTIVE=NO`, `ACTIVE_DEFAULT_ROUTE=D6_RESOLUTION_PLAN_V1`, the hourly GitHub production acquisition schedule, or Binance USD-M GitHub `DISABLED_BY_POLICY` / `network_calls=0`.
EOF
          fi
          rm -rf .d8-bootstrap
          git config user.name "eth-macro-d8[bot]"
          git config user.email "eth-macro-d8[bot]@users.noreply.github.com"
          git add AGENTS.md Dockerfile.d8 contracts/d8-runtime-candidate.json docs/semantics/d8-vps-unified-acquisition-runtime-v1.md docs/handoffs/d8-vps-runtime-integration-handoff-v1.md src/d8_runtime.py src/acquisition_core.py src/d8_service.py tests/d8 .github/workflows/qualify-d8-runtime.yml
          git add -A .d8-bootstrap
          git diff --cached --check
          git status --short
          git commit -m "feat(d8): materialize unified VPS acquisition runtime"
          git push origin HEAD:agent/d8-vps-unified-acquisition-runtime
