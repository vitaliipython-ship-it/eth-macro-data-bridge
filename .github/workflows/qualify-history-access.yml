name: Qualify D6.2 history access

on:
  workflow_dispatch:
  push:
    branches:
      - agent/d62-history-access-v1
    paths:
      - "tools/capability_index.py"
      - "tools/history_access.py"
      - "tools/validation/qualify_history_access.py"
      - "tests/deep_history/test_d62_history_access.py"
      - "history/capability-index.json"
      - "history/release-manifest.json"
      - "history/manifest.json"
      - ".github/workflows/qualify-history-access.yml"

permissions:
  contents: read

concurrency:
  group: d62-history-access-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .:src:tools/deep_history
    steps:
      - name: Checkout current ref
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Compile D6.2 tooling
        run: python -m compileall -q tools/capability_index.py tools/history_access.py tools/validation/qualify_history_access.py tests/deep_history/test_d62_history_access.py
      - name: Run D6.2 adversarial tests
        run: python -m unittest tests.deep_history.test_d62_history_access -v
      - name: Qualify real immutable 2022 COLD slice
        run: python tools/validation/qualify_history_access.py
