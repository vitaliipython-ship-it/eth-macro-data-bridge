name: Probe Kraken overlap

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/deep_history/**"
      - "tests/deep_history/**"
      - "derivatives/metric-semantics.json"
      - "src/intelligence.py"
      - ".github/workflows/probe-kraken-overlap.yml"

permissions:
  contents: read

jobs:
  offline_policy:
    name: Offline Kraken overlap policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Run offline policy tests
        run: |
          set -euo pipefail
          export PYTHONPATH="${PWD}/tools/deep_history:${PWD}:${PYTHONPATH:-}"
          python -m unittest tests.deep_history.test_release_overlap_policy -v
          python -m unittest discover -s tests/deep_history -p 'test_probe_kraken_overlap_workflow_policy.py' -v
          echo PROBE_OFFLINE_POLICY=PASS
          echo PROVIDER_MARKET_DATA_NETWORK_CALLS=0

  live_policy:
    name: Live Kraken overlap policy (manual only)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Qualify policy against live Git overlap
        run: python tools/deep_history/qualify_kraken_overlap_policy.py
