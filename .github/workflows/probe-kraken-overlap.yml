name: Probe Kraken overlap

on:
  workflow_dispatch:
  push:
    paths:
      - "kraken_overlap_probe.py"
      - "qualify_kraken_overlap_policy.py"
      - "release_overlap_policy.py"
      - "publish_deep_history.py"
      - "test_release_overlap_policy.py"
      - "test_release_overlap_schema.py"
      - "derivatives/metric-semantics.json"
      - "intelligence.py"
      - ".github/workflows/probe-kraken-overlap.yml"

permissions:
  contents: read

concurrency:
  group: eth-macro-kraken-overlap-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout current main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Qualify overlap policy
        run: |
          python -m compileall -q release_publisher.py release_overlap_policy.py publish_deep_history.py kraken_overlap_probe.py qualify_kraken_overlap_policy.py test_release_overlap_policy.py test_release_overlap_schema.py
          python -m unittest -v test_release_overlap_policy.py test_release_overlap_schema.py
      - name: Qualify policy against live Git overlap
        run: python qualify_kraken_overlap_policy.py
