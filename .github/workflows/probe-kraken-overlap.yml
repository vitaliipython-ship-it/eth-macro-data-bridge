name: Probe Kraken overlap

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/deep_history/**"
      - "tests/deep_history/**"
      - "derivatives/metric-semantics.json"
      - "src/intelligence.py"
      - ".github/workflows/probe-kraken-overlap.yml"

permissions:
  contents: read

concurrency:
  group: eth-macro-kraken-overlap-probe-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: src:tools/deep_history:tools
    steps:
      - name: Checkout current ref
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Qualify overlap policy
        run: |
          python -m compileall -q src tools tests
          python -m unittest discover -s tests/deep_history -p 'test_*.py' -v
      - name: Qualify policy against live Git overlap
        run: python tools/deep_history/qualify_kraken_overlap_policy.py
